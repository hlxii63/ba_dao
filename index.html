  /* ------------------------------------------------- 结算演出（时间轴） */
  /** 一句话说清这一拍干了什么 */
  function beatText(rep, hits, back, steal) {
    const label = Object.keys(rep.items || {})
      .map(id => `${B.ITEMS[id] ? B.ITEMS[id].name : id}×${rep.items[id]}`).join('、') || '空手';
    if (hits.length) return `⚔ ${label} → ${hits.map(hitLabel).join('、')}`;
    if (back.length) return `🪃 反盾弹回 → ${back.map(nameOf).join('、')}`;
    if (steal.length) return `🫳 偷 → ${steal.map(s => s.name).join('、')}`;
    return label;
  }

  /** 把一回合排成一串"拍子"：每一拍＝一个出手的人，以及他打到谁身上 */
  function buildTimeline(res) {
    const beats = [];
    (res ? res.reports : []).forEach(rep => {
      const hits = (rep.hits || []).filter(h => h.dmg > 0 || h.item === 'cibao');
      const back = rep.reverseBack || [];
      const steal = rep.stolenFrom || [];
      if (!hits.length && !back.length && !steal.length) return;   // 没动手的人不占拍子
      beats.push({ rep: rep, hits: hits, back: back, steal: steal, text: beatText(rep, hits, back, steal) });
    });
    const total = Math.max(1600, app.remainTotal || 5000);
    // 放慢节奏：每拍之间至少 320ms，最多 1.1s，别让多个人的动作挤在一起
    const step = Math.max(320, Math.min(1100, total * 0.62 / Math.max(1, beats.length)));
    const impactOf = {}, actsAt = {};
    (res ? res.reports : []).forEach(rep => { impactOf[rep.id] = total * 0.42; actsAt[rep.id] = 0; });
    beats.forEach((b, i) => {
      b.t = i * step;
      b.impact = b.t + step * 0.55;
      actsAt[b.rep.id] = b.t;
      b.hits.forEach(h => { impactOf[h.to] = Math.max(impactOf[h.to] || 0, b.impact); });
      b.back.forEach(id => { impactOf[id] = Math.max(impactOf[id] || 0, b.impact); });
      b.steal.forEach(s => { impactOf[s.id] = Math.max(impactOf[s.id] || 0, b.impact); });
    });
    return { beats: beats, step: step, total: total, impactOf: impactOf, actsAt: actsAt };
  }

  /** 顶部字幕条：按拍子依次念出"现在演到谁"，后来的盖住前面的 */
  function captionHtml(tl) {
    if (!tl.beats.length) return `<div class="reveal-caption"><span class="cap" style="animation-delay:120ms">这一回合大家都在观望…</span></div>`;
    return `<div class="reveal-caption">${tl.beats.map(b =>
      `<span class="cap" style="animation-delay:${b.t + 80}ms">${esc(b.rep.name)} ${esc(b.text)}</span>`).join('')}</div>`;
  }

  /** 玩家棋盘：出招阶段与结算演出共用；复盘也走这一套，所以复盘画面和当时长得一模一样 */
  function playersHtml(pub, reveal, tl, animate) {
    return `<div class="players">${pub.players.map((p, i) => playerCard(p, i, reveal, tl, animate)).join('')}</div>`;
  }

  function playerCard(p, i, reveal, tl, animate) {
    const flags = [];
    if (p.isHost) flags.push('<span class="badge amber">房主</span>');
    if (p.isBot) flags.push('<span class="badge grey">电脑</span>');
    if (p.id === app.me) flags.push('<span class="badge blue">你</span>');
    if (!p.connected) flags.push('<span class="badge red">掉线</span>');
    if (!p.alive) flags.push('<span class="badge red">💀 出局</span>');
    else if (p.inDuel && p.duel) flags.push(`<span class="badge red">决斗中 ${p.duel.cleared.length}/${p.duel.targets.length} · 剩 ${p.duel.left}</span>`);
    else if (p.selfGuardUntil >= (app.pub.round || 0)) flags.push(`<span class="badge purple">自守保护至 R${p.selfGuardUntil}</span>`);
    if (!reveal && p.alive && p.submitted) flags.push('<span class="badge green">已锁定</span>');

    let act = '', dying = false, acting = false, hitShake = false;
    if (reveal && p.picks && tl) {
      const rep = app.pub.lastResult ? app.pub.lastResult.reports.find(r => r.id === p.id) : null;
      const actT = tl.actsAt[p.id] || 0;
      const impT = tl.impactOf[p.id] !== undefined ? tl.impactOf[p.id] : tl.total * 0.42;
      const events = rep ? rep.events : [];
      const hits = (rep && rep.hits) || [];
      const incoming = incomingOf(p.id, tl);
      const cls = animate ? 'rv' : '';
      dying = events.some(e => /阵亡|暴毙/.test(e));
      acting = hits.length > 0 || (rep && rep.reverseBack && rep.reverseBack.length) || (rep && rep.stolenFrom && rep.stolenFrom.length);
      hitShake = animate && incoming.length > 0 && !dying;
      const dmg = rep && rep.damage > 0 ? rep.damage : 0;

      // 出招行：优先写成"谁打谁"（上吊×1 → 老王 −3），偷单独写，其余退回普通描述
      // 注意用战报快照（rep.items），不能用 p.picks —— 结算末尾已经把手牌清空了
      const itemsSnap = rep && rep.items ? rep.items : ((p.picks && p.picks.items) || {});
      const stealSnap = rep && rep.steal ? rep.steal : ((p.picks && p.picks.steal) || []);
      const itemLabel = Object.keys(itemsSnap)
        .map(id => `${B.ITEMS[id] ? B.ITEMS[id].name : id}×${itemsSnap[id]}`).join('、');
      let head;
      if (hits.length) head = `${itemLabel} → ${hits.map(hitLabel).join('、')}`;
      else if (itemsSnap.tou) head = `偷 → ${stealSnap.map(nameOf).join('、') || '（没选人）'}`;
      else head = itemLabel || B.describePicks(app.pub, { items: itemsSnap, alloc: (rep && rep.alloc) || {}, steal: stealSnap });
      const costTxt = (rep && rep.cost != null && rep.cost > 0) ? `<span class="cost">消耗 ${fmtNum(rep.cost)} 点</span>` : '';

      // 挨打明细：每一击在对应拍子打到身上，最后给出"谁+谁=总共多少 − 防御 = 掉多少"
      let sumLine = '';
      if (rep && rep.gross > 0) {
        const who = incoming.length ? incoming.map(x => `${x.from} ${fmtNum(x.dmg)}`).join(' + ') : '挨打';
        const defTxt = rep.defAttack
          ? `防御 ${fmtNum(rep.def)}（含刀自带 ${fmtNum(rep.defAttack)}）`
          : `防御 ${fmtNum(rep.def)}`;
        const tail = dmg > 0 ? `掉 ${fmtNum(dmg)} 点` : '全部挡下';
        sumLine = `<span class="ev sumline ${cls}" style="animation-delay:${impT + 240}ms">🧮 ${esc(who)} = ${fmtNum(rep.gross)} 点 − ${defTxt} = ${tail}</span>`;
      }

      act = `<div class="act ${cls}" style="animation-delay:${actT}ms">
        <div class="who">出招：${esc(head)}${costTxt}</div>
        ${incoming.map(inc => `<span class="ev hit2 ${cls}" style="animation-delay:${inc.t}ms">🩸 被 ${esc(inc.from)} 的「${esc(inc.itemName)}」打 −${fmtNum(inc.dmg)}</span>`).join('')}
        ${events.map((e, j) => {
          const k = /阵亡|暴毙|☠️/.test(e) ? 'hit' : (/获得|防御|挡下|反盾成功/.test(e) ? 'good' : '');
          return `<span class="ev ${k} ${cls}" style="animation-delay:${impT + 120 + j * 95}ms">· ${esc(e)}</span>`;
        }).join('')}
        ${sumLine}
      </div>`;
      if (dmg) {
        act = `<span class="dmgfly ${animate ? 'rv-dmg' : ''}" style="animation-delay:${impT + 240}ms">−${fmtNum(dmg)}</span>` + act;
      }
      if (dying) {
        act += `<span class="skull ${cls}" style="animation-delay:${impT + 330}ms">💀</span>`;
      }
    }
    return `<div class="pcard ${p.id === app.me ? 'me' : ''} ${!p.alive ? 'fully-dead' : ''} ${acting && animate ? 'acting' : ''}"
        data-pid="${esc(p.id)}" style="animation-delay:${tl ? (tl.actsAt[p.id] || 0) : 0}ms">
      <div class="inner ${dying && animate ? 'dying' : ''} ${hitShake ? 'hit' : ''}"
        style="animation-delay:${tl ? (tl.impactOf[p.id] !== undefined ? tl.impactOf[p.id] : tl.total * 0.42) : 0}ms">
      <div class="pname">
        <span class="avatar" style="background:${avatarOf(p)}">${initial(p.name)}</span>
        <span class="ellipsis">${esc(p.name)}</span>
      </div>
      <div class="stats">
        <span>❤ <b>${p.alive ? fmtHp(p.hp) : '—'}</b></span>
        <span title="${p.points === null ? '要等结算才公开' : '点数'}">🪙 <b>${p.points === null ? '?' : fmtNum(p.points)}</b></span>
      </div>
      <div class="flags">${flags.join('')}</div>
      ${act}
      </div>
    </div>`;
  }

  /* ------------------------------------------- 飞刀 / 盾牌：几何特效层 */
  // 这件道具飞出去"几把"、长什么样：双刀就是两把刀子，五刀就是五把
  const PROJECTILE = {
    yidao: ['🗡️', 1], shuangdao: ['🗡️', 2], shangdiao: ['🪢', 1], sidao: ['🔪', 4], wudao: ['🗡️', 5],
    caihong: ['🌈', 1], cibao: ['🧲', 1], diefei: ['🥩', 1], podun: ['🪓', 1], du: ['☠️', 1], tou: ['🫳', 1]
  };
  function projFor(itemId, n) {
    const p = PROJECTILE[itemId];
    const icon = p ? p[0] : ((B.ITEMS[itemId] && B.ITEMS[itemId].icon) || '•');
    const count = p ? p[1] : Math.max(1, Math.floor(n || 1));
    return { icon: icon, count: Math.max(1, Math.min(5, count)) };
  }

  /* 防御类道具的特效：每种长相、颜色、动作都不一样，空放（没人打你）也要亮一下 */
  const DEF_FX = {
    busi: { icon: '💚', cls: 'd-busi', label: '不死 · 防 1' },
    xiaofang: { icon: '🛡️', cls: 'd-xiaofang', label: '小防 · 防 2' },
    dafang: { icon: '🛡', cls: 'd-dafang', label: '大防 · 防 3' },
    cidun: { icon: '🧿', cls: 'd-cidun', label: '磁盾 · 防 5' },
    heidong: { icon: '🕳️', cls: 'd-heidong', label: '黑洞 · 防 8' },
    baidong: { icon: '⚪', cls: 'd-baidong', label: '白洞 · 防 ∞' },
    xiaofan: { icon: '🪃', cls: 'd-fan', label: '小反 · 弹 2' },
    dafan: { icon: '🪃', cls: 'd-fan', label: '大反 · 弹 4' },
    chaofan: { icon: '🪃', cls: 'd-fan', label: '超反 · 弹 6.5' },
    hezhang: { icon: '🙏', cls: 'd-hezhang', label: '合掌 · 血 +1' },
    zishou: { icon: '🧘', cls: 'd-zishou', label: '自守 · 防 1' }
  };
  /** 这个玩家本回合出的防御类道具对应哪套特效 */
  function defFxOf(rep) {
    if (!rep || !rep.items) return null;
    const id = Object.keys(rep.items).find(k => DEF_FX[k]);
    return id ? DEF_FX[id] : null;
  }

  /** 在玩家格子上放一层"会飞的道具 + 盾牌"，让"谁打谁"变成看得见的动作 */
  function drawFx(tl) {
    const wrap = $('.players');
    if (!wrap) return;
    const old = wrap.querySelector('.fx');
    if (old) old.remove();
    const pub = app.pub, res = pub && pub.lastResult;
    if (!pub || pub.phase !== 'reveal' || !res || !tl) return;
    // 浏览器不支持沿路径运动（offset-path）就老老实实用连线
    if (typeof CSS === 'undefined' || !CSS.supports || !CSS.supports('offset-path', 'path("M 0 0 L 1 1")')) return;
    if ((app.remainTotal - app.remainMs) > app.remainTotal * 0.7) return;
    const box = wrap.getBoundingClientRect();
    if (!box.width || !box.height) return;

    const fx = document.createElement('div');
    fx.className = 'fx';
    const geo = id => {
      const el = wrap.querySelector(`[data-pid="${id}"]`);
      if (!el) return null;
      const r = el.getBoundingClientRect();
      if (!r.width && !r.height) return null;
      return { x: r.left - box.left + r.width / 2, y: r.top - box.top + r.height / 2, w: r.width || 60, h: r.height || 40 };
    };
    const ends = (a, b) => {                       // 两端收到卡片边缘，别糊住头像
      const dx = b.x - a.x, dy = b.y - a.y;
      const len = Math.hypot(dx, dy) || 1, ux = dx / len, uy = dy / len;
      const edge = (g, sign) => {
        const tx = ux ? Math.abs((g.w / 2 + 10) / ux) : Infinity;
        const ty = uy ? Math.abs((g.h / 2 + 10) / uy) : Infinity;
        const t = Math.min(tx, ty, len / 2);
        return { x: g.x + sign * ux * t, y: g.y + sign * uy * t };
      };
      return { from: edge(a, 1), to: edge(b, -1), len: len };
    };
    const curve = (p1, p2, bend) => {
      const mx = (p1.x + p2.x) / 2, my = (p1.y + p2.y) / 2;
      const dx = p2.x - p1.x, dy = p2.y - p1.y, nl = Math.hypot(dx, dy) || 1;
      return `M ${p1.x.toFixed(1)} ${p1.y.toFixed(1)} Q ${(mx + (-dy / nl) * bend).toFixed(1)} ${(my + (dx / nl) * bend).toFixed(1)} ${p2.x.toFixed(1)} ${p2.y.toFixed(1)}`;
    };
    const fly = (icon, d, delay, opt) => {
      const el = document.createElement('span');
      el.className = 'fly' + (opt && opt.back ? ' back' : '');
      el.textContent = icon;
      el.style.offsetPath = `path('${d}')`;
      el.style.animationDelay = `${delay}ms, ${delay + 550}ms`;      // 飞行 550ms，再淡出
      fx.appendChild(el);
    };
    const shield = (g, delay, kind, def) => {
      const el = document.createElement('span');
      el.className = 'shield ' + kind + (def ? ' ' + def.cls : '');
      el.textContent = def ? def.icon : '🛡️';
      el.style.left = g.x.toFixed(1) + 'px';
      el.style.top = g.y.toFixed(1) + 'px';
      el.style.animationDelay = `${delay}ms, ${delay + 1500}ms`;
      fx.appendChild(el);
    };
    // 防御类道具的特效（含空放：没人打你也要亮）
    const defenseFx = (g, delay, def, broken) => {
      const el = document.createElement('span');
      el.className = 'dfx ' + def.cls + (broken ? ' broken' : '');
      el.style.left = g.x.toFixed(1) + 'px';
      el.style.top = g.y.toFixed(1) + 'px';
      el.style.animationDelay = `${delay}ms`;
      el.innerHTML = `<i class="ic">${def.icon}</i><b class="lb">${broken ? '被反刀破盾' : def.label}</b>`;
      fx.appendChild(el);
    };

    // 记下"谁朝我飞了什么"，反盾弹回时按原样飞回去
    const incomingIcon = {};
    tl.beats.forEach(b => b.hits.forEach(h => {
      const n = (b.rep.alloc && b.rep.alloc[h.item] && b.rep.alloc[h.item][h.to]) || 1;
      (incomingIcon[h.to] = incomingIcon[h.to] || []).push(projFor(h.item, n).icon);
    }));

    tl.beats.forEach(b => {
      const gFrom = geo(b.rep.id);
      if (!gFrom) return;
      b.hits.forEach(h => {
        const gTo = geo(h.to);
        if (!gTo) return;
        const e = ends(gFrom, gTo);
        const n = (b.rep.alloc && b.rep.alloc[h.item] && b.rep.alloc[h.item][h.to]) || 1;
        const pr = projFor(h.item, n);
        const repTo = res.reports.find(r => r.id === h.to) || {};
        const devDef = defFxOf(repTo);
        const blocked = repTo.gross > 0 && !(repTo.damage > 0) && !(repTo.reverse && repTo.reverse.success);
        for (let k = 0; k < pr.count; k++) {
          const spread = (k - (pr.count - 1) / 2) * 9;
          fly(pr.icon, curve({ x: e.from.x + spread, y: e.from.y }, { x: e.to.x + spread, y: e.to.y }, 16 + k * 5),
            b.t + k * 45, {});
        }
        if (blocked) shield(gTo, Math.max(0, b.impact - 80), 'block', devDef);   // 被挡下：用他出的那面盾
      });
      if (b.back.length) {                        // 反盾：盾牌一顶，飞来的刀子原样弹回去
        b.back.forEach(aid => {
          const gTo = geo(aid);
          if (!gTo) return;
          const e = ends(gFrom, gTo);
          (incomingIcon[b.rep.id] || ['🗡️']).slice(0, 3).forEach((ic, k) => {
            fly(ic, curve({ x: e.from.x + k * 8, y: e.from.y }, { x: e.to.x + k * 8, y: e.to.y }, 18 + k * 5),
              b.t + 340 + k * 70, { back: true });
          });
        });
        shield(gFrom, b.t + 60, 'rev', defFxOf(b.rep));
      }
      if (b.steal.length) {                       // 偷：一只手飘过去
        b.steal.forEach((s, k) => {
          const gTo = geo(s.id);
          if (!gTo) return;
          const e = ends(gFrom, gTo);
          fly('🫳', curve(e.from, e.to, 14 + k * 5), b.t + k * 60, {});
        });
      }
    });
    // 每个出了防御类道具的人都亮一下自己的那套特效（空放也亮）；
    // 被人用「反刀」完全破盾的，亮"破盾"
    res.reports.forEach(rep => {
      const def = defFxOf(rep);
      if (!def) return;
      const g = geo(rep.id);
      if (!g) return;
      const at = tl.actsAt[rep.id] || Math.round(tl.total * 0.28);
      const broken = !!(rep.reverse && rep.reverse.nullified);
      defenseFx(g, at + 120, def, broken);
    });

    wrap.appendChild(fx);
  }

  /** 这一回合谁打了他（画连线 + 卡片上写明细都用它），带"什么时候打到的" */
  function incomingOf(id, tl) {
    if (!tl) return [];
    const out = [];
    tl.beats.forEach(b => b.hits.forEach(h => {
      if (h.to !== id) return;
      out.push({
        from: b.rep.name,
        itemName: B.ITEMS[h.item] ? B.ITEMS[h.item].name : h.item,
        dmg: h.dmg, t: b.impact
      });
    }));
    return out;
  }

  const nameOf = id => {
    const p = app.pub.players.find(x => x.id === id);
    return p ? p.name : '???';
  };

  /** 一句"打到谁 − 多少"：磁暴这类 0 伤害的只写目标（破盾效果由事件行交代） */
  function hitLabel2(h, hit) {
    const nm = rosterName(h, hit.to);
    return hit.dmg > 0 ? `${nm} −${fmtNum(hit.dmg)}` : nm;
  }

  function hitLabel(h) {
    const nm = nameOf(h.to);
    return h.dmg > 0 ? `${nm} −${fmtNum(h.dmg)}` : nm;
  }

  /** 在玩家格子上画「谁打谁」的连线：红=攻击、紫=磁暴、橙=反盾弹回、青=偷 */
  const ARROW_COLORS = { hit: '#ef4444', smite: '#8b5cf6', back: '#f59e0b', steal: '#0891b2' };
  function drawArrows() {
    const wrap = $('.players');
    if (!wrap) return;
    const old = wrap.querySelector('svg.arrows');
    if (old) old.remove();
    const pub = app.pub, res = pub && pub.lastResult, tl = app._tl;
    if (!pub || pub.phase !== 'reveal' || !res || !tl) return;
    if ((app.remainTotal - app.remainMs) > app.remainTotal * 0.7) return;   // 演出过半就别重头放
    const box = wrap.getBoundingClientRect();
    if (!box.width || !box.height) return;            // 没有布局信息（或 jsdom）就不画

    const NS = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(NS, 'svg');
    svg.setAttribute('class', 'arrows');
    svg.setAttribute('viewBox', `0 0 ${Math.round(box.width)} ${Math.round(box.height)}`);

    // 箭头尖：每种颜色一个 marker
    const defs = document.createElementNS(NS, 'defs');
    Object.keys(ARROW_COLORS).forEach(kind => {
      const m = document.createElementNS(NS, 'marker');
      m.setAttribute('id', 'ah-' + kind);
      m.setAttribute('viewBox', '0 0 10 10');
      m.setAttribute('refX', '8'); m.setAttribute('refY', '5');
      m.setAttribute('markerWidth', '5'); m.setAttribute('markerHeight', '5');
      m.setAttribute('orient', 'auto-start-reverse');
      const path = document.createElementNS(NS, 'path');
      path.setAttribute('d', 'M0,0 L10,5 L0,10 z');
      path.setAttribute('fill', ARROW_COLORS[kind]);
      m.appendChild(path);
      defs.appendChild(m);
    });
    svg.appendChild(defs);

    const geo = id => {
      const el = wrap.querySelector(`[data-pid="${id}"]`);
      if (!el) return null;
      const r = el.getBoundingClientRect();
      if (!r.width && !r.height) return null;
      return { x: r.left - box.left + r.width / 2, y: r.top - box.top + r.height / 2, w: r.width || 60, h: r.height || 40 };
    };
    // 把线段两端缩到卡片边缘，别糊住头像
    const trim = (a, b) => {
      const dx = b.x - a.x, dy = b.y - a.y;
      const len = Math.hypot(dx, dy) || 1;
      const ux = dx / len, uy = dy / len;
      const edge = (g, sign) => {
        const tx = ux !== 0 ? Math.abs((g.w / 2 + 6) / ux) : Infinity;
        const ty = uy !== 0 ? Math.abs((g.h / 2 + 6) / uy) : Infinity;
        const t = Math.min(tx, ty, len / 2);
        return { x: g.x + sign * ux * t, y: g.y + sign * uy * t };
      };
      return { from: edge(a, 1), to: edge(b, -1), len: len };
    };

    const arcs = [];
    tl.beats.forEach(b => {
      b.hits.forEach(h => arcs.push({ from: b.rep.id, to: h.to, kind: h.item === 'cibao' ? 'smite' : 'hit', at: b.t }));
      b.back.forEach(id => arcs.push({ from: b.rep.id, to: id, kind: 'back', at: b.t + 120 }));
      b.steal.forEach(s => arcs.push({ from: b.rep.id, to: s.id, kind: 'steal', at: b.t + 60 }));
    });

    arcs.forEach(a => {
      const g1 = geo(a.from), g2 = geo(a.to);
      if (!g1 || !g2) return;
      const t = trim(g1, g2);
      const mx = (t.from.x + t.to.x) / 2, my = (t.from.y + t.to.y) / 2;
      const nx = -(t.to.y - t.from.y), ny = t.to.x - t.from.x;   // 垂直方向，让线稍微弯一点
      const nl = Math.hypot(nx, ny) || 1;
      const bend = Math.min(30, t.len * 0.16);
      const cx = mx + (nx / nl) * bend, cy = my + (ny / nl) * bend;
      const path = document.createElementNS(NS, 'path');
      path.setAttribute('d', `M ${t.from.x.toFixed(1)} ${t.from.y.toFixed(1)} Q ${cx.toFixed(1)} ${cy.toFixed(1)} ${t.to.x.toFixed(1)} ${t.to.y.toFixed(1)}`);
      path.setAttribute('fill', 'none');
      path.setAttribute('stroke', ARROW_COLORS[a.kind]);
      path.setAttribute('stroke-width', a.kind === 'steal' ? '2.4' : '3.4');
      path.setAttribute('opacity', '0.95');
      path.setAttribute('marker-end', `url(#ah-${a.kind})`);
      path.setAttribute('stroke-dasharray', t.len.toFixed(0));
      path.setAttribute('stroke-dashoffset', t.len.toFixed(0));
      // 先"画"出来，停一会儿，再淡出——避免一屏全是线
      path.style.animationName = 'draw-arrow, arrow-fade';
      path.style.animationDuration = '.48s, .35s';
      path.style.animationTimingFunction = 'ease-out, ease-in';
      path.style.animationFillMode = 'both, forwards';
      path.style.animationDelay = `${a.at}ms, ${a.at + 1400}ms`;
      svg.appendChild(path);
    });
    wrap.appendChild(svg);
  }

  function revealList() {
    const res = app.pub.lastResult;
    if (!res) return '';
    return `<ul class="logbox" style="max-height:none">${res.reports.map(r => {
      const p = app.pub.players.find(x => x.id === r.id);
      const hits = r.hits || [];
      const label = Object.keys(r.items || {}).map(id => `${B.ITEMS[id] ? B.ITEMS[id].name : id}×${r.items[id]}`).join('、');
      const head = hits.length
        ? `${label} → ${hits.map(hitLabel).join('、')}`
        : B.describePicks(app.pub, { items: r.items, alloc: r.alloc, steal: r.steal });
      const died = r.events.some(e => /阵亡|暴毙/.test(e));
      // "谁+谁=总共多少 − 防御 = 掉多少"，把求和这件事写明白
      let sum = '';
      if (r.gross > 0) {
        const who = [];
        res.reports.forEach(o => (o.hits || []).forEach(h => { if (h.to === r.id) who.push(`${o.name} ${fmtNum(h.dmg)}`); }));
        sum = `<div class="tiny ${r.damage > 0 ? 'err' : 'muted'}">🧮 ${esc(who.join(' + ') || '挨打')} = ${fmtNum(r.gross)} 点 − 防御 ${fmtNum(r.def)}${r.defAttack ? `（含刀自带 ${fmtNum(r.defAttack)}）` : ''} = ${r.damage > 0 ? '掉 ' + fmtNum(r.damage) + ' 点' : '全部挡下'}</div>`;
      }
      const cost = (r.cost != null && r.cost > 0) ? `<div class="tiny muted">💸 消耗 ${fmtNum(r.cost)} 点</div>` : '';
      return `<li class="res ${died ? 'died' : ''}">
        <div><b>${esc(p ? p.name : r.name)}</b> ${esc(head)}</div>
        ${cost}
        ${r.events.map(e => `<div class="tiny ${/阵亡|暴毙/.test(e) ? 'err' : 'muted'}">${esc(e)}</div>`).join('')}
        ${sum}
      </li>`;
    }).join('')}</ul>`;
  }

  function screenOver() {
    const pub = app.pub;
    const w = pub.players.find(p => p.id === pub.winner);
    const hist = pub.history || [];
    return `
    <div class="wrap">
      <div class="card" style="text-align:center;padding:32px 16px">
        <div style="font-size:44px">${w ? '🏆' : '🤝'}</div>
        <h2 style="font-size:24px;font-weight:800;margin-top:8px">${w ? esc(w.name) + ' 拔得头筹！' : '全员阵亡，平局'}</h2>
        <div class="small muted" style="margin-top:8px">共 ${hist.length || (pub.lastResult ? pub.lastResult.round : pub.round)} 回合</div>
        <div style="margin-top:24px">
          ${app.isHost ? '<button class="btn primary lg block" data-act="rematch">再来一局（回房间重新确认）</button>' : ''}
          <button class="btn block" style="margin-top:8px" data-act="export">💾 导出对局 JSON（含所有人的点数）</button>
          <button class="btn ghost block" style="margin-top:8px" data-act="rules">看规则</button>
          <button class="btn ghost block" style="margin-top:8px" data-act="leave">离开房间</button>
        </div>
        <div class="tiny muted" style="margin-top:10px">导出后，可在首页「导入对局 JSON · 复盘」里逐回合重看</div>
      </div>
      ${hist.length ? finalReportHtml(hist) : `<div class="card"><b>最终战报</b><div class="divider"></div>${revealList()}</div>`}
      <div style="height:24px"></div>
    </div>`;
  }

  /* --------------------------------------------------- 逐回合档案：最终战报 */
  const ROUND_OPEN_MAX = 6;      // 回合不多就全展开；回合多了默认只展开最后一回合，免得滑不到底

  /** 最终战报：一回合一张折叠面板，逐条把"谁 + 谁 = 总共挨 X − 防御 Y = 掉 Z"写全 */
  function finalReportHtml(hist) {
    const openAll = hist.length <= ROUND_OPEN_MAX;
    return `<div class="card">
      <div class="row space">
        <b>最终战报 · 逐回合</b>
        <button class="btn sm ghost" data-act="expand" data-open="${openAll ? '0' : '1'}">${openAll ? '全部收起' : '全部展开'}</button>
      </div>
      <div class="divider"></div>
      ${hist.map((h, i) => `<details class="rnd" ${(openAll || i === hist.length - 1) ? 'open' : ''}>
        <summary>第 ${h.round} 回合${roundOutcomeText(h)}</summary>
        ${roundRowsHtml(h)}
      </details>`).join('')}
    </div>`;
  }

  /** 折叠标题右边那句小结：这一回合下来还剩几个人 / 谁赢了 */
  function roundOutcomeText(h) {
    const left = (h.after || []).filter(p => p.alive);
    const dead = (h.reports || []).filter(r => r.dead).map(r => repName(h, r));
    const tag = dead.length ? ` · ☠ ${dead.join('、')}` : '';
    if (left.length === 1) return `${tag} · 🏆 ${esc(left[0].name)} 胜`;
    if (!left.length) return `${tag} · 🤝 全员阵亡`;
    return `${tag} · 存活 ${left.length} 人`;
  }

  /** 名字查表：战报 / 结算前快照 / 结算后快照里抓，抓不到就退回 id */
  function rosterName(h, id) {
    const pool = (h.reports || []).concat(h.before || [], h.after || []);
    const hit = pool.find(x => x.id === id);
    return hit && hit.name ? hit.name : id;
  }

  /** 战报里那位玩家的名字（手改过的文件可能缺 name，退回查表） */
  function repName(h, r) {
    return (r && r.name) || rosterName(h, r && r.id) || '?';
  }

  /**
   * 一回合里每个人的完整流水：出招 → 花了多少点 → 点数/血量怎么变 → 挨打算式 → 事件。
   * "谁 + 谁 = 总共挨 X − 防御 Y = 掉 Z"整条写出来，不让人自己心算。
   */
  function roundRowsHtml(h) {
    const rows = (h.reports || []).map(r => {
      const b = (h.before || []).find(p => p.id === r.id) || {};
      const a = (h.after || []).find(p => p.id === r.id) || {};
      // 这回合开始前就已经出局的人：一行带过，别拿"空手/防御 0"去糊人
      if (r.alive === false) {
        return `<li class="res"><div><b>${esc(repName(h, r))}</b> <span class="badge grey">已出局</span>
          <span class="tiny muted">这回合没他的事</span></div></li>`;
      }
      const items = Object.keys(r.items || {})
        .map(id => `${B.ITEMS[id] ? B.ITEMS[id].name : id}×${r.items[id]}`).join('、') || '空手';
      const hits = r.hits || [];
      // 「偷」的落点优先用结算时记下的名字（stolenFrom），拿不到再退回目标 id
      const stealTo = (r.stolenFrom && r.stolenFrom.length
        ? r.stolenFrom.map(s => s.name)
        : (r.steal || []).map(t => rosterName(h, t)));
      const aimed = hits.length
        ? `${items} → ${hits.map(x => esc(hitLabel2(h, x))).join('、')}`
        : (stealTo.length ? `偷 → ${stealTo.map(esc).join('、')}` : items);

      const eco = [];
      if (r.cost != null && r.cost > 0) eco.push(`💸 花 ${fmtNum(r.cost)} 点`);
      if (b.points != null) eco.push(`🪙 点数 ${fmtNum(b.points)} → ${fmtNum(a.points != null ? a.points : b.points)}`);
      // 这回合被打死的人，血量的"去向"是阵亡而不是某个数字
      if (b.hp != null) eco.push(`❤ 血量 ${fmtHp(b.hp)} → ${r.dead ? '阵亡' : fmtHp(a.hp != null ? a.hp : b.hp)}`);

      // 挨打这一行的写法要分情况：反盾、磁暴、纯防御都不是"总攻击 − 防御"能说清的
      const incoming = [];
      (h.reports || []).forEach(o => (o.hits || []).forEach(x => { if (x.to === r.id) incoming.push(`${repName(h, o)} ${fmtNum(x.dmg)}`); }));
      const defTxt = `防御 ${fmtNum(r.def)}` + (r.defAttack ? `（含刀自带 ${fmtNum(r.defAttack)}）` : '');
      const sumOf = incoming.join(' + ') || '挨打';
      let sum;
      if (r.reverse && r.reverse.success) {
        sum = `🧮 ${sumOf} = 总共挨 ${fmtNum(r.gross)} 点，落在 ${fmtNum(r.reverse.range)} 点弹性里 → 反盾成功，攻击者被弹死`;
      } else if (r.reverse && r.reverse.nullified) {
        sum = `🧮 反盾被「反刀」完全破掉 → 整回合谁的刀都弹不回来，本人无视血量当场暴毙`;
      } else if (r.reverse && r.reverse.success === false) {
        sum = `🧮 ${sumOf} = 总共挨 ${fmtNum(r.gross)} 点 > 弹性 ${fmtNum(r.reverse.range)} → 反盾被破，反盾者暴毙`;
      } else if (r.gross > 0) {
        sum = `🧮 ${sumOf} = 总共挨 ${fmtNum(r.gross)} 点 − ${defTxt} = ${r.damage > 0 ? '掉 ' + fmtNum(r.damage) + ' 点' : '全部挡下'}`;
      } else if (incoming.length) {
        sum = `🧮 ${sumOf} —— 0 点伤害${r.dead ? '，但当场暴毙' : '，没事'}`;
      } else {
        sum = `🧮 这一回合没人打他（自带防御 ${fmtNum(r.def)}${r.defAttack ? `，其中刀自带 ${fmtNum(r.defAttack)}` : ''}）`;
      }

      // "受到 X 点伤害 / 血量 a → b"已经在算式里念过了，别再重复一遍
      const evs = (r.events || []).filter(e => e && !/^受到 .* 点伤害/.test(e));
      return `<li class="res ${r.dead ? 'died' : ''}">
        <div><b>${esc(repName(h, r))}</b>${r.dead ? ' <span class="badge red">☠ 真死</span>' : ''} ${esc(aimed)}</div>
        ${eco.length ? `<div class="tiny muted">${eco.join(' ｜ ')}</div>` : ''}
        <div class="tiny ${r.damage > 0 ? 'err' : 'muted'}">${esc(sum)}</div>
        ${evs.map(e => `<div class="tiny muted">· ${esc(e)}</div>`).join('')}
      </li>`;
    }).join('');
    return `<ul class="logbox" style="max-height:none">${rows}</ul>`;
  }

  /* ------------------------------------------- 对局存档：导出 JSON / 导入复盘 */
  const MATCH_FORMAT = 'badao-match';
  const MATCH_VERSION = 1;
  const REPLAY_TOTAL_MS = 6000;   // 复盘时每回合演出的"名义总时长"，只用来排拍子快慢

  /** 从当前快照拼出对局档案。房主任何时候都能导出；对局结束后人人可导出。 */
  function buildMatchFromPub(pub) {
    if (!pub || !pub.history || !pub.history.length) return null;
    const w = pub.players.find(p => p.id === pub.winner);
    return {
      format: MATCH_FORMAT, version: MATCH_VERSION,
      exportedAt: new Date().toISOString(),
      roomCode: app.roomCode || '',
      settings: pub.settings,
      roundCount: pub.history.length,
      winner: w ? w.name : null,
      alive: pub.players.filter(p => p.alive).map(p => p.name),
      players: pub.players.map(p => ({
        id: p.id, name: p.name, isHost: !!p.isHost, isBot: !!p.isBot,
        alive: p.alive, hp: p.hp, points: p.points, bag: p.bag
      })),
      history: pub.history
    };
  }

  function matchFileName(match) {
    const d = new Date();
    const pad = n => String(n).padStart(2, '0');
    const stamp = `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}`;
    return `拔刀对局-${match.roomCode || '单机'}-${match.roundCount}回合-${stamp}.json`;
  }

  /** 触发下载；浏览器不给下载（老环境 / 被拦）就把 JSON 摊在弹层里让玩家自己复制 */
  function downloadJson(text, name) {
    try {
      if (typeof URL === 'undefined' || typeof URL.createObjectURL !== 'function') throw new Error('no objectURL');
      const url = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
      const a = document.createElement('a');
      a.href = url; a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => { try { URL.revokeObjectURL(url); } catch (e) { /* 已经失效就算了 */ } }, 4000);
      return true;
    } catch (e) {
      sheet = { kind: 'dump', text: text, name: name };     // 退回"摆出文本"，至少不丢数据
      renderSheet();
      return false;
    }
  }

  function doExport() {
    const match = buildMatchFromPub(app.pub);
    if (!match) { toast('这一局还没有打完一回合，没东西可导出'); return; }
    const text = JSON.stringify(match, null, 2);
    const name = matchFileName(match);
    if (downloadJson(text, name)) toast(`已导出 ${match.roundCount} 回合的对局（${(text.length / 1024).toFixed(0)} KB）`);
    else toast('浏览器不让直接下载，已把 JSON 摊在下面，全选复制也行');
  }

  /** 读进来一份对局文件 → 进复盘模式。坏文件给出人话的原因，不进。 */
  function importMatchText(text) {
    const r = B.importMatch(text);
    if (!r.ok) {
      app.matchErr = r.errors.join('；');
      render();
      toast(r.errors[0]);
      return false;
    }
    app.matchErr = '';
    app.replay = { match: r.match, idx: 0, animate: true };
    app.mode = 'replay';
    app.pub = null;
    app.me = null;
    app.status = '';
    sheet = null;
    render();
    toast(`已载入 ${r.match.roundCount} 回合的对局，从第 1 回合开始看`);
    if (r.errors.length) setTimeout(() => toast(r.errors[0]), 2400);   // 非致命的小毛病，晚一点再提一句
    return true;
  }

  function importFile(file) {
    if (!file) return;
    if (file.size > 8 * 1024 * 1024) { app.matchErr = '文件太大了（超过 8 MB），确认一下是不是拿错了文件'; render(); return; }
    const reader = new FileReader();
    reader.onload = () => importMatchText(String(reader.result || ''));
    reader.onerror = () => { app.matchErr = '这个文件读不出来，换一个试试'; render(); toast('文件读不出来'); };
    reader.readAsText(file);
  }

  function exitReplay() {
    app.replay = null;
    app.pub = null;
    app.mode = 'home';
    sheet = null;
    render();
  }

  function goReplayRound(idx, animate) {
    if (!app.replay) return;
    const n = app.replay.match.history.length;
    app.replay.idx = Math.max(0, Math.min(n - 1, idx));
    app.replay.animate = animate !== false;
    render();
  }

  /**
   * 复盘时把"这一回合"伪装成一份正常的公开状态，
   * playerCard / 连线 / 飞刀 / 字幕条那整套就能原样复用——所以复盘画面和当时一模一样。
   */
  function replayFrame() {
    const rp = app.replay;
    if (!rp) return null;
    const hist = rp.match.history;
    const idx = Math.max(0, Math.min(hist.length - 1, rp.idx));
    rp.idx = idx;
    const entry = hist[idx];
    // 棋盘上用"这一回合开打前"的状态：这样被打死的人会先活着挨刀、再当场倒下，
    // 而不是像回顾录那样一上来就是灰的；也正好一眼看出"他这回合手上有几点可花"。
    // （对局中的实时演出用的是回合结束后的状态，所以两边长相一样、数字口径不同，界面上有标注。）
    const roster = (entry.before && entry.before.length ? entry.before
      : (entry.after && entry.after.length ? entry.after : rp.match.players)) || [];
    const players = roster.map(p => ({
      id: p.id, name: p.name, isHost: !!p.isHost, isBot: !!p.isBot, connected: true,
      alive: p.alive !== false, hp: Number(p.hp) || 0, points: Number(p.points) || 0,
      bag: p.bag || {}, submitted: false, ready: true,
      inDuel: !!p.inDuel, duel: null, selfGuardUntil: p.selfGuardUntil,
      // picks 只要"存在"就行：出招内容一律读战报快照（rep.items），跟对局中展示阶段的做法一致
      picks: B.emptyPicks()
    }));
    const res = {
      round: entry.round,
      order: (entry.reports || []).map(r => r.id),
      reports: entry.reports || [],
      winnersHint: []
    };
    const pub = {
      round: entry.round, phase: 'reveal', winner: null,
      settings: rp.match.settings, hostId: (players.find(p => p.isHost) || {}).id || null,
      ecoOpen: true, ecoHidden: false,
      players: players, log: [], lastResult: res, history: null
    };
    app.pub = pub;
    app.remainTotal = REPLAY_TOTAL_MS;
    // drawFx / drawArrows 里那句"演出过半就别重头画"的保护，正好当静态模式的开关用：
    // animate=false 时把 remainMs 压到 0（＝演出已经结束），飞刀和连线就不再冒出来。
    app.remainMs = rp.animate ? REPLAY_TOTAL_MS : 0;
    app.revealStep = 200;
    app._tl = buildTimeline(res);
    return { entry: entry, tl: app._tl };
  }

  function screenReplay() {
    if (!app.replay || !app.replay.match.history.length) {
      return `<div class="wrap"><div class="card">还没有导入对局（或者这份文件里没有回合记录）。</div></div>`;
    }
    const rp = app.replay, m = rp.match, hist = m.history;
    const frame = replayFrame();
    const entry = frame.entry;
    const pk = (m.settings && m.settings.packs) || {};
    const packs = B.PACK_KEYS.filter(k => pk[k]).map(k => B.PACK_NAMES[k]);
    return `
    <div class="topbar"><div class="inner">
      <div class="grow">
        <div class="row wrap">
          <b>复盘</b>
          <span class="badge blue">第 ${entry.round} 回合</span>
          <span class="badge grey">共 ${hist.length} 回合</span>
          ${m.roomCode ? `<span class="badge grey">房间 ${esc(m.roomCode)}</span>` : ''}
          <button class="btn sm ghost" style="margin-left:auto" data-act="replay-exit">退出复盘</button>
        </div>
      </div>
    </div></div>

    <div class="wrap">
      <div class="card">
        <div class="row space wrap">
          <b>${m.winner ? '🏆 ' + esc(m.winner) + ' 拔得头筹' : '🤝 ' + (m.alive && m.alive.length ? '存活 ' + m.alive.length + ' 人' : '没有赢家')}</b>
          <span class="tiny muted">${m.players.length} 名玩家 · 每回合 ${m.settings.selectSec}s 出招 / ${m.settings.revealSec}s 展示</span>
        </div>
        <div class="tiny muted" style="margin-top:6px">
          ${m.settings.ecoOpen ? '明牌局（点数一路公开）' : '盲局（对局中点数全隐藏，这里看到的都是赛后翻开的底牌）'}
          ${packs.length ? ' ｜ 拓展包：' + esc(packs.join('、')) : ' ｜ 只用基础包'}
          ${m.exportedAt ? ' ｜ 导出时间 ' + esc(m.exportedAt.slice(0, 16).replace('T', ' ')) : ''}
        </div>
      </div>

      <div class="card">
        <div class="row space wrap" style="gap:8px">
          <b>回合</b>
          <div class="row" style="gap:6px">
            <button class="btn sm ghost" data-act="replay-prev" ${rp.idx === 0 ? 'disabled' : ''}>← 上一回合</button>
            <button class="btn sm ghost" data-act="replay-next" ${rp.idx >= hist.length - 1 ? 'disabled' : ''}>下一回合 →</button>
          </div>
        </div>
        <div class="rchips" style="margin-top:8px">
          ${hist.map((h, i) => `<button class="rchip ${i === rp.idx ? 'on' : ''}" data-act="replay-round" data-idx="${i}">R${h.round}</button>`).join('')}
        </div>
        <div class="rplay" style="margin-top:10px">
          <button class="btn sm ${rp.animate ? 'ghost' : 'primary'}" data-act="replay-again">▶ 重放本回合</button>
          <button class="btn sm ghost" data-act="replay-static" ${rp.animate ? '' : 'disabled'}>⏸ 静态看数字</button>
          <span class="tiny muted">点上面的回合号，或按 ← → 翻回合</span>
        </div>
      </div>

      <div class="card">
        <div class="row space">
          <b>第 ${entry.round} 回合 · 现场</b>
          <span class="tiny muted">${rp.animate ? '正在逐拍重放' : '静态快照'}</span>
        </div>
        <div class="tiny muted" style="margin-top:4px">卡片上是<b>这一回合开打前</b>的血量与点数；打完变成多少，看下面的逐人明细。</div>
        <div class="divider"></div>
        ${playersHtml(app.pub, true, frame.tl, rp.animate)}
        ${rp.animate ? captionHtml(frame.tl) : ''}
      </div>

      <div class="card">
        <b>第 ${entry.round} 回合 · 逐人明细</b>
        <div class="divider"></div>
        ${roundRowsHtml(entry)}
      </div>

      <details class="card">
        <summary style="cursor:pointer;font-weight:700">总览表：每一回合、每一个人的点数与血量</summary>
        <div class="divider"></div>
        ${matrixHtml(m, rp.idx)}
      </details>
      <div style="height:24px"></div>
    </div>`;
  }

  /** 总览矩阵：一行一个回合，一列一个玩家；格子里是"出招 + 点数/血量怎么变" */
  function matrixHtml(m, curIdx) {
    const roster = (m.players && m.players.length ? m.players : (m.history[0].after || [])).map(p => ({ id: p.id, name: p.name }));
    return `<div class="rtable"><table>
      <thead><tr><th class="rr">回合</th>${roster.map(p => `<th>${esc(p.name)}</th>`).join('')}</tr></thead>
      <tbody>${m.history.map((h, i) => `<tr class="${i === curIdx ? 'on' : ''}">
        <td class="rr"><button class="rchip ${i === curIdx ? 'on' : ''}" data-act="replay-round" data-idx="${i}">R${h.round}</button></td>
        ${roster.map(p => {
          const r = (h.reports || []).find(x => x.id === p.id);
          const b = (h.before || []).find(x => x.id === p.id) || {};
          const a = (h.after || []).find(x => x.id === p.id) || {};
          if (!r && !a.id) return '<td class="muted">—</td>';
          if (r && r.alive === false) return '<td class="muted">已出局</td>';
          const items = r ? (Object.keys(r.items || {}).map(id => B.ITEMS[id] ? B.ITEMS[id].name : id).join('+') || '空手') : '—';
          const aim = r && (r.hits || []).length ? '→' + r.hits.map(x => rosterName(h, x.to)).join('、') : '';
          return `<td>${r && r.dead ? '☠ ' : ''}${esc(items + aim)}
            <div class="mini">🪙 ${b.points != null ? fmtNum(b.points) : '?'} → ${a.points != null ? fmtNum(a.points) : '?'}</div>
            <div class="mini">❤ ${b.hp != null ? fmtHp(b.hp) : '?'} → ${a.hp != null ? fmtHp(a.hp) : '?'}</div>
          </td>`;
        }).join('')}
      </tr>`).join('')}</tbody>
    </table></div>`;
  }

  /* ------------------------------------------------------------ 道具面板 */
  const TABS = [
    { id: 'attack', name: '攻击' }, { id: 'defense', name: '防御' }, { id: 'reverse', name: '反盾' },
    { id: 'special', name: '特殊' }, { id: 'gift', name: '赠品' }
  ];
  const TAB_OF = {
    yidao: 'attack', shuangdao: 'attack', shangdiao: 'attack', sidao: 'attack', wudao: 'attack',
    caihong: 'attack', cibao: 'attack', podun: 'attack', fandao: 'attack',
    busi: 'defense', xiaofang: 'defense', dafang: 'defense', cidun: 'defense', heidong: 'defense',
    baidong: 'defense', hezhang: 'defense',
    xiaofan: 'reverse', dafan: 'reverse', chaofan: 'reverse',
    tou: 'special', zishou: 'special', du: 'special',
    jingxue: 'gift', jianqi: 'gift', tianlei: 'gift', feimei: 'gift', diefei: 'gift'
  };

  function itemLocked(it) {
    const me = mePlayer();
    if (!me) return true;
    if (it.pack && !packOn(it.id)) return true;
    if (it.giftOnly && !(me.bag[it.id] > 0)) return true;
    if (it.consume && !Object.keys(it.consume).every(k => (me.bag[k] || 0) >= it.consume[k])) return true;
    if (it.id === 'zishou' && (me.inDuel || B.isDuelTarget(app.pub, me.id))) return true;
    if (isAim(it.id) && foes().length === 0) return true;
    if (B.unitCost(app.pub, me, it.id) > usablePoints()) return true;
    return false;
  }

  function itemPanel() {
    const items = B.ITEM_LIST.filter(it => TAB_OF[it.id] === tab && (!it.pack || packs()[it.pack]));
    return `
      <div class="tiny muted">一回合只能挑一种道具：点卡片 = 选中（再点一次取消），攻击类再点头像选人。</div>
      <div class="tabs" style="margin-top:8px">
        ${TABS.map(t => {
          const on = draft.chosen && TAB_OF[draft.chosen] === t.id;
          return `<button class="tab ${tab === t.id ? 'on' : ''}" data-act="tab" data-tab="${t.id}">${t.name}${on ? '<span class="dot">✓</span>' : ''}</button>`;
        }).join('')}
      </div>
      <div class="items">
        ${items.map(it => itemCard(it)).join('')}
      </div>`;
  }

  function itemCard(it) {
    const me = mePlayer();
    const locked = itemLocked(it);
    const chosen = draft.chosen === it.id;
    const cost = B.unitCost(app.pub, me, it.id);
    const costText = cost === 0 ? '免费' : (it.costFn ? `动态 ${fmtNum(cost)} 点` : `${fmtNum(cost)} 点`);
    const extra = it.giftOnly ? `你有 ${me.bag[it.id] || 0} 个`
      : (it.consume ? Object.keys(it.consume).map(k => `要 ${it.consume[k]} 个${B.ITEMS[k].name}`).join('、') : '');

    let ctrl = '';
    if (isAim(it.id)) {
      const targets = selOf(it.id);
      if (isStack(it.id)) {
        const m = Math.max(1, targets.length);
        const cap = maxCount(it.id);
        const per = Math.max(1, Math.round((chosen ? draft.count : m) / m));
        const maxPer = Math.max(1, Math.floor(cap / m));
        ctrl = `<div class="ctrl">
          <div class="stepper">
            <button data-act="dec" data-item="${it.id}" ${locked || !chosen || per <= 1 ? 'disabled' : ''}>−</button>
            <span class="n">${chosen ? per : 0}</span>
            <button data-act="inc" data-item="${it.id}" ${locked || !chosen || per >= maxPer ? 'disabled' : ''}>＋</button>
          </div>
          <span class="tiny muted">${chosen ? `每人 ${per} 个 · 共 ${per * m} 个` : '可叠（要均分）'}</span>
        </div>`;
      } else {
        // 数量就是"点了几个头像"，没点时别装作买了 1 个（草稿里那个 1 只是为了让校验去报"还没选目标"）
        const picks = targets.length;
        const badge = !chosen ? 'grey' : (picks ? 'blue' : 'grey');
        ctrl = `<div class="ctrl">
          <span class="badge ${badge}">${!chosen ? '不可叠：一人只吃 1 个'
            : (picks ? `${picks} 个 · 花 ${fmtNum(cost * picks)} 点` : '还没选人：点下面的头像')}</span>
        </div>`;
      }
    } else {
      ctrl = `<div class="ctrl">
        <span class="badge ${chosen ? 'blue' : 'grey'}">${chosen ? '本回合就出它' : '不可叠 · 一个'}</span>
      </div>`;
    }

    return `<div class="item ${chosen ? 'on' : ''} ${locked ? 'locked' : ''}">
      <div class="head" data-act="choose" data-item="${it.id}" style="cursor:pointer">
        <span class="icon">${it.icon}</span>
        <span class="nm">${esc(it.name)}</span>
        <span class="cost ${cost === 0 ? 'free' : ''}">${costText}</span>
      </div>
      <div class="desc">${esc(it.desc)}${extra ? `（${extra}）` : ''}</div>
      <div class="ctrl">
        ${ctrl}
        <button class="btn sm ${chosen ? 'primary' : 'ghost'}" style="margin-left:auto" data-act="choose" data-item="${it.id}"
          ${locked ? 'disabled' : ''}>${chosen ? '已选 ✓' : '选用'}</button>
      </div>
      ${targetRowHtml(it)}
    </div>`;
  }

  /** 目标行：点头像多选；没选中这张卡时不渲染，界面更清爽（选中后卡片会长出这一行） */
  function targetRowHtml(it) {
    if (!isAim(it.id) && it.kind !== 'steal') return '';
    if (draft.chosen !== it.id) return '';
    const list = foes();
    const sel = it.kind === 'steal' ? draft.steal : selOf(it.id);
    const act = draftAction();
    const alloc = act.alloc[it.id] || {};
    const hint = it.kind === 'steal'
      ? `偷谁？可多选（点一下选、再点一下取消）${app.pub.ecoHidden ? ' · 对方点数要等结算才公开＝盲偷' : ' · 点数公开，能看准了偷'}${sel.length ? ` · 已选 ${sel.length} 人` : ''}`
      : (sel.length > 1 ? `已选 ${sel.length} 人（每人 ${fmtNum(draft.count / sel.length)} 个）` : '点头像选目标');
    return `<div class="targets">
      <div class="tiny muted">${hint}</div>
      <div class="tchips">
      ${list.map(p => `<button class="tchip ${sel.indexOf(p.id) >= 0 ? 'on' : ''}" data-act="pick"
          data-item="${esc(it.id)}" data-target="${esc(p.id)}" title="${esc(p.name)}"
        >${initial(p.name)}${alloc[p.id] > 1 ? `<i>${alloc[p.id]}</i>` : ''}</button>`).join('')}
      ${list.length > 1 ? `<button class="btn sm ghost" data-act="pick-all" data-item="${esc(it.id)}">全选</button>` : ''}
      </div>
    </div>`;
  }

  /* ---------------------------------------------------------------- 弹层 */
  function renderSheet() {
    const el = $('#overlay');
    if (!sheet) { el.innerHTML = ''; return; }
    // sheet 平时是 'rules' / 'log'；导出失败时会被塞成一个 {kind:'dump'} 对象，退回"摆出文本让人复制"
    const dump = typeof sheet === 'object' && sheet.kind === 'dump';
    const title = dump ? '对局 JSON（请另存为 .json 文件）' : (sheet === 'rules' ? '完整规则' : '战斗日志');
    const body = dump
      ? `<div class="small muted">${esc(sheet.name)}</div>
         <textarea class="field" readonly style="width:100%;height:46vh;margin-top:8px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;white-space:pre">${esc(sheet.text)}</textarea>`
      : (sheet === 'rules' ? rulesHtml() : logHtml());
    el.innerHTML = `<div class="mask" data-act="maskclose">
      <div class="sheet" data-stop="1">
        <div class="row space"><h3>${esc(title)}</h3>
          <button class="btn sm ghost" data-act="close">关闭</button></div>
        <div class="divider"></div>
        ${body}
      </div>
    </div>`;
  }

  function logHtml() {
    const log = (app.pub && app.pub.log) || [];
    // 对局中只有房主手上有"逐回合全量档案"，所以这里只给他导出按钮；
    // 打完之后档案人人都有，导出按钮就出现在结束页上。
    const canExport = app.isHost || (app.pub && app.pub.phase === 'over');
    const bar = canExport
      ? `<div class="row" style="margin-bottom:8px"><button class="btn sm" data-act="export">💾 导出对局 JSON</button>
           <span class="tiny muted">含所有人每一回合的点数</span></div>`
      : '';
    if (!log.length) return bar + '<div class="small muted">还没有战况。</div>';
    return bar + `<ul class="logbox">${log.slice().reverse().map(l => `<li>${esc(l)}</li>`).join('')}</ul>`;
  }

  function rulesHtml() {
    return `<div class="doc">
      <h4>核心</h4>
      <p>每回合所有人同时出招，倒计时结束后统一结算：<b>受到的伤害 = 外面所有人打你的总攻击之和 − 你的防御</b>。
         注意是<b>求和</b>：三个人各打你 1 点就是挨 3 点，不是只算最大的那一个。</p>
      <p><b>你的防御 = 防御道具的防御 + 你攻击自带的防御</b>。你出攻击 x 点，本回合就自带 x 点防御——
         所以两个人互砍一刀，双方各自自带 1 点防御，都活得下来，不会同归于尽。</p>
      <p>血量初始为 <b>0</b>，下限为 0。<b>只要 血量 − 伤害 &lt; 0 就死</b> —— 0 血的人挨 1 点伤害就死，<code>合掌</code> 加的血就是多一层缓冲。</p>
      <p>攻击、防御、反盾都在回合末结算、下回合清零；血量、点数、赠品留到下一回合。</p>
      <p><b>没有"空手"这个选项</b>：每回合至少得出一样东西，什么都不想干就出「集」（白拿 1 点）。<br>
         <b>时间到了还没锁定，就自动按「集」结算</b>（白拿 1 点，但集不自带任何防御，等于原地挨打）。</p>

      <h4>一回合只能挑一种道具</h4>
      <p>每回合你只能从道具里挑 <b>一种</b>：要么「集」赚点，要么出刀，要么上防，要么反盾，要么特殊道具。
         所以「集完顺手砍一刀」「边防边反」这类组合不存在，5 秒决策就是赌这一手。</p>
      <p><b>不可叠</b>：除了下面列出的可叠道具，其余道具对<b>同一个人一回合只能用一次</b>。
         想同时打多个人？买 N 把同种刀砍 N 个人——一人一刀，不能一人三刀。
         肥美 / 剑气 / 天雷 也在不可叠之列：一人一回合只能吃 1 个。</p>
      <p><b>可叠</b>（只有原规则明确写过的这三样）：精血「可叠加」、彩虹斩（房主开了叠加包后 n 倍）、偷「不论使用数量」。
         可叠道具分给多个人时<b>必须完全均分</b>，不能一个人 3 个、另一个 2 个。</p>
      <p><b>叠肥是独立道具</b>：它不是"把肥美叠起来用"，而是<b>吃掉 3 个肥美、造成 2-ε 伤害</b>的一个专门道具
         （同样不可叠，打一个人就要吃 3 个）。</p>

      <h4>点数</h4>
      <p>初始 0 点，不会自动增长，只能靠「集」赚。因为一回合只能出一种道具，集点只能留到下回合花。</p>

      <h4>攻击</h4>
      <p>一刀 1 / 双刀 2 / 上吊 3 / 四刀 4 / 五刀 5 / 彩虹斩 8。点对手头像选目标，买 N 把同种刀就能选 N 个人，旁边有「全选」。
         <b>不会替你预选目标</b>：点谁打谁；点错了再点一下头像就取消，最后一个也能取消。
         <b>攻击多少点，本回合就自带多少点防御</b>（五刀＝自带 5 防，彩虹斩＝自带 8 防）。</p>
      <p><b>反刀</b>（1 点）：伤害只有 0.5，但打到<b>反盾</b>上时——对方反盾<b>完全破盾</b>
         （整回合谁的刀都弹不回来），并且<b>无视他的血量</b>直接斩杀。专治反盾。</p>
      <p><b>彩虹斩</b>：命中即死，无视血量和自守；但会被防具挡下（算出来 ≤ 0 就无效）。没开叠加包时一回合只能 1 个。</p>
      <p><b>赠品</b>（回合末发放、自动进背包、可跨回合累积，要自己选用）：上吊送 1 精血（0.5 伤害）、四刀送 1 剑气（1 伤害）、
         五刀送 1 天雷（3 伤害，<b>在小防面前只有 2 伤害</b>）、不死送 1 肥美（0.5 伤害）。叠肥＝吃掉 3 个肥美造成 2-ε 伤害
         （所以 2 血的人能剩一丝血站住，也破不了小反的 2 点弹性）。</p>
      <p><b>磁暴</b>（1 点）：目标本回合若出磁盾，立刻暴毙；没出就无事发生。</p>

      <h4>防御</h4>
      <p>不死 1（免费）/ 小防 2（免费）/ 大防 3（1 点）/ 磁盾 5（2 点，会被磁暴劈）/ 黑洞 8（4 点）/ 白洞 ∞（6 点）。一回合只能上一个。</p>
      <p>如果你这一回合选择出刀，那么你的防御就是"刀自带的那些"，再上不了防具——攻防只能选一样。</p>

      <h4>反盾</h4>
      <p>像一个弹簧：外面打你的总攻击 <b>≤ 弹性范围</b> → 反盾成功，<b>无视血量杀死所有攻击你的人</b>（他们的防御也救不了）；
         <b>&gt; 弹性范围</b> → 反盾被破，反盾者无视血量当场暴毙，攻击方活着。
         小反 2（1 点）/ 大反 4（2 点）/ 超反 6.5（3 点），一回合只能上一个。</p>
      <p><b>克星是「反刀」</b>：被反刀打中 → 反盾完全破盾（谁的刀都弹不回来）+ 无视血量当场暴毙。</p>

      <h4>偷（0 点）</h4>
      <p>用「偷」的回合防御固定为 0.5。指定若干对象后，<b>逐个对象各自独立结算</b>：</p>
      <p>· 对象在「集」→ <b>偷走他全部点数</b>（含刚集的那一点）。<b>不管其他对象出什么，这一步都会发生</b><br>
         · 对象出防 / 反盾 / 自守 / 合掌 → <b>你当场暴毙</b>（只要对象里有一个人这样，你必死）<br>
         · 对象在做别的事 → 无事发生</p>
      <p>举例：同时偷 A、B、C —— A 出「集」→ A 的点数照偷不误；只要 B、C 里有一个人出了防，你偷完照样暴毙，
         偷来的点数也跟着你一起清空。</p>
      <p>偷得准不准，看房主的<b>点数公开</b>开关：关（默认）时出招阶段看不到别人的点数与背包，等于盲偷；
         开了就是明牌局，谁钱多一目了然。</p>

      <h4>拓展包（房主开）</h4>
      <p><b>血量拓展</b>：合掌 —— 血量 +1、本回合防御 1；血量大于 1 时花 3 点，否则 2 点。破盾 —— 伤害 0.5（1 点），
         如果含破盾的攻击打得对方扣血，就清空对方血量。<br>
         <b>自守拓展</b>：自守（1 点）—— 本回合防御 1，之后五回合内若死亡，改为和所有直接致死者发起决斗，回合上限 <b>4n+1</b>（n = 致死者人数）：
         决斗期内把这些人<b>都杀过一遍</b>（把对方自守打出来也算一遍）就复活，否则真正死亡。决斗期间双方都不能开自守。<br>
         · 毒（2 点）：伤害 1.5，如果含毒的伤害打在自守状态或正在自守的玩家上，该玩家立刻暴毙。</p>

      <h4>胜负与开局</h4>
      <p>没有回合上限，活到最后的人赢；如果全员同时阵亡就是平局。</p>
      <p>房间里<b>所有玩家（含房主）都要点「准备好了」</b>房主才能开始；再来一局要回房间重新确认一遍。</p>

      <h4>房主开关</h4>
      <p>· <b>选择 / 展示时间</b>：默认 5 秒 / 5 秒。展示给得长一点，是为了把结算动画看清楚。<br>
         · <b>全员锁定后立刻结算</b>：默认开，都锁好了就不用干等。<br>
         · <b>点数公开</b>：默认关（别人的点数与背包显示为 ?，防反推）；开了是明牌局。<br>
         · <b>血量拓展 / 彩虹斩叠加 / 自守拓展</b>：默认全关，按需开启。</p>

      <h4>本实现补充说明</h4>
      <p>· 「破盾」原规则没写点数消耗，本局按 <b>1 点</b> 实现；「偷」按 <b>0 点</b> 实现。<br>
         · 死亡后点数与赠品清空，人变观战者，<b>头像变黑白</b>。<br>
         · 所有攻击同时结算：被反盾弹死的人，他本回合打出去的伤害依然生效。<br>
         · 伤害公式只减「防御」，反盾单独判定。</p>

      <h4>对局存档与复盘</h4>
      <p>· <b>导出</b>：房主在对局中随时可导出；对局结束后<b>所有人都能导出</b>。导出的 JSON 是<b>全量</b>的——
         含每个人每一回合的点数、血量、背包、出招与伤害算式。<br>
         · <b>导入复盘</b>：首页「导入对局 JSON · 复盘」，也可以直接把文件拖到那张卡片上。
         进去以后能逐回合重放当时那一拍的动画，也能切「静态看数字」慢慢核对，
         用 <code>←</code> <code>→</code> 翻回合。<br>
         · 盲局在复盘里是<b>翻开的底牌</b>：对局中看不到别人的点数，赛后档案里全都记着。</p>
    </div>`;
  }

  /* =========================================================== 事件处理 */
  /** 一回合只挑一种道具：点卡片＝选中；再点一次＝取消；换一种会自动丢掉旧的 */
  function chooseItem(id) {
    if (!canAct()) return;
    if (draft.chosen === id) { clearDraft(); app.err = ''; render(); return; }
    const it = B.ITEMS[id];
    if (itemLocked(it)) { toast(`「${it.name}」现在不能用`); return; }
    // 刻意**不**预选目标：以前会默认选中"第一个人"，于是"只有 1 点、想砍第二个人"时
    // 加不上人（点数不够）、也去不掉人（至少留一个），直接卡死。
    // 现在点谁就是谁，谁都没点就由校验提示"还没选目标"。
    draft = { chosen: id, count: 1, sel: {}, steal: [] };
    app.err = '';
    render();
  }

  /** 点头像多选目标（偷是"选中/取消"，攻击类是"加/减一个人"）；最后一个也能取消掉 */
  function toggleTarget(id, tid) {
    if (!canAct() || draft.chosen !== id) { toast('先点这张卡片「选用」再选人'); return; }
    const it = B.ITEMS[id];
    if (it.kind === 'steal') {
      const i = draft.steal.indexOf(tid);
      if (i >= 0) draft.steal.splice(i, 1);
      else draft.steal.push(tid);
      app.err = '';
      render();
      return;
    }
    if (!isAim(id)) return;
    const list = draft.sel[id] || (draft.sel[id] = []);
    const i = list.indexOf(tid);
    if (i >= 0) {
      list.splice(i, 1);                 // 取消最后一个也允许：不然"想换个人打"就卡死了
    } else {
      if (list.length >= maxTargets(id)) {
        const dit = B.ITEMS[id];
        if (id === 'caihong' && !packOn('rainbow')) toast('彩虹斩没开叠加包时一回合只能斩 1 个人');
        else if (dit.giftOnly) toast(`「${dit.name}」只剩 ${mePlayer().bag[id] || 0} 个，一人只能吃 1 个`);
        else if (dit.consume) {
          const need = Object.keys(dit.consume).map(k => `${dit.consume[k]} 个${B.ITEMS[k].name}`).join('、');
          toast(`材料不够：打一个人要 ${need}`);
        } else toast('没有更多可打的人了');
        return;
      }
      // 预算检查要按"再加一个人之后一共几个目标"来算：
      // 草稿在没选目标时会塞一个占位 1（好让校验报"还没选目标"），
      // 直接拿 myCost() 来比就会把占位也算成一把刀，于是"1 点却一个目标都点不上"。
      const unit = B.unitCost(app.pub, mePlayer(), id);
      if (!isStack(id) && (list.length + 1) * unit > usablePoints()) {
        app.err = `点数不够：再打一个人要多花 ${fmtNum(unit)} 点，你手上只有 ${fmtNum(usablePoints())} 点（点一下已选的人可以取消）`;
        toast('点数不够，先点掉一个目标或去「集」');
        render();
        return;
      }
      list.push(tid);
      if (isStack(id)) draft.count = Math.max(draft.count, list.length);
    }
    if (isStack(id)) {
      const m = Math.max(1, list.length);
      draft.count = Math.max(m, Math.min(Math.floor(Math.max(draft.count, m) / m) * m, maxCount(id)));
    }
    app.err = '';
    render();
  }

  function pickAll(id) {
    if (draft.chosen !== id) { toast('先点这张卡片「选用」'); return; }
    const list = foes();
    if (!list.length) { toast('没有可打的人'); return; }
    if (B.ITEMS[id].kind === 'steal') { draft.steal = list.map(p => p.id); render(); return; }
    const stack = isStack(id);
    const cap = maxCount(id);                                  // 已含背包 / 材料 / 点数上限
    const unit = B.unitCost(app.pub, mePlayer(), id);
    const affordable = unit > 0 ? Math.floor(usablePoints() / unit) : 99;
    const maxSel = stack
      ? Math.min(list.length, cap)
      : Math.min(list.length, cap, affordable, maxTargets(id));
    if (maxSel <= 0) { toast('点数不够，先攒点'); return; }
    draft.sel[id] = list.slice(0, maxSel).map(p => p.id);
    if (stack) {
      const m = draft.sel[id].length;
      draft.count = Math.max(m, Math.floor(cap / m) * m);       // 保证能整除
    }
    if (maxSel < list.length) toast(`只能打 ${maxSel} 个人（点数或规则限制）`);
    app.err = '';
    render();
  }

  function nudgeCount(id, d) {
    if (draft.chosen !== id) { toast('先点这张卡片「选用」'); return; }
    const m = Math.max(1, (draft.sel[id] || []).length);
    const cap = maxCount(id);
    const per = Math.max(1, Math.round(draft.count / m));
    const maxPer = Math.max(1, Math.floor(cap / m));
    const next = Math.max(1, Math.min(per + d, maxPer));
    if (next === per) {
      toast(d > 0 ? '到上限了（点数或背包不够）' : '每人至少 1 个');
      return;
    }
    draft.count = next * m;                                     // 按"每人份"加减，天然均分
    app.err = '';
    render();
  }

  function bind() {
    document.addEventListener('click', e => {
      const btn = e.target.closest('[data-act]');
      if (!btn) return;
      const act = btn.getAttribute('data-act');
      const item = btn.getAttribute('data-item');
      const target = btn.getAttribute('data-target');
      if (act === 'maskclose' && e.target.closest('.sheet')) return;

      switch (act) {
        case 'create': ROOM.create(nick()); break;
        case 'join': {
          const code = (($('#codeInput') && $('#codeInput').value) || '').trim().toUpperCase();
          if (code.length < 4) { toast('房间号是 4 位'); return; }
          ROOM.join(code, nick());
          break;
        }
        case 'copy': copyText(app.roomCode); break;
        case 'rules': sheet = 'rules'; renderSheet(); break;
        case 'log': sheet = 'log'; renderSheet(); break;
        case 'export': doExport(); break;
        case 'import': {
          const inp = $('#matchFile');
          if (inp) inp.click();
          break;
        }
        case 'expand': {
          const open = btn.getAttribute('data-open') === '1';
          Array.prototype.forEach.call(document.querySelectorAll('details.rnd'), d => { d.open = open; });
          btn.setAttribute('data-open', open ? '0' : '1');
          btn.textContent = open ? '全部收起' : '全部展开';
          break;
        }
        case 'replay-exit': exitReplay(); break;
        case 'replay-prev': goReplayRound(app.replay ? app.replay.idx - 1 : 0); break;
        case 'replay-next': goReplayRound(app.replay ? app.replay.idx + 1 : 0); break;
        case 'replay-round': goReplayRound(Number(btn.getAttribute('data-idx')) || 0); break;
        case 'replay-again': goReplayRound(app.replay ? app.replay.idx : 0, true); break;
        case 'replay-static': if (app.replay) { app.replay.animate = false; render(); } break;
        case 'close': case 'maskclose': sheet = null; renderSheet(); break;
        case 'leave': ROOM.leave(); break;
        case 'addbot': ROOM.addBot(); break;
        case 'kick': ROOM.kick(btn.getAttribute('data-id')); break;
        case 'start': ROOM.start(); break;
        case 'rematch': ROOM.rematch(); break;
        case 'ready': ROOM.setReady(!(mePlayer() && mePlayer().ready)); break;
        case 'tab': tab = btn.getAttribute('data-tab'); render(); break;
        case 'clear': {
          // 不能出空手了：清空草稿的同时要把已提交的旧招一起撤掉，
          // 否则界面显示"没挑道具"、服务器那头却还锁着上一手，那就是骗人。
          const was = mePlayer() && mePlayer().submitted;
          clearDraft();
          app.err = '';
          if (was) ROOM.unlock();
          render();
          toast(was ? '已撤销锁定 + 清空：不能出空手，挑一张牌再锁' : '已清空：不能出空手，挑一张牌再锁');
          break;
        }
        case 'submit': doSubmit(); break;
        case 'choose': chooseItem(item); break;
        case 'inc': case 'dec': nudgeCount(item, act === 'inc' ? +1 : -1); break;
        case 'pick': toggleTarget(item, target); break;
        case 'pick-all': pickAll(item); break;
        default: break;
      }
    });

    document.addEventListener('change', e => {
      if (e.target.id === 'matchFile') {
        importFile(e.target.files && e.target.files[0]);
        return;
      }
      const el = e.target.closest('[data-set]');
      if (!el) return;
      const key = el.getAttribute('data-set');
      const val = el.type === 'checkbox' ? el.checked : Number(el.value);
      ROOM.setSetting(key, val);
    });
    document.addEventListener('input', e => {
      if (e.target.id === 'nickInput') { try { localStorage.setItem('badao_nick', e.target.value); } catch (err) { /* 隐私模式忽略 */ } }
      if (e.target.id === 'codeInput') e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
    });

    // 对局文件拖进首页那张卡片就直接复盘（顺便拦掉"拖歪了浏览器直接打开文件"这种误操作）
    document.addEventListener('dragover', e => e.preventDefault());
    document.addEventListener('drop', e => {
      e.preventDefault();
      if (!e.target.closest || !e.target.closest('[data-drop]')) return;
      const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
      if (f) importFile(f);
    });

    // 复盘时用 ← → 翻回合，Esc 退出
    document.addEventListener('keydown', e => {
      if (app.mode !== 'replay' || !app.replay) return;
      if (e.key === 'ArrowLeft') { goReplayRound(app.replay.idx - 1); e.preventDefault(); }
      else if (e.key === 'ArrowRight') { goReplayRound(app.replay.idx + 1); e.preventDefault(); }
      else if (e.key === 'Escape') exitReplay();
    });

    setInterval(() => {
      if (app.remainMs > 0) { app.remainMs -= 100; renderTimer(); }
    }, 100);

    // 窗口尺寸变了，连线要跟着重算
    let resizeTimer = null;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(drawArrows, 150);
    });
  }

  function doSubmit() {
    if (!canAct()) { toast('现在不是出招阶段'); return; }
    const action = draftAction();
    const v = B.validate(app.pub, app.me, action);
    if (!v.ok) {
      app.err = v.errors.join('；');
      toast(v.errors[0]);
      render();
      return;
    }
    toast('已锁定，时间到之前还能改');
    app.err = '';
    ROOM.submit(B.normalize(app.pub, app.me, action));
    render();
  }

  /* ---------------------------------------------------------------- 杂项 */
  let toastTimer = null;
  function toast(msg) {
    const old = $('.toast');
    if (old) old.remove();
    const el = document.createElement('div');
    el.className = 'toast';
    el.textContent = msg;
    document.body.appendChild(el);
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.remove(), 2200);
  }

  function copyText(t) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(t).then(() => toast('房间号已复制：' + t), () => toast('复制失败，手动记一下：' + t));
    } else {
      const ta = document.createElement('textarea');
      ta.value = t; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); toast('房间号已复制：' + t); } catch (e) { toast('复制失败，手动记一下：' + t); }
      ta.remove();
    }
  }

  function nick() {
    const inp = $('#nickInput');
    if (inp && inp.value.trim()) return inp.value.trim();
    let saved = '';
    try { saved = localStorage.getItem('badao_nick') || ''; } catch (e) { /* 忽略 */ }
    return saved || ('玩家' + Math.floor(Math.random() * 900 + 100));
  }

  function update(pub, remainMs, remainTotal) {
    if (app.mode === 'replay') return;          // 复盘时不接受联机快照，别把复盘画面顶掉
    app.pub = pub;
    if (remainMs != null) app.remainMs = remainMs;
    if (remainTotal != null) app.remainTotal = remainTotal;
    softRender();
  }

  return {
    app: app, bind: bind, render: render, update: update, toast: toast,
    resetDraft: clearDraft, rulesHtml: rulesHtml,
    exportMatch: doExport, importMatchText: importMatchText, matchFromPub: buildMatchFromPub
  };
})();
</script>
<script>/* ============================================================================
 * 拔刀 · 联机层
 * 主机（房主）权威：房主持有完整局面，客户端只发"我出什么招"，主机广播公开状态。
 * 房间码 = PeerJS 的 ID（badao3-XXXX），所以不需要任何后台服务器。
 * 如果拿不到联机库 / 没有网络，会自动降级成"只能和电脑玩"的单机房间。
 * ==========================================================================*/
const ROOM = (function () {
  'use strict';
  const B = BADAO;
  const APP = VIEW.app;

  const CODE_CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';   // 去掉 I O 0 1，念起来不歧义
  const PEER_PREFIX = 'badao3-';
  const TICK_MS = 200;
  const BROADCAST_MS = 500;

  const myId = 'u' + Math.random().toString(36).slice(2, 10);
  let peer = null;
  let isHost = false;
  let code = '';
  let state = null;              // 仅主机有
  let conns = [];                // [{conn, id}] 仅主机有
  let deadline = 0;
  let remainTotal = 0;
  let ticker = null;
  let lastBroadcast = 0;
  let joinRetry = 0;
  let myConn = null;             // 仅客户端有

  /* --------------------------------------------------------------- 工具 */
  function randCode() {
    let s = '';
    for (let i = 0; i < 4; i++) s += CODE_CHARS[Math.floor(Math.random() * CODE_CHARS.length)];
    return s;
  }
  const libOK = () => typeof window.Peer === 'function';

  function status(t) { APP.status = t; VIEW.render(); }
  function toast(t) { VIEW.toast(t); }

  function remainMs() { return Math.max(0, deadline - Date.now()); }

  /* --------------------------------------------------------- 主机：广播 */
  function broadcast(force) {
    if (!isHost) return;
    const now = Date.now();
    if (!force && now - lastBroadcast < BROADCAST_MS) return;
    lastBroadcast = now;
    const left = remainMs();
    const base = { t: 'state', remainMs: left, remainTotal: remainTotal, code: code };
    // 每个人的快照不一样：出招阶段别人看不到你的点数/背包，免得被反推
    // withHistory：逐回合全量档案只给房主自己（他自己随时能导出整局）；对局一结束，fetchState 会自动带上，
    // 那时候所有人手上的都被翻开了，也就无所谓藏。
    conns.forEach(c => {
      try { if (c.conn.open) c.conn.send(Object.assign({ pub: B.publicState(state, { viewerId: c.id }) }, base)); }
      catch (e) { /* 单个连接坏了不影响别人 */ }
    });
    APP.roomCode = code;
    VIEW.update(B.publicState(state, { viewerId: myId, withHistory: true }), left, remainTotal);
  }

  /* ------------------------------------------------------- 主机：回合流转 */
  function setPhase(phase, sec) {
    state.phase = phase;
    remainTotal = Math.max(0, (sec || 0) * 1000);
    deadline = Date.now() + remainTotal;
    if (phase === 'select') prepareBots();
    broadcast(true);
  }

  function prepareBots() {
    state.players.forEach(p => {
      if (!p.isBot || !p.alive) return;
      p.picks = B.botAction(state, p.id);
      p.submitted = true;
    });
  }

  function allSubmitted() {
    const need = state.players.filter(p => p.alive && !p.isBot && p.connected);
    if (!need.length) return false;
    return need.every(p => p.submitted);
  }

  function settleRound() {
    // 没锁定的人由引擎兜底：自动按「集」结算（B.settle 内部处理）
    B.settle(state);
    if (state.phase === 'over') { deadline = 0; remainTotal = 0; broadcast(true); return; }
    setPhase('reveal', state.settings.revealSec);
  }

  function nextRound() {
    if (state.phase === 'over') { broadcast(true); return; }
    if (state.players.filter(p => p.alive).length <= 1) { state.phase = 'over'; broadcast(true); return; }
    setPhase('select', state.settings.selectSec);
  }

  function tick() {
    if (!isHost) return;
    const left = remainMs();
    if (state.phase === 'select') {
      if (left <= 0) settleRound();
      else if (state.settings.autoAdvance && allSubmitted() && left < remainTotal - 800) settleRound();
      else broadcast(false);
    } else if (state.phase === 'reveal') {
      if (left <= 0) nextRound();
      else broadcast(false);
    }
  }

  function ensureTicker() {
    if (ticker) return;
    ticker = setInterval(tick, TICK_MS);
  }

  /* ------------------------------------------------------ 主机：处理消息 */
  function onHostData(data, conn) {
    if (!data || !data.t) return;
    if (data.t === 'join') {
      const id = String(data.id || '').slice(0, 24) || 'u' + Math.random().toString(36).slice(2, 8);
      const link = conns.find(c => c.conn === conn);
      if (link) link.id = id;
      const exist = B.getPlayer(state, id);
      if (exist) {
        exist.connected = true;
        exist.name = exist.name || data.name;
      } else {
        if (state.players.length >= 12) { try { conn.send({ t: 'err', msg: '房间满了（最多 12 人）' }); } catch (e) { /* 忽略 */ } return; }
        const p = B.addPlayer(state, id, String(data.name || '玩家').slice(0, 8) || '玩家');
        p.connected = true;
        state.log.push({ k: 'text', s: `${p.name} 加入了房间` });
      }
      try { conn.send({ t: 'welcome', code: code, id: id, you: id }); } catch (e) { /* 忽略 */ }
      broadcast(true);
      toast(B.getPlayer(state, id).name + ' 加入了');
      return;
    }
    const link = conns.find(c => c.conn === conn);
    const id = link ? link.id : null;
    if (!id) return;
    if (data.t === 'action') {
      const v = B.validate(state, id, data.action);
      if (!v.ok) { try { conn.send({ t: 'err', msg: v.errors.join('；') }); } catch (e) { /* 忽略 */ } return; }
      const p = B.getPlayer(state, id);
      p.picks = B.normalize(state, id, data.action);
      p.submitted = true;
      broadcast(true);
    }
    if (data.t === 'ready') {
      const p = B.getPlayer(state, id);
      if (p && state.phase === 'lobby') { p.ready = !!data.ready; broadcast(true); }
    }
    if (data.t === 'unlock') {
      const p = B.getPlayer(state, id);
      if (p && p.alive && state.phase === 'select') {
        p.picks = B.emptyPicks();
        p.submitted = false;
        broadcast(true);
      }
    }
  }

  /* --------------------------------------------------------------- 建房 */
  function create(name) {
    APP.busy = true;
    name = String(name || '房主').slice(0, 8);
    code = randCode();
    isHost = true;
    state = B.newState();
    state.hostId = myId;
    B.addPlayer(state, myId, name, { isHost: true });
    APP.me = myId;
    APP.isHost = true;
    APP.roomCode = code;
    APP.mode = 'room';
    APP.status = libOK() ? '正在开房…' : '联机服务没加载出来：这一局只能加电脑玩家一起玩（刷新页面可以再试）';
    VIEW.render();
    ensureTicker();     // 一定要先转起来：房主可能在联机服务连上之前就开局

    if (!libOK()) {                  // 降级：单机房间
      broadcast(true);
      return;
    }
    openHostPeer(0);
  }

  function openHostPeer(retry) {
    try { if (peer) peer.destroy(); } catch (e) { /* 忽略 */ }
    peer = new window.Peer(PEER_PREFIX + code, { debug: 1 });
    peer.on('open', () => {
      APP.status = '';
      broadcast(true);
      VIEW.render();
    });
    peer.on('connection', conn => {
      conns.push({ conn: conn, id: null });
      conn.on('data', d => onHostData(d, conn));
      conn.on('open', () => { broadcast(true); });
      conn.on('close', () => {
        const link = conns.find(c => c.conn === conn);
        if (link && link.id) {
          const p = B.getPlayer(state, link.id);
          if (p) { p.connected = false; p.submitted = true; state.log.push({ k: 'text', s: `${p.name} 掉线了` }); }
          broadcast(true);
        }
        conns = conns.filter(c => c.conn !== conn);
        VIEW.render();
      });
      conn.on('error', () => { /* 单个连接出错不影响房间 */ });
    });
    peer.on('error', err => {
      const type = err && err.type;
      if (type === 'unavailable-id' && retry < 3) {     // 房间号撞车，换一个
        code = randCode();
        APP.roomCode = code;
        openHostPeer(retry + 1);
        return;
      }
      APP.status = type === 'network' || type === 'server-error' || type === 'socket-error'
        ? '连不上联机服务（可能网络被限制）。你仍然可以加电脑玩家开局，或刷新重试。'
        : '联机出错：' + (err && err.message ? err.message : type || '未知');
      VIEW.render();
    });
    peer.on('disconnected', () => {
      try { peer.reconnect(); } catch (e) { /* 忽略 */ }
    });
  }

  /* --------------------------------------------------------------- 加入 */
  function join(roomCode, name) {
    if (!libOK()) { status('联机服务没加载出来，没法加入别人的房间。刷新页面再试，或自己开房和电脑玩。'); return; }
    code = String(roomCode || '').toUpperCase().trim();
    isHost = false;
    APP.me = myId;
    APP.isHost = false;
    APP.roomCode = code;
    APP.mode = 'room';
    APP.status = '正在连接房间 ' + code + '…';
    VIEW.render();
    openClientPeer(name, 0);
  }

  function openClientPeer(name, retry) {
    try { if (peer) peer.destroy(); } catch (e) { /* 忽略 */ }
    peer = new window.Peer(null, { debug: 1 });
    peer.on('open', () => {
      const conn = peer.connect(PEER_PREFIX + code, { reliable: true });
      myConn = conn;
      const timer = setTimeout(() => {
        if (!conn.open) { failJoin('连接超时：房间号对不对？房主还在房间里吗？'); }
      }, 12000);
      conn.on('open', () => {
        clearTimeout(timer);
        joinRetry = 0;
        APP.status = '';
        conn.send({ t: 'join', name: String(name || '玩家').slice(0, 8), id: myId });
        VIEW.render();
      });
      conn.on('data', d => {
        if (!d || !d.t) return;
        if (d.t === 'state') {
          APP.roomCode = d.code || code;
          VIEW.update(d.pub, d.remainMs, d.remainTotal);
        } else if (d.t === 'err') {
          toast(d.msg);
        }
      });
      conn.on('close', () => {
        clearTimeout(timer);
        if (joinRetry < 3) {
          joinRetry++;
          APP.status = '和房主断开了，正在重连…（' + joinRetry + '/3）';
          VIEW.render();
          setTimeout(() => openClientPeer(name, joinRetry), 1500);
        } else {
          failJoin('房主离开了房间');
        }
      });
      conn.on('error', () => { clearTimeout(timer); failJoin('连接出错，房间可能已经关了'); });
    });
    peer.on('error', err => {
      const type = err && err.type;
      if (type === 'peer-unavailable') failJoin('没找到房间 ' + code + '（房间号写错？或者房主已经退出了）');
      else failJoin('联机出错：' + (err && err.message ? err.message : type || '未知'));
    });
  }

  function failJoin(msg) {
    APP.status = msg;
    APP.mode = 'home';
    APP.pub = null;
    VIEW.resetDraft();
    VIEW.render();
    if (peer) { try { peer.destroy(); } catch (e) { /* 忽略 */ } peer = null; }
  }

  /* --------------------------------------------------------- 主机操作 */
  function start() {
    if (!isHost || !state) return;
    if (state.players.length < 2) { toast('至少要 2 个人（可以加电脑玩家）'); return; }
    if (state.phase !== 'lobby') return;              // 防连点：已经在局内就别重开
    const notReady = state.players.filter(p => p.connected && !p.ready);
    if (notReady.length) {
      toast(`还有 ${notReady.length} 人没准备：${notReady.map(p => p.name).join('、')}`);
      return;
    }
    ensureTicker();
    state.round = 1;
    state.winner = null;
    state.players.forEach(p => { p.picks = B.emptyPicks(); p.submitted = false; });
    APP.mode = 'game';
    setPhase('select', state.settings.selectSec);
  }

  /** 准备 / 取消准备（房主自己也算一个，必须所有玩家都点头） */
  function setReady(ready) {
    if (isHost) {
      if (!state) return;
      const p = B.getPlayer(state, myId);
      if (p) { p.ready = !!ready; broadcast(true); }
    } else if (myConn && myConn.open) {
      myConn.send({ t: 'ready', ready: !!ready });
    } else {
      toast('还没连上房主，稍等再试');
    }
  }

  function addBot() {
    if (!isHost || !state) return;
    if (state.players.length >= 12) { toast('房间满了'); return; }
    const n = state.players.filter(p => p.isBot).length + 1;
    const names = ['刀客', '阿飞', '老六', '铁憨憨', '小刀', '摸鱼王', '夜行者', '大聪明'];
    const p = B.addPlayer(state, 'bot' + Date.now() + n, names[(n - 1) % names.length] + (n > names.length ? n : ''), { isBot: true });
    p.ready = true;                      // 电脑永远算准备好了，不挡开局
    state.log.push({ k: 'text', s: `${p.name}（电脑）加入了房间` });
    broadcast(true);
  }

  function kick(id) {
    if (!isHost || !state) return;
    const p = B.getPlayer(state, id);
    if (!p || p.isHost) return;
    state.players = state.players.filter(x => x.id !== id);
    const link = conns.find(c => c.id === id);
    if (link) {
      try { link.conn.send({ t: 'err', msg: '你被房主移出了房间' }); link.conn.close(); } catch (e) { /* 忽略 */ }
      conns = conns.filter(c => c !== link);
    }
    state.log.push({ k: 'text', s: `${p.name} 被移出房间` });
    broadcast(true);
  }

  function setSetting(key, value) {
    if (!isHost || !state) return;
    if (key === 'pack.hp' || key === 'pack.rainbow' || key === 'pack.self') {
      state.settings.packs[key.split('.')[1]] = !!value;
    } else if (key === 'selectSec') {
      state.settings.selectSec = Math.min(600, Math.max(3, Number(value) || 5));
    } else if (key === 'revealSec') {
      state.settings.revealSec = Math.min(120, Math.max(2, Number(value) || 3));
    } else if (key === 'autoAdvance') {
      state.settings.autoAdvance = !!value;
    } else if (key === 'ecoOpen') {
      state.settings.ecoOpen = !!value;
    }
    broadcast(true);
  }

  function rematch() {
    if (!isHost || !state) return;
    state.players.forEach(p => {
      p.alive = true; p.hp = 0; p.points = 0;
      p.bag = { jingxue: 0, jianqi: 0, tianlei: 0, feimei: 0 };
      p.picks = B.emptyPicks(); p.submitted = false;
      p.selfGuardUntil = -1; p.selfGuardTriggered = false; p.inDuel = false; p.duel = null;
      p.ready = p.isBot;                 // 再来一局要重新确认一遍（电脑除外）
    });
    state.round = 1;
    state.winner = null;
    state.phase = 'lobby';
    state.log = [];
    state.lastResult = null;
    state.history = [];                    // 新一局，旧档案清掉（否则最终战报会混进上一局的回合）
    APP.mode = 'room';
    VIEW.resetDraft();
    broadcast(true);
  }

  /* ------------------------------------------------------------ 出招提交 */
  function submit(action) {
    if (!state && !isHost && !myConn) return;
    if (isHost) {
      if (!state || state.phase !== 'select') return;
      const p = B.getPlayer(state, myId);
      if (!p || !p.alive) return;
      p.picks = B.normalize(state, myId, action);
      p.submitted = true;
      broadcast(true);
    } else {
      if (myConn && myConn.open) myConn.send({ t: 'action', action: action });
      else toast('还没连上房主，稍等再试');
    }
  }

  /** 撤销锁定（「清空」时用：既然不能出空手，就别让服务器以为你还锁着旧招） */
  function unlock() {
    if (!state && !isHost && !myConn) return;
    if (isHost) {
      if (!state || state.phase !== 'select') return;
      const p = B.getPlayer(state, myId);
      if (!p || !p.alive) return;
      p.picks = B.emptyPicks();
      p.submitted = false;
      broadcast(true);
    } else if (myConn && myConn.open) {
      myConn.send({ t: 'unlock' });
    }
  }

  function leave() {
    try { if (myConn) myConn.close(); } catch (e) { /* 忽略 */ }
    try { if (peer) peer.destroy(); } catch (e) { /* 忽略 */ }
    peer = null; myConn = null; conns = [];
    if (ticker) { clearInterval(ticker); ticker = null; }
    isHost = false; state = null; code = '';
    APP.mode = 'home'; APP.pub = null; APP.status = ''; APP.roomCode = '';
    APP.isHost = false; APP.me = null; APP.remainMs = 0;
    VIEW.resetDraft();
    VIEW.render();
  }

  return {
    create: create, join: join, start: start, addBot: addBot, kick: kick,
    setSetting: setSetting, rematch: rematch, submit: submit, unlock: unlock, leave: leave, setReady: setReady,
    isHost: () => isHost, code: () => code, myId: () => myId
  };
})();
</script>
<script>
  // 联机库姗姗来迟时，把"连不上"的提示撤掉
  window.__peerReady = function () {
    if (VIEW.app.status && /联机服务/.test(VIEW.app.status)) {
      VIEW.app.status = '';
      VIEW.render();
    }
  };
  VIEW.bind();
  VIEW.render();
</script>
</body>
