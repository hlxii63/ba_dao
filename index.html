<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ededed">
<meta name="description" content="拔刀：同时出招的回合制聚会桌游。0 血起步，一回合定生死。支持开房间在线联机，也可以和电脑玩。">
<title>拔刀</title>
<style>/* ============================================================================
   拔刀 · 样式
   排版参考 hullqin 的桌游工具：浅灰底 #ededed + 白卡片 + 蓝色强调 + 移动优先
   间距只用 4 / 8 / 12 / 16 / 24 / 32 这几档，避免忽大忽小
   ==========================================================================*/
:root {
  --bg: #ededed;
  --card: #ffffff;
  --ink: #273847;
  --ink-2: #4b5b6b;
  --muted: #788fa5;
  --line: #e3e6ea;
  --line-2: #f2f4f6;
  --blue: #3b82f6;
  --blue-d: #2563eb;
  --blue-bg: #eaf2ff;
  --red: #ef4444;
  --red-bg: #fdecec;
  --green: #10b981;
  --green-bg: #e8f8f2;
  --green-ink: #0d8f6f;
  --amber: #f59e0b;
  --amber-bg: #fff5e6;
  --purple: #8b5cf6;
  --purple-bg: #f2eefe;
  --purple-ink: #6d3fe0;
  --r-s: 8px;
  --r-m: 12px;
  --r-l: 16px;
  --shadow: 0 1px 2px rgba(39, 56, 71, .06), 0 4px 12px rgba(39, 56, 71, .04);
  --shadow-up: 0 -2px 12px rgba(39, 56, 71, .08);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Microsoft YaHei UI", "Microsoft YaHei", Ubuntu, "Helvetica Neue", sans-serif;
  font-size: 15px;
  line-height: 1.6;
  overflow-wrap: break-word;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; }
h1, h2, h3, h4, p { margin: 0; }
ul { margin: 0; padding: 0; list-style: none; }
.hidden { display: none !important; }

/* --------------------------------------------------------------- 通用件 */
.wrap { max-width: 760px; margin: 0 auto; padding: 16px 16px 24px; }
.card {
  background: var(--card);
  border-radius: var(--r-l);
  box-shadow: var(--shadow);
  padding: 16px;
}
.card + .card { margin-top: 12px; }
.row { display: flex; align-items: center; gap: 8px; }
.row.space { justify-content: space-between; }
.grow { flex: 1; min-width: 0; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.tiny { font-size: 12px; }
.bold { font-weight: 600; }
.ellipsis { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.divider { height: 1px; background: var(--line); margin: 12px 0; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 44px; padding: 0 16px;
  border-radius: var(--r-m);
  background: var(--line-2);
  color: var(--ink);
  font-weight: 600;
  transition: transform .06s ease, background .15s ease, opacity .15s ease;
}
.btn:active { transform: scale(.98); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--blue); color: #fff; }
.btn.primary:hover { background: var(--blue-d); }
.btn.danger { background: var(--red-bg); color: var(--red); }
.btn.ghost { background: transparent; border: 1px solid var(--line); }
.btn.block { width: 100%; }
.btn.lg { min-height: 52px; font-size: 17px; }
.btn.sm { min-height: 34px; padding: 0 10px; font-size: 13px; }

.field {
  width: 100%; min-height: 44px; padding: 0 12px;
  background: var(--line-2); border: 1px solid transparent; border-radius: var(--r-m);
}
.field:focus { outline: none; background: #fff; border-color: var(--blue); }

.badge {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 1px 8px; border-radius: 999px;
  font-size: 12px; font-weight: 600; line-height: 1.7;
}
.badge.blue { background: var(--blue-bg); color: var(--blue-d); }
.badge.red { background: var(--red-bg); color: var(--red); }
.badge.green { background: var(--green-bg); color: var(--green-ink); }
.badge.amber { background: var(--amber-bg); color: #b46b00; }
.badge.purple { background: var(--purple-bg); color: var(--purple-ink); }
.badge.grey { background: var(--line-2); color: var(--muted); }

/* --------------------------------------------------------------- 首页 */
.hero { text-align: center; padding: 32px 0 24px; }
.hero h1 { font-size: 40px; font-weight: 800; letter-spacing: .12em; }
.hero h1 span { color: var(--blue); }
.hero p { color: var(--muted); margin-top: 8px; }

/* --------------------------------------------------------------- 顶栏 */
.topbar {
  position: sticky; top: 0; z-index: 30;
  background: rgba(237, 237, 237, .94);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
}
.topbar .inner { max-width: 760px; margin: 0 auto; padding: 8px 16px; display: flex; align-items: center; gap: 8px; }

/* 倒计时 */
.timer { display: flex; align-items: center; gap: 12px; }
.timer .num {
  font-size: 30px; font-weight: 800; font-variant-numeric: tabular-nums;
  min-width: 62px; text-align: center; line-height: 1;
}
.timer .num.warn { color: var(--red); }
.bar { height: 6px; border-radius: 999px; background: var(--line); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--blue); transition: width .45s linear; }
.bar > i.warn { background: var(--red); }

/* --------------------------------------------------------------- 玩家格 */
.players { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.pcard {
  background: var(--card); border-radius: var(--r-m); padding: 10px 12px;
  border: 1.5px solid transparent; box-shadow: var(--shadow);
  position: relative; transition: border-color .15s ease;
}
.pcard.me { border-color: var(--blue); }
.pcard.dead { opacity: .5; }
.pcard.reveal-dead { border-color: var(--red); }
.pcard .pname { font-weight: 700; display: flex; align-items: center; gap: 4px; }
.pcard .stats { display: flex; gap: 10px; margin-top: 4px; font-size: 13px; color: var(--ink-2); }
.pcard .stats b { font-variant-numeric: tabular-nums; }
.pcard .flags { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 4px; }
.pcard .flags:empty { display: none; }
.pcard .act {
  margin-top: 6px; padding-top: 6px; border-top: 1px dashed var(--line);
  font-size: 12.5px; color: var(--ink-2);
}
.pcard .act .ev { display: block; color: var(--muted); }
.pcard .act .ev.hit { color: var(--red); }
.pcard .act .ev.good { color: var(--green-ink); }
.avatar {
  width: 22px; height: 22px; border-radius: 50%; flex: none;
  display: inline-flex; align-items: center; justify-content: center;
  color: #fff; font-size: 12px; font-weight: 700;
}

/* --------------------------------------------------------------- 道具面板 */
.myinfo { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.myinfo .kv { display: flex; align-items: baseline; gap: 4px; }
.myinfo .kv b { font-size: 20px; font-variant-numeric: tabular-nums; }
.bag { display: flex; gap: 6px; flex-wrap: wrap; }
.bag .chip {
  background: var(--purple-bg); color: var(--purple-ink);
  border-radius: 999px; padding: 1px 10px; font-size: 12px; font-weight: 600;
}

.tabs { display: flex; gap: 4px; overflow-x: auto; padding-bottom: 4px; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: none; padding: 6px 14px; border-radius: 999px;
  background: var(--line-2); color: var(--ink-2); font-size: 13.5px; font-weight: 600;
}
.tab.on { background: var(--blue); color: #fff; }
.tab .dot {
  display: inline-block; min-width: 16px; margin-left: 4px; padding: 0 4px;
  background: var(--red); color: #fff; border-radius: 999px; font-size: 11px;
}

.items { display: grid; grid-template-columns: repeat(auto-fill, minmax(148px, 1fr)); gap: 8px; margin-top: 12px; }
.item {
  border: 1.5px solid var(--line); border-radius: var(--r-m); padding: 10px;
  background: #fff; transition: border-color .15s ease, background .15s ease;
}
.item.on { border-color: var(--blue); background: var(--blue-bg); }
.item.locked { opacity: .4; }
.item .head { display: flex; align-items: center; gap: 6px; }
.item .icon { font-size: 17px; }
.item .nm { font-weight: 700; }
.item .cost { margin-left: auto; font-size: 12px; font-weight: 700; color: var(--amber); }
.item .cost.free { color: var(--green-ink); }
.item .desc { font-size: 12px; color: var(--muted); margin-top: 2px; line-height: 1.45; }
.item .ctrl { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
.stepper { display: flex; align-items: center; gap: 2px; background: var(--line-2); border-radius: 999px; padding: 2px; }
.stepper button {
  width: 30px; height: 30px; border-radius: 50%; font-size: 17px; font-weight: 700; color: var(--ink-2);
}
.stepper button:active { background: #fff; }
.stepper .n { min-width: 22px; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; }

/* 目标多选：点头像选人 */
.targets { margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--line); }
.tchips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 4px; }
.tchip {
  position: relative;
  width: 32px; height: 32px; border-radius: 50%;
  background: var(--line-2); color: var(--muted);
  font-size: 13px; font-weight: 700;
  border: 2px solid transparent;
  display: inline-flex; align-items: center; justify-content: center;
  transition: background .12s ease, color .12s ease, border-color .12s ease;
}
.tchip.on { background: var(--blue); color: #fff; border-color: var(--blue-d); }
.tchip i {
  position: absolute; right: -4px; bottom: -4px;
  min-width: 16px; height: 16px; padding: 0 3px;
  background: var(--red); color: #fff; border-radius: 999px;
  font-size: 11px; font-style: normal; font-weight: 700; line-height: 16px; text-align: center;
}

.quick { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.err { color: var(--red); font-size: 13px; margin-top: 8px; }

/* --------------------------------------------------------------- 底栏 */
.actionbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
  background: rgba(255, 255, 255, .96);
  backdrop-filter: blur(10px);
  box-shadow: var(--shadow-up);
  padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
}
.actionbar .inner { max-width: 760px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
.actionbar .info { font-size: 13px; color: var(--muted); }
.spacer-bottom { height: 84px; }

/* --------------------------------------------------------------- 弹层 */
.mask {
  position: fixed; inset: 0; z-index: 50;
  background: rgba(39, 56, 71, .45);
  display: flex; align-items: flex-end; justify-content: center;
}
.sheet {
  width: 100%; max-width: 760px; max-height: 86vh; overflow: auto;
  background: var(--card); border-radius: var(--r-l) var(--r-l) 0 0;
  padding: 16px 16px calc(16px + env(safe-area-inset-bottom));
  animation: slide-up .18s ease-out;
}
@keyframes slide-up { from { transform: translateY(16px); opacity: .6; } to { transform: none; opacity: 1; } }
.sheet h3 { font-size: 17px; font-weight: 700; }
.tlist { margin-top: 8px; }
.trow {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 0; border-bottom: 1px solid var(--line-2);
}
.trow .nm { flex: 1; min-width: 0; }
.sheet .foot { display: flex; gap: 8px; margin-top: 16px; }
.sheet .foot .btn { flex: 1; }

/* 规则正文 */
.doc { font-size: 14px; line-height: 1.8; color: var(--ink-2); }
.doc h4 { font-size: 15px; font-weight: 700; color: var(--ink); margin: 16px 0 4px; }
.doc h4:first-child { margin-top: 0; }
.doc b { color: var(--ink); }
.doc code { background: var(--line-2); padding: 0 4px; border-radius: 4px; font-size: 13px; }

/* 日志 */
.logbox { max-height: 40vh; overflow: auto; font-size: 13px; color: var(--ink-2); }
.logbox li { padding: 4px 0; border-bottom: 1px solid var(--line-2); }
.logbox li:last-child { border-bottom: 0; }

/* toast */
.toast {
  position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%);
  z-index: 60; background: rgba(39, 56, 71, .92); color: #fff;
  padding: 8px 16px; border-radius: 999px; font-size: 13.5px;
  animation: fade-in .15s ease-out; max-width: 86vw; text-align: center;
}
@keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }

/* 结算高亮 */
.res { border-left: 3px solid var(--blue); padding-left: 8px; }
.res.died { border-left-color: var(--red); }

.stepper button[disabled] { opacity: .3; pointer-events: none; }

.row.wrap { flex-wrap: wrap; }

/* --------------------------------------------------- 结算动画 / 出局表现 */
/* 依次揭示每个人出了什么：靠 animation-delay 排队，JS 只负责给延迟 */
@keyframes pop-in {
  from { opacity: 0; transform: translateY(6px) scale(.96); }
  to   { opacity: 1; transform: none; }
}
.rv { animation: pop-in .38s cubic-bezier(.2, .9, .3, 1.2) both; }

/* 飘起来的伤害数字 */
@keyframes dmg-pop {
  0%   { opacity: 0; transform: translate(-50%, 6px) scale(.7); }
  25%  { opacity: 1; transform: translate(-50%, -2px) scale(1.15); }
  100% { opacity: 0; transform: translate(-50%, -26px) scale(1); }
}
.dmgfly {
  position: absolute; right: 10px; top: 6px; z-index: 5;
  font-size: 22px; font-weight: 800; color: var(--red);
  text-shadow: 0 1px 0 #fff, 0 0 8px rgba(239, 68, 68, .35);
  animation: dmg-pop 1.3s ease-out both; pointer-events: none;
}

/* 挨致命一击时抖一下 */
@keyframes shake {
  0%, 100% { transform: none; }
  15% { transform: translateX(-4px) rotate(-.6deg); }
  35% { transform: translateX(4px) rotate(.6deg); }
  55% { transform: translateX(-3px); }
  75% { transform: translateX(3px); }
}
.pcard .inner.dying { animation: shake .5s ease-in-out both; }

/* 死亡标记 */
@keyframes skull-in {
  0%   { opacity: 0; transform: scale(.4) rotate(-25deg); }
  60%  { opacity: 1; transform: scale(1.25) rotate(6deg); }
  100% { opacity: 1; transform: scale(1) rotate(0); }
}
.skull {
  position: absolute; right: 8px; bottom: 6px; z-index: 6;
  font-size: 22px; animation: skull-in .5s ease-out both;
}

/* 完全死亡的玩家：头像变黑白（决斗中的不算完全死亡，保持彩色） */
.pcard.fully-dead { background: #f7f7f8; }
.pcard.fully-dead .avatar { filter: grayscale(1) contrast(.85); }
.pcard.fully-dead .pname, .pcard.fully-dead .stats { color: var(--muted); }

@media (prefers-reduced-motion: reduce) {
  .rv, .dmgfly, .skull, .pcard .inner.dying { animation: none !important; }
}

/* ------------------------------------------------- 谁打了谁：连线 + 明细 */
.players { position: relative; }
svg.arrows {
  position: absolute; inset: 0; width: 100%; height: 100%;
  pointer-events: none; z-index: 4; overflow: visible;
}
@keyframes draw-arrow { to { stroke-dashoffset: 0; } }
svg.arrows path { animation: draw-arrow .5s ease-out both; }

/* 卡片上的出招明细：一行"我打谁"，一行"被谁打" */
.pcard .act .who { font-weight: 600; color: var(--ink); }
.pcard .act .ev.hit2 { color: var(--red); font-weight: 600; }

/* 战报每条都是多行文本，靠 pre-line 保留换行 */
.logbox { white-space: pre-line; }
.log-legend { display: flex; gap: 10px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.log-legend i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; margin-right: 4px; vertical-align: middle; }

/* -------------------------------------------- 结算演出：字幕条 / 亮框 / 结算行 */
/* 顶部字幕：按拍子依次念出"现在演到谁"，后来的盖住前面的 */
.reveal-caption { position: relative; height: 28px; margin-top: 10px; }
.reveal-caption .cap {
  position: absolute; left: 0; right: 0; top: 0; bottom: 0;
  display: flex; align-items: center; justify-content: center;
  background: var(--card); border-radius: 999px; box-shadow: var(--shadow);
  font-size: 13.5px; font-weight: 600; color: var(--ink);
  opacity: 0; animation: cap-in .18s ease-out both;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  padding: 0 12px;
}
@keyframes cap-in { to { opacity: 1; } }

/* 正在出手的人：亮一下边框，让人知道现在演到谁 */
@keyframes act-pulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); }
  35% { box-shadow: 0 0 0 4px rgba(59, 130, 246, .35); }
}
.pcard.acting { animation: act-pulse 1.1s ease-out both; }

/* 挨打（没死也）抖一下 */
.pcard .inner.hit { animation: shake .45s ease-in-out both; }

/* 结算行与花费 */
.pcard .act .ev.sumline { color: var(--ink); font-weight: 600; background: var(--line-2); border-radius: 6px; padding: 1px 6px; }
.pcard .act .cost { color: var(--amber); font-weight: 600; font-size: 12px; margin-left: 6px; }

/* 连线画完停一会儿就淡出，免得一屏全是线 */
@keyframes arrow-fade { to { opacity: 0; } }

@media (prefers-reduced-motion: reduce) {
  .reveal-caption .cap, .pcard.acting, .pcard .inner.hit { animation: none !important; opacity: 1 !important; }
  svg.arrows path { animation: draw-arrow .01s linear both !important; }
}

/* --------------------------------- 飞刀 / 盾牌：真正的几何动画（沿路径飞行） */
.fx { position: absolute; inset: 0; pointer-events: none; z-index: 6; overflow: visible; }
.fly {
  position: absolute; left: 0; top: 0;
  display: inline-block; font-size: 17px; line-height: 1;
  offset-rotate: 0deg;
  animation-name: fly, puff;
  animation-timing-function: ease-in, ease-out;
  animation-duration: .55s, .28s;
  animation-fill-mode: both, both;
}
@keyframes fly {
  from { offset-distance: 0%; opacity: 0; }
  18% { opacity: 1; }
  to { offset-distance: 100%; opacity: 1; }
}
@keyframes puff { from { opacity: 1; } to { opacity: 0; } }
.fly.back { font-size: 16px; filter: drop-shadow(0 0 5px rgba(239, 68, 68, .95)); }

.shield {
  position: absolute; display: inline-block; font-size: 27px; line-height: 1;
  transform: translate(-50%, -50%);
  animation-name: shield-pop, puff;
  animation-timing-function: ease-out, ease-in;
  animation-duration: .38s, .32s;
  animation-fill-mode: both, both;
}
.shield.block { filter: drop-shadow(0 0 7px rgba(59, 130, 246, .95)); }
.shield.rev { filter: drop-shadow(0 0 8px rgba(245, 158, 11, .95)); font-size: 30px; }
@keyframes shield-pop {
  from { transform: translate(-50%, -50%) scale(.3); opacity: 0; }
  55% { transform: translate(-50%, -50%) scale(1.25); opacity: 1; }
  to { transform: translate(-50%, -50%) scale(1); opacity: .95; }
}

@media (prefers-reduced-motion: reduce) {
  .fx { display: none; }               /* 关掉动效时只留连线，别让道具堆在角落里 */
}

/* ------------------------ 防御 / 盾：每种一个明显不同的特效（空放也亮） */
.dfx {
  position: absolute; transform: translate(-50%, -50%);
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  animation: dfx-in .3s ease-out both; pointer-events: none;
}
.dfx .ic { font-size: 30px; line-height: 1; }
.dfx .lb {
  font-size: 11px; font-weight: 700; white-space: nowrap;
  padding: 1px 7px; border-radius: 999px;
  background: rgba(39, 56, 71, .85); color: #fff;
}
@keyframes dfx-in { from { opacity: 0; } to { opacity: 1; } }
@keyframes dfx-out { to { opacity: 0; transform: translate(-50%, -62%) scale(.9); } }

/* 不死：绿色柔光，轻轻一起一伏 */
.d-busi .ic { animation: fx-soft 1.4s ease-in-out both; filter: drop-shadow(0 0 7px rgba(16, 185, 129, .95)); }
@keyframes fx-soft { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.18); } }

/* 小防：蓝色小圆盾，弹出来 */
.d-xiaofang .ic { animation: fx-pop 1.4s ease-out both; filter: drop-shadow(0 0 7px rgba(59, 130, 246, .95)); }
@keyframes fx-pop { 0% { transform: scale(.4); opacity: 0; } 45% { transform: scale(1.25); opacity: 1; } 100% { transform: scale(1); } }

/* 大防：更深的蓝、更大，两层光环 */
.d-dafang .ic { animation: fx-pop2 1.5s ease-out both; font-size: 38px; filter: drop-shadow(0 0 12px rgba(37, 99, 235, 1)); }
@keyframes fx-pop2 {
  0% { transform: scale(.4); opacity: 0; }
  40% { transform: scale(1.35); opacity: 1; }
  70% { box-shadow: 0 0 0 10px rgba(37, 99, 235, .25); }
  100% { transform: scale(1); box-shadow: 0 0 0 18px rgba(37, 99, 235, 0); }
}

/* 磁盾：紫色，边转边振 */
.d-cidun .ic { animation: fx-spin 1.6s linear both; filter: drop-shadow(0 0 9px rgba(139, 92, 246, 1)); }
@keyframes fx-spin { 0% { transform: rotate(0) scale(.6); opacity: 0; } 30% { transform: rotate(180deg) scale(1.15); opacity: 1; } 100% { transform: rotate(360deg) scale(1); } }

/* 黑洞：黑紫漩涡，边转边缩小（把攻击吸进去） */
.d-heidong .ic { animation: fx-vortex 1.6s ease-in-out both; filter: drop-shadow(0 0 12px rgba(76, 29, 149, 1)); }
@keyframes fx-vortex { 0% { transform: rotate(-90deg) scale(1.5); opacity: 0; } 40% { transform: rotate(0) scale(1); opacity: 1; } 100% { transform: rotate(200deg) scale(.72); } }

/* 白洞：白光炸开，罩住整张卡 */
.d-baidong .ic { animation: fx-flash 1.5s ease-out both; font-size: 40px; filter: drop-shadow(0 0 18px rgba(255, 255, 255, 1)); }
@keyframes fx-flash {
  0% { transform: scale(.3); opacity: 0; }
  35% { transform: scale(1.6); opacity: 1; box-shadow: 0 0 0 0 rgba(255, 255, 255, .9); }
  100% { transform: scale(1); box-shadow: 0 0 0 26px rgba(255, 255, 255, 0); }
}

/* 反盾：橙色回旋镖，来回甩 */
.d-fan .ic { animation: fx-swipe 1.5s ease-out both; filter: drop-shadow(0 0 10px rgba(245, 158, 11, 1)); }
@keyframes fx-swipe {
  0% { transform: rotate(-120deg) scale(.5); opacity: 0; }
  35% { transform: rotate(20deg) scale(1.25); opacity: 1; }
  60% { transform: rotate(-15deg) scale(1); }
  100% { transform: rotate(0) scale(1); }
}

/* 合掌：金色上浮的光 */
.d-hezhang .ic { animation: fx-rise 1.5s ease-out both; filter: drop-shadow(0 0 10px rgba(251, 191, 36, 1)); }
@keyframes fx-rise { 0% { transform: translateY(10px) scale(.6); opacity: 0; } 40% { transform: translateY(-2px) scale(1.2); opacity: 1; } 100% { transform: translateY(-14px) scale(1); opacity: .95; } }

/* 自守：紫色呼吸光环 */
.d-zishou .ic { animation: fx-breathe 1.8s ease-in-out both; filter: drop-shadow(0 0 10px rgba(139, 92, 246, .95)); }
@keyframes fx-breathe {
  0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(139, 92, 246, .45); }
  50% { transform: scale(1.12); box-shadow: 0 0 0 12px rgba(139, 92, 246, 0); }
}

/* 被「反刀」完全破盾：抖一下裂开 */
.dfx.broken .ic { animation: fx-break .7s ease-out both; }
.dfx.broken .lb { background: var(--red); }
@keyframes fx-break {
  0% { transform: scale(1.1) rotate(0); }
  25% { transform: scale(1.15) rotate(-14deg); filter: grayscale(.4); }
  55% { transform: scale(.9) rotate(12deg); opacity: .7; }
  100% { transform: scale(.55) rotate(28deg); opacity: 0; }
}

@media (prefers-reduced-motion: reduce) {
  .fx { display: none; }
}

/* ============================================================================
   逐回合档案（最终战报）与复盘器
   间距仍然只用 4 / 8 / 12 / 16 / 24 这几档
   ==========================================================================*/
details.rnd { border-bottom: 1px solid var(--line-2); }
details.rnd:last-child { border-bottom: 0; }
details.rnd > summary {
  cursor: pointer; padding: 10px 0; font-weight: 700; font-size: 14px;
  list-style-position: inside;
}
details.rnd > summary::marker { color: var(--blue); }
details.rnd[open] > summary { color: var(--blue-d); padding-bottom: 4px; }
details.rnd > ul.logbox { padding: 0 0 8px; }
details.card > summary { padding: 2px 0; }

/* 回合选择：一排可以横向划的圆形按钮 */
.rchips { display: flex; gap: 6px; overflow-x: auto; padding: 2px 0 4px; }
.rchips::-webkit-scrollbar { display: none; }
.rchip {
  flex: 0 0 auto; border: 1px solid var(--line); background: var(--card); color: var(--ink-2);
  border-radius: 999px; padding: 4px 10px; font-size: 12px; font-weight: 600;
  font-family: inherit; cursor: pointer; line-height: 1.4;
}
.rchip.on { background: var(--blue); border-color: var(--blue); color: #fff; }
.rchip:active { transform: scale(.96); }

.rplay { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

/* 总览矩阵：横向滚动，首列与表头粘住 */
.rtable { overflow-x: auto; -webkit-overflow-scrolling: touch; border: 1px solid var(--line-2); border-radius: var(--r-s); }
.rtable table { border-collapse: collapse; font-size: 12px; }
.rtable th, .rtable td {
  border-right: 1px solid var(--line-2); border-bottom: 1px solid var(--line-2);
  padding: 6px 8px; text-align: left; vertical-align: top; white-space: nowrap;
}
.rtable th { background: #f7f8fa; font-weight: 700; position: sticky; top: 0; z-index: 2; }
.rtable td.rr, .rtable th.rr { position: sticky; left: 0; background: #f7f8fa; z-index: 1; }
.rtable tr.on td { background: var(--blue-bg); }
.rtable tr.on td.rr { background: var(--blue-bg); }
.rtable td .mini { color: var(--muted); font-size: 11px; line-height: 1.5; }

<!-- 联机库（PeerJS）：三个 CDN 依次兜底；拿不到就降级成"只能和电脑玩" -->
<script>
(function () {
  var urls = [
    'https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js',
    'https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js',
    'https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js'
  ];
  var i = 0;
  function next() {
    if (i >= urls.length) return;
    var s = document.createElement('script');
    s.src = urls[i++];
    s.async = true;
    s.onload = function () { if (window.__peerReady) window.__peerReady(); };
    s.onerror = next;
    document.head.appendChild(s);
  }
  next();
})();
</script>

<script>/* ============================================================================
 * 拔刀 · 规则引擎（纯逻辑，不碰 DOM，可被 node 直接 require 做单元测试）
 * ----------------------------------------------------------------------------
 * 血量模型：初始 0，下限 0，不设上限。
 *   结算时 伤害 = 外面总攻击 - 我的防御；若 血量 - 伤害 < 0 则死亡，否则扣血。
 *   也就是说 0 血的人挨 1 点伤害就死，合掌加血 = 多一层缓冲。
 * ==========================================================================*/
const BADAO = (function () {
  'use strict';

  const EPS = 1e-12;         // 浮点容差，必须远小于 FEI_EPS
  const FEI_EPS = 1e-9;      // 叠肥的 ε（趋于 0+，但要大到能被浮点分辨）
  const FEI_ATK = 2 - FEI_EPS; // 叠肥：2-ε —— 2 血的人能剩 ε 血站住，且破不了「小反」的 2 点弹性
  const MAX_HISTORY = 200;   // 最多留 200 回合的逐回合快照
  const MATCH_FORMAT = 'badao-match';
  const MATCH_VERSION = 1;

  /* ---------------------------------------------------------------- 道具表 */
  // kind: gain 集 | attack 攻击 | defense 防御 | reverse 反盾 | smite 磁暴
  //     | steal 偷 | heal 合掌 | selfguard 自守
  // pack: 所属拓展包（null = 基础包）
  const ITEM_LIST = [
    { id: 'ji', name: '集', cost: 0, kind: 'gain', icon: '🪙',
      desc: '点数 +1。结算时立刻到手，可用于本回合消费。' },

    { id: 'yidao', name: '一刀', cost: 1, kind: 'attack', atk: 1, icon: '🗡️', desc: '攻击 1。' },
    { id: 'shuangdao', name: '双刀', cost: 2, kind: 'attack', atk: 2, icon: '⚔️', desc: '攻击 2。' },
    { id: 'shangdiao', name: '上吊', cost: 3, kind: 'attack', atk: 3, icon: '🪢', desc: '攻击 3，赠送 1 个精血。', gift: { jingxue: 1 } },
    { id: 'sidao', name: '四刀', cost: 4, kind: 'attack', atk: 4, icon: '🔪', desc: '攻击 4，赠送 1 个剑气。', gift: { jianqi: 1 } },
    { id: 'wudao', name: '五刀', cost: 5, kind: 'attack', atk: 5, icon: '🗡', desc: '攻击 5，赠送 1 个天雷。', gift: { tianlei: 1 } },
    { id: 'caihong', name: '彩虹斩', cost: 8, kind: 'attack', atk: 8, icon: '🌈', lethal: true,
      desc: '攻击 8。命中即死，无视血量与自守；但会被防具挡下（伤害 ≤ 0 则无效）。基础规则每回合限 1 个。' },

    { id: 'jingxue', name: '精血', cost: 0, kind: 'attack', atk: 0.5, icon: '🩸', giftOnly: true,
      desc: '上吊的赠品。伤害 0.5，可叠加。' },
    { id: 'jianqi', name: '剑气', cost: 0, kind: 'attack', atk: 1, icon: '💨', giftOnly: true,
      desc: '四刀的赠品。伤害 1。' },
    { id: 'tianlei', name: '天雷', cost: 0, kind: 'attack', atk: 3, icon: '⚡', giftOnly: true,
      weakVs: ['xiaofang'], weakAtk: 2, desc: '五刀的赠品。伤害 3，但在小防面前只有 2 伤害。' },
    { id: 'feimei', name: '肥美', cost: 0, kind: 'attack', atk: 0.5, icon: '🍖', giftOnly: true,
      desc: '不死的赠品。伤害 0.5。' },
    { id: 'diefei', name: '叠肥', cost: 0, kind: 'attack', atk: FEI_ATK, icon: '🥩', consume: { feimei: 3 },
      desc: '独立道具，不是"叠肥美"：吃掉 3 个肥美，造成 2-ε 伤害。不可叠，打一个人就要吃 3 个。' },
    { id: 'cibao', name: '磁暴', cost: 1, kind: 'smite', smiteOn: ['cidun'], icon: '🧲',
      desc: '1 点。目标若出磁盾，立刻暴毙；否则无事发生。无伤害。' },
    { id: 'fandao', name: '反刀', cost: 1, kind: 'attack', atk: 0.5, pierceReverse: true, icon: '🤺',
      desc: '伤害 0.5，消耗 1 点。打到反盾上时：对方反盾「完全破盾」——整回合谁的刀都弹不回来，并且无视他的血量直接斩杀。' },

    { id: 'busi', name: '不死', cost: 0, kind: 'defense', def: 1, icon: '💚', gift: { feimei: 1 },
      desc: '防御 1，不耗点数，赠送 1 个肥美。' },
    { id: 'xiaofang', name: '小防', cost: 0, kind: 'defense', def: 2, icon: '🛡️', desc: '防御 2，不耗点数。' },
    { id: 'dafang', name: '大防', cost: 1, kind: 'defense', def: 3, icon: '🛡', desc: '防御 3，消耗 1 点。' },
    { id: 'cidun', name: '磁盾', cost: 2, kind: 'defense', def: 5, icon: '🧿', desc: '防御 5，消耗 2 点。会躲磁暴。' },
    { id: 'heidong', name: '黑洞', cost: 4, kind: 'defense', def: 8, icon: '🕳️', desc: '防御 8，消耗 4 点。' },
    { id: 'baidong', name: '白洞', cost: 6, kind: 'defense', def: Infinity, icon: '⚪', desc: '无穷防御，消耗 6 点。' },

    { id: 'xiaofan', name: '小反', cost: 1, kind: 'reverse', range: 2, icon: '🪃', desc: '弹性范围 2 点伤害。' },
    { id: 'dafan', name: '大反', cost: 2, kind: 'reverse', range: 4, icon: '🪃', desc: '弹性范围 4 点伤害。' },
    { id: 'chaofan', name: '超反', cost: 3, kind: 'reverse', range: 6.5, icon: '🪃', desc: '弹性范围 6.5 点伤害。' },

    { id: 'tou', name: '偷', cost: 0, kind: 'steal', specialDef: 0.5, multiTarget: true, icon: '🫳',
      desc: '不耗点数。本回合防御固定 0.5。指定若干对象：其中有人「集」，就偷走他全部点数（含刚集的）；' +
            '有人出防/反盾/自守/合掌，你立刻暴毙；其他人无事发生。' },

    /* ---------- 血量拓展 ---------- */
    { id: 'hezhang', name: '合掌', cost: 2, costFn: p => (p.hp > 1 ? 3 : 2), kind: 'heal', heal: 1, def: 1,
      icon: '🙏', pack: 'hp', desc: '血量 +1，本回合防御 1。血量大于 1 时消耗 3 点，否则 2 点。' },
    { id: 'podun', name: '破盾', cost: 1, kind: 'attack', atk: 0.5, shieldBreak: true, icon: '🪓', pack: 'hp',
      desc: '伤害 0.5；若含破盾的攻击打得对方扣血，则清空对方血量。' },

    /* ---------- 自守拓展 ---------- */
    { id: 'zishou', name: '自守', cost: 1, kind: 'selfguard', def: 1, icon: '🧘', pack: 'self',
      desc: '消耗 1 点，本回合防御 1；之后五回合内若死亡，改为和所有直接致死者发起决斗。' },
    { id: 'du', name: '毒', cost: 2, kind: 'attack', atk: 1.5, poison: true, icon: '☠️', pack: 'self',
      desc: '伤害 1.5，消耗 2 点。若含毒的伤害打在自守状态或正在自守的玩家上，该玩家立刻暴毙（无视自守）。' }
  ];

  const ITEMS = {};
  ITEM_LIST.forEach(it => { ITEMS[it.id] = it; });

  const GIFT_IDS = ['jingxue', 'jianqi', 'tianlei', 'feimei'];
  // 会让「偷」当场暴毙的东西：防、反盾、自守、合掌
  const STEAL_GATE_KINDS = ['defense', 'reverse', 'selfguard', 'heal'];
  const PACK_KEYS = ['hp', 'rainbow', 'self'];
  const PACK_NAMES = { hp: '血量拓展', rainbow: '彩虹斩叠加', self: '自守拓展' };

  /* 可「叠」的道具＝同回合能对同一个人用多个。只有原规则**明确写过**的才算：
       · 精血：「本道具每个上吊赠送一个，伤害 0.5，可叠加」
       · 彩虹斩：「可以 n 倍叠加使用」（要房主开叠加包）
       · 偷：「不论使用数量本回合防御均为 0.5」
     其余一律不可叠（每回合对一个人只能用一次），包括剑气 / 天雷 / 肥美 / 叠肥 ——
     叠肥是一个**独立的道具**（吃掉 3 个肥美造成 2-ε），不是"把肥美叠起来"。 */
  const STACKABLE = ['jingxue', 'tou'];
  function isStackable(state, id) {
    if (id === 'caihong') return !!state.settings.packs.rainbow;
    return STACKABLE.indexOf(id) >= 0;
  }
  const isAimable = it => it && (it.kind === 'attack' || it.kind === 'smite');
  const isSelfKind = it => it && (it.kind === 'defense' || it.kind === 'reverse' ||
    it.kind === 'gain' || it.kind === 'heal' || it.kind === 'selfguard');

  /* ------------------------------------------------------------ 小工具 */
  const num = v => (typeof v === 'number' && isFinite(v) ? v : 0);
  const countOf = (items, id) => Math.max(0, Math.floor(num(items[id])));
  const round2 = v => Math.round(v * 100) / 100;
  const clone = o => JSON.parse(JSON.stringify(o));

  function emptyPicks() { return { items: {}, alloc: {}, steal: [] }; }

  function makePlayer(id, name, opts) {
    opts = opts || {};
    return {
      id: id, name: name || id,
      isHost: !!opts.isHost, isBot: !!opts.isBot, connected: opts.connected !== false,
      alive: true, hp: 0, points: 0,
      bag: { jingxue: 0, jianqi: 0, tianlei: 0, feimei: 0 },
      picks: emptyPicks(), submitted: false, ready: false,
      selfGuardUntil: -1,     // 自守保护到第几回合（含）
      selfGuardTriggered: false,
      inDuel: false, duel: null
    };
  }

  const DEFAULT_SETTINGS = { selectSec: 5, revealSec: 5, autoAdvance: true, ecoOpen: false, packs: {} };
  /** 设置项补默认值；导入别人的对局文件时也走这里，缺字段不会崩 */
  function normalizeSettings(raw) {
    const s = Object.assign({}, DEFAULT_SETTINGS, raw || {});
    s.packs = Object.assign({}, (raw && raw.packs) || {});
    PACK_KEYS.forEach(k => { s.packs[k] = !!s.packs[k]; });
    s.ecoOpen = !!s.ecoOpen;                        // 点数是否像实体筹码一样明牌
    s.autoAdvance = s.autoAdvance !== false;
    s.selectSec = Math.min(600, Math.max(3, Number(s.selectSec) || 5));
    s.revealSec = Math.min(120, Math.max(2, Number(s.revealSec) || 5));
    return s;
  }

  function newState(settings) {
    const s = {
      players: [], round: 1, phase: 'lobby', winner: null,
      settings: normalizeSettings(settings),
      log: [], lastResult: null,
      history: []                                   // 逐回合全量快照：最终战报与复盘都读它
    };
    return s;
  }

  /** 全场快照：复盘时要看到每个人当时手里多少点、几点血、背包里有什么 */
  function snapPlayers(state) {
    return state.players.map(p => ({
      id: p.id, name: p.name, isHost: !!p.isHost, isBot: !!p.isBot,
      alive: p.alive, hp: p.hp, points: p.points,
      bag: Object.assign({}, p.bag),
      selfGuardUntil: p.selfGuardUntil, inDuel: !!p.inDuel
    }));
  }

  function addPlayer(state, id, name, opts) {
    if (state.players.some(p => p.id === id)) return state.players.find(p => p.id === id);
    const p = makePlayer(id, name, opts);
    state.players.push(p);
    return p;
  }

  const getPlayer = (state, id) => state.players.find(p => p.id === id) || null;
  const alivePlayers = state => state.players.filter(p => p.alive);
  const otherAlive = (state, id) => state.players.filter(p => p.alive && p.id !== id);

  function packOn(state, id) {
    const it = ITEMS[id];
    if (!it || !it.pack) return true;
    return !!state.settings.packs[it.pack];
  }

  /* ------------------------------------------------------ 费用与合法性校验 */
  /** 单件道具本回合的实际单价（合掌是动态价） */
  function unitCost(state, p, id) {
    const it = ITEMS[id];
    if (!it) return 0;
    return it.costFn ? it.costFn(p) : it.cost;
  }

  /** 本回合买这些东西要花多少点数 */
  function totalCost(state, p, items) {
    let sum = 0;
    ITEMS && Object.keys(items).forEach(id => {
      const c = countOf(items, id);
      if (c > 0) sum += unitCost(state, p, id) * c;
    });
    return sum;
  }

  /** 本回合可用点数 = 手上的 + 本回合「集」的（集先入账） */
  function usablePoints(state, p, items) {
    return p.points + countOf(items, 'ji');
  }

  /**
   * 校验一份出招。
   * 这一版的核心两条：
   *   1) 一回合只能挑一种道具；
   *   2) 不可叠的道具对同一个人一回合只能用一次（买 N 把同种刀 → 砍 N 个人）；
   *      可叠的道具（精血/剑气/天雷/肥美/开了包的彩虹斩/偷）分给多个人时必须整除。
   * @returns {{ok:boolean, errors:string[], cost:number, usable:number}}
   */
  function validate(state, playerId, action) {
    const p = getPlayer(state, playerId);
    const errors = [];
    const items = (action && action.items) || {};
    const alloc = (action && action.alloc) || {};
    const steal = Array.from(new Set((action && action.steal) || []));
    if (!p) return { ok: false, errors: ['玩家不存在'], cost: 0, usable: 0 };
    if (!p.alive) return { ok: false, errors: ['你已经出局了'], cost: 0, usable: 0 };

    const others = otherAlive(state, p.id).map(o => o.id);
    const alives = alivePlayers(state).map(o => o.id);
    const chosen = Object.keys(items).filter(id => countOf(items, id) > 0);

    if (chosen.length > 1) {
      errors.push('一回合只能挑一种道具，你同时选了 ' +
        chosen.map(id => `「${ITEMS[id] ? ITEMS[id].name : id}」`).join('、'));
    }
    // 没有"空手"这个选项：什么都不想做也要出张「集」（+1 点，也免得被别人偷空）
    if (!chosen.length) {
      errors.push('不能空手出招：最少出一张「集」攒 1 点（什么都不出就等超时，系统也会替你出「集」）');
    }

    chosen.forEach(id => {
      const it = ITEMS[id];
      const c = countOf(items, id);
      if (!it) { errors.push('未知道具 ' + id); return; }
      if (!packOn(state, id)) { errors.push(`「${it.name}」属于${PACK_NAMES[it.pack]}，本局未开启`); return; }
      if (it.giftOnly && c > num(p.bag[id])) errors.push(`「${it.name}」只剩 ${num(p.bag[id])} 个`);
      if (it.consume) {
        Object.keys(it.consume).forEach(need => {
          if (c * it.consume[need] > num(p.bag[need])) {
            errors.push(`「${it.name}」需要 ${c * it.consume[need]} 个${ITEMS[need].name}，你只有 ${num(p.bag[need])} 个`);
          }
        });
      }
      if (id === 'zishou') {
        if (p.inDuel) errors.push('决斗期间不能开自守');
        else if (isDuelTarget(state, p.id)) errors.push('你正在被决斗，决斗期间不能开自守');
      }
      if (id === 'tou' && steal.filter(k => alives.indexOf(k) >= 0 && k !== p.id).length === 0) {
        errors.push('「偷」至少要指定一个对象');
      }

      const stack = isStackable(state, id);
      if (isAimable(it)) {
        const map = alloc[id] || {};
        const keys = Object.keys(map).filter(k => Math.floor(num(map[k])) > 0);
        const total = keys.reduce((s, k) => s + Math.floor(num(map[k])), 0);
        const bad = {};
        keys.forEach(k => { if (others.indexOf(k) < 0) bad[k] = true; });
        Object.keys(bad).forEach(k => errors.push(`「${it.name}」指定的目标无效`));
        if (!keys.length) errors.push(`「${it.name}」还没选目标（点头像选人）`);
        if (total !== c) errors.push(`「${it.name}」有 ${c} 个，但只分配了 ${total} 个目标`);
        if (!stack) {
          keys.forEach(k => {
            if (Math.floor(num(map[k])) > 1) {
              errors.push(`「${it.name}」不能叠：同一个人一回合只能吃 1 个`);
            }
          });
        } else if (keys.length > 1 && c % keys.length !== 0) {
          errors.push(`「${it.name}」有 ${c} 个，没法完全均分给 ${keys.length} 个人（每人 ${round2(c / keys.length)} 个），请改数量或改人数`);
        }
      } else if (isSelfKind(it) && c > 1) {
        errors.push(`「${it.name}」一回合只能用 1 个`);
      }
    });

    Object.keys(alloc).forEach(id => {
      if (!countOf(items, id) && ITEMS[id]) errors.push(`没有选「${ITEMS[id].name}」，却分配了目标`);
    });

    const cost = totalCost(state, p, items);
    const usable = usablePoints(state, p, items);
    if (cost > usable + EPS) errors.push(`点数不够：需要 ${round2(cost)} 点，本回合可用 ${round2(usable)} 点`);

    return { ok: errors.length === 0, errors: errors, cost: cost, usable: usable };
  }

  /** 把提交上来的出招规整成内部格式（只保留一种道具，丢弃非法目标） */
  function normalize(state, playerId, action) {
    const p = getPlayer(state, playerId);
    const out = emptyPicks();
    if (!p || !action) return out;
    const items = action.items || {};
    const alloc = action.alloc || {};
    const others = otherAlive(state, p.id).map(o => o.id);

    // 一回合只认一种道具：只保留第一个合法项
    const chosen = Object.keys(items).filter(id => countOf(items, id) > 0 && ITEMS[id] && packOn(state, id));
    if (!chosen.length) return out;
    const id = chosen[0];
    out.items[id] = countOf(items, id);

    const map = alloc[id] || {};
    const outAlloc = {};
    Object.keys(map).forEach(tid => {
      const n = Math.floor(num(map[tid]));
      if (n > 0 && others.indexOf(tid) >= 0) outAlloc[tid] = n;
    });
    if (Object.keys(outAlloc).length) out.alloc[id] = outAlloc;
    if (id === 'tou') {
      out.steal = Array.from(new Set((action.steal || []).filter(k => others.indexOf(k) >= 0)));
    }
    return out;
  }

  function isDuelTarget(state, id) {
    return state.players.some(o => o.alive && o.inDuel && o.duel &&
      o.duel.targets.indexOf(id) >= 0 && o.duel.cleared.indexOf(id) < 0);
  }

  /* =========================================================== 回合结算 */
  /**
   * 结算一个回合：把每个玩家 picks 变成实际结果，直接改 state。
   * @returns {object} 本回合战报（给展示阶段用）
   */
  function settle(state) {
    const round = state.round;
    const log = [];
    const say = t => log.push(`R${round} ${t}`);
    // 结算前的全场快照：复盘时要能回答"他这一回合开始时手上有几点、几点血"
    const before = snapPlayers(state);

    // 0) 快照出招（结算期间不再变化）
    state.players.forEach(p => {
      // 时间到了还没锁定 → 默认出「集」（你可以在规则里看到这条）
      const autoJi = p.alive && !p.submitted;
      if (autoJi) p.picks = { items: { ji: 1 }, alloc: {}, steal: [] };
      p.roundData = {
        id: p.id, name: p.name, alive: true, items: {}, alloc: {}, steal: [],
        cost: 0, def: 0, gross: 0, damage: 0, hpBefore: p.hp, hpAfter: p.hp,
        events: [], giftGained: {}, stolenFrom: [], stolenBy: [],
        hits: [], reverseBack: null,        // hits: [{to, item, dmg}] —— 画"谁打了谁"的连线用
        dead: false, deathCause: '', autoJi: autoJi
      };
      if (!p.alive) { p.roundData.alive = false; return; }
      p.roundData.items = clone(p.picks.items || {});
      p.roundData.alloc = clone(p.picks.alloc || {});
      p.roundData.steal = (p.picks.steal || []).slice();
      if (autoJi) p.roundData.events.push('超时没锁定 → 自动出「集」');
    });
    const rd = id => getPlayer(state, id).roundData;
    const alive = () => state.players.filter(p => p.alive);

    /* 1) 「集」先入账，再扣费（可透支刚集的点） */
    alive().forEach(p => {
      const n = countOf(p.roundData.items, 'ji');
      if (n > 0) { p.points += n; rd(p.id).events.push('出「集」'); }
    });
    alive().forEach(p => {
      const cost = totalCost(state, p, p.roundData.items);
      p.roundData.cost = cost;
      p.points -= cost;
      if (p.points < 0) p.points = 0;   // 正常不会发生（提交时已校验）
      // 消耗赠品 / 背包材料
      Object.keys(p.roundData.items).forEach(id => {
        const c = countOf(p.roundData.items, id);
        const it = ITEMS[id];
        if (!it) return;
        if (it.giftOnly) p.bag[id] = Math.max(0, num(p.bag[id]) - c);
        if (it.consume) Object.keys(it.consume).forEach(k => { p.bag[k] = Math.max(0, num(p.bag[k]) - c * it.consume[k]); });
      });
      // 「偷」把防御锁成 0.5
      if (countOf(p.roundData.items, 'tou') > 0) { p.roundData.defOverride = ITEMS.tou.specialDef; }
    });

    /* 2) 偷：逐个目标独立结算 ——
       出「集」的人点数照偷（不管别人出什么）；只要有人出防/反盾/自守/合掌，小偷必死。
       所以顺序是"先按人头结算偷取，再统一判小偷的死"。 */
    alive().forEach(thief => {
      if (!countOf(thief.roundData.items, 'tou')) return;
      const targets = Array.from(new Set(thief.roundData.steal))
        .map(id => getPlayer(state, id))
        .filter(t => t && t.alive && t.roundData);
      if (!targets.length) { rd(thief.id).events.push('偷：没有指定对象'); return; }
      let doomed = null;
      targets.forEach(t => {
        const gated = Object.keys(t.roundData.items).some(id =>
          STEAL_GATE_KINDS.indexOf(ITEMS[id] && ITEMS[id].kind) >= 0);
        if (gated) { if (!doomed) doomed = t; return; }          // 先记下来，偷取照常走完
        if (countOf(t.roundData.items, 'ji') > 0) {
          const amt = t.points;
          t.points = 0; thief.points += amt;
          rd(thief.id).stolenFrom.push({ id: t.id, name: t.name, amount: amt });
          rd(t.id).stolenBy.push({ id: thief.id, name: thief.name, amount: amt });
          rd(thief.id).events.push(`偷走 ${t.name} 的全部点数`);
          rd(t.id).events.push(`被 ${thief.name} 偷走了点数`);
        } else {
          rd(thief.id).events.push(`偷 ${t.name}：他在做别的事，无事发生`);
        }
      });
      if (doomed) {
        rd(thief.id).events.push(`${doomed.name} 出了防 / 反盾 / 自守 / 合掌 → 你当场暴毙`);
        killPlayer(state, thief, `偷 ${doomed.name} 被识破`, [], { noSelfGuard: true });
      }
    });

    /* 3) 各人防御：防御道具的防御 + **攻击道具自带的防御**（攻击 x 点就自带 x 点防御，互砍不再双死） */
    alive().forEach(p => {
      let dItem = 0, dAtk = 0;
      Object.keys(p.roundData.items).forEach(id => {
        const it = ITEMS[id], c = countOf(p.roundData.items, id);
        if (!it) return;
        if ((it.kind === 'defense' || it.kind === 'heal' || it.kind === 'selfguard') && it.def) dItem += it.def * c;
        if (it.kind === 'attack' && it.atk) dAtk += it.atk * c;
      });
      p.roundData.defItem = dItem;
      p.roundData.defAttack = dAtk;
      let d = dItem + dAtk;
      if (p.roundData.defOverride != null) d = p.roundData.defOverride;   // 偷 → 0.5
      p.roundData.def = d;
      if (countOf(p.roundData.items, 'zishou') > 0) {
        p.selfGuardUntil = Math.max(p.selfGuardUntil, round + 5);
        rd(p.id).events.push(`开自守（防御 1，保护至第 ${round + 5} 回合）`);
      }
    });

    /* 4) 统计每个目标挨的总攻击 */
    const flags = {};   // targetId -> {rainbow, poison, podun, attackers:{id:dmg}}
    const flagOf = id => (flags[id] = flags[id] || { rainbow: false, poison: false, podun: false, attackers: {} });

    alive().forEach(src => {
      Object.keys(src.roundData.items).forEach(id => {
        const it = ITEMS[id], c = countOf(src.roundData.items, id);
        if (!it || it.kind !== 'attack' || c <= 0) return;
        const alloc = src.roundData.alloc[id] || {};
        Object.keys(alloc).forEach(tid => {
          const t = getPlayer(state, tid);
          const n = Math.floor(num(alloc[tid]));
          if (!t || n <= 0) return;
          let per = it.atk;
          if (it.weakVs && it.weakVs.some(w => countOf(t.roundData.items, w) > 0)) per = it.weakAtk;
          const dmg = per * n;
          t.roundData.gross += dmg;
          src.roundData.hits.push({ to: tid, item: id, dmg: dmg });
          const f = flagOf(tid);
          f.attackers[src.id] = (f.attackers[src.id] || 0) + dmg;
          if (it.pierceReverse) (f.fandaoBy = f.fandaoBy || []).push(src.id);
          if (it.lethal) f.rainbow = true;
          if (it.poison) f.poison = true;
          if (it.shieldBreak) f.podun = true;
        });
      });
    });

    /* 5) 反盾：够软就弹死所有攻击者，超限就自己被崩死 */
    alive().forEach(p => {
      const ranges = Object.keys(p.roundData.items)
        .filter(id => ITEMS[id].kind === 'reverse' && countOf(p.roundData.items, id) > 0)
        .map(id => ITEMS[id].range);
      if (!ranges.length) return;
      const range = Math.max.apply(null, ranges);   // 反盾不叠加，取最大值
      const g = p.roundData.gross;
      const f = flags[p.id] || { attackers: {} };

      // 反刀专克反盾：只要有人用反刀打他 → 他的反盾**整回合完全失效**（谁的刀都弹不回来），
      // 同时他自己无视血量被斩杀；反刀本身当然也不会被弹。
      const fd = (f.fandaoBy || []).filter(aid => getPlayer(state, aid) && getPlayer(state, aid).alive);
      if (fd.length) {
        p.roundData.reverse = { range: range, success: null, nullified: true };
        p.roundData.reverseBack = [];            // 完全破盾：没有任何弹回
        p.roundData.fandaoKill = true;
        p.roundData.damage = 0;
        rd(p.id).events.push('被「反刀」针对 → 反盾完全失效，无视血量当场暴毙');
        killPlayer(state, p, '被反刀完全破盾（无视反盾与血量）', fd, {});
        return;
      }

      if (g > EPS && g <= range + EPS) {
        p.roundData.reverse = { range: range, success: true };
        const attackers = Object.keys(f.attackers);
        p.roundData.reverseBack = attackers.slice();
        rd(p.id).events.push(`反盾成功（${round2(g)} ≤ ${range}）→ 弹死 ${attackers.length} 个攻击者`);
        attackers.forEach(aid => {
          const a = getPlayer(state, aid);
          if (a && a.alive) killPlayer(state, a, `被 ${p.name} 的反盾弹死`, [p.id], { lethalOnly: true });
        });
        p.roundData.damage = 0;
      } else if (g > range + EPS) {
        p.roundData.reverse = { range: range, success: false };
        rd(p.id).events.push(`反盾被破（${round2(g)} > ${range}）→ 反盾者暴毙`);
        killPlayer(state, p, '反盾被破', Object.keys(f.attackers), { lethalOnly: true, noSelfGuard: false });
      }
    });

    /* 6) 伤害结算 */
    alive().forEach(p => {
      const data = p.roundData;
      if (data.reverse && data.reverse.success) return;    // 弹开，免伤
      const g = data.gross;
      const dmg = g - data.def;                             // 白洞 → -Infinity
      if (!(dmg > EPS)) { data.damage = 0; if (g > EPS) data.events.push(`防御 ${fmtNum(data.def)} 挡下 ${round2(g)} 点攻击`); return; }
      data.damage = dmg;
      const f = flags[p.id] || { attackers: {} };
      const killers = Object.keys(f.attackers);
      if (data.hpBefore - dmg < -EPS) {
        data.hpAfter = 0;
        data.events.push(`受到 ${round2(dmg)} 点伤害 → 血量 ${fmtNum(data.hpBefore)} 撑不住`);
        killPlayer(state, p, `被打死（合计 ${round2(g)} 点 − 防御 ${fmtNum(data.def)} = 掉 ${round2(dmg)} 点）`, killers, {});
      } else {
        data.hpAfter = data.hpBefore - dmg;
        data.events.push(`受到 ${round2(dmg)} 点伤害 → 血量 ${fmtNum(data.hpBefore)} → ${fmtNum(data.hpAfter)}`);
        if (f.podun) { data.hpAfter = 0; data.events.push('破盾生效 → 血量清零'); }
      }
      if (f.rainbow) {
        data.events.push('彩虹斩命中 → 立即死亡（无视血量与自守）');
        killPlayer(state, p, '被彩虹斩斩中', killers, { pierceSelfGuard: true });
      }
      if (f.poison && (countOf(data.items, 'zishou') > 0 || p.inDuel || p.selfGuardUntil >= round)) {
        data.events.push('毒命中自守状态 → 立刻暴毙');
        killPlayer(state, p, '毒破自守', killers, { pierceSelfGuard: true });
      }
    });

    /* 7) 磁暴：目标出磁盾就暴毙。
       注意：要按"本回合出过磁暴的人"来遍历 —— 而不是"现在还活着的人"，
       否则先被别人砍死的人，他的磁暴就白白失效了（同一回合应当同时结算）。 */
    state.players.forEach(src => {
      const c = countOf(src.roundData.items, 'cibao');
      if (!c || !src.roundData.alive) return;
      const alloc = src.roundData.alloc.cibao || {};
      Object.keys(alloc).forEach(tid => {
        const t = getPlayer(state, tid);
        if (!t || !t.roundData) return;
        if (num(alloc[tid]) > 0 && countOf(t.roundData.items, 'cidun') > 0) {
          if (!t.alive) return;                       // 已经死了就不重复判
          t.roundData.events.push(`${src.name} 的磁暴命中磁盾 → 立刻暴毙`);
          src.roundData.hits.push({ to: tid, item: 'cibao', dmg: 0 });
          killPlayer(state, t, '被磁暴破盾', [src.id], {});
        }
      });
    });

    /* 8) 写回血量、复活/决斗清算、赠品发放 */
    alive().forEach(p => {
      const d = p.roundData;
      if (d.damage > 0 && !d.dead) p.hp = Math.max(0, d.hpAfter);
      if (countOf(d.items, 'hezhang') > 0) {
        p.hp += ITEMS.hezhang.heal * countOf(d.items, 'hezhang');
        d.events.push(`合掌 → 血量 +${ITEMS.hezhang.heal * countOf(d.items, 'hezhang')}`);
      }
      // 赠品
      Object.keys(d.items).forEach(id => {
        const it = ITEMS[id], c = countOf(d.items, id);
        if (!it || !it.gift) return;
        Object.keys(it.gift).forEach(g => {
          p.bag[g] = num(p.bag[g]) + it.gift[g] * c;
          d.giftGained[g] = (d.giftGained[g] || 0) + it.gift[g] * c;
        });
      });
      if (Object.keys(d.giftGained).length) {
        d.events.push('获得赠品：' + Object.keys(d.giftGained).map(g => `${ITEMS[g].name}×${d.giftGained[g]}`).join('、'));
      }
    });

    /* 8.5) 决斗计时（复活 / 超时真死） */
    tickDuels(state);

    /* 9) 回合末统一清空（下回合清零） */
    state.players.forEach(p => {
      p.picks = emptyPicks();
      p.submitted = false;
    });

    const result = {
      round: round,
      order: state.players.map(p => p.id),
      reports: state.players.map(p => clone(p.roundData)),
      winnersHint: alivePlayers(state).map(p => p.id)
    };
    state.players.forEach(p => { delete p.roundData; });

    /* 10) 胜负 */
    const left = alivePlayers(state);
    if (left.length <= 1) {
      state.phase = 'over';
      state.winner = left.length === 1 ? left[0].id : null;
    }

    state.lastResult = result;
    // 逐回合全量存一份：最终战报页与"导入复盘"都靠它，才说得清每一拍的来龙去脉。
    // 只留最近 200 回合，避免一局打太久把内存撑爆。
    state.history.push({ round: round, before: before, after: snapPlayers(state), reports: clone(result.reports) });
    if (state.history.length > MAX_HISTORY) state.history = state.history.slice(-MAX_HISTORY);
    // 回合数由结算内部推进，避免"调用方忘记加一"导致决斗计时永不走动
    state.round = round + 1;
    // 日志：一回合一条（结构化，发快照时再按"给谁看"渲染，点数才不会漏）
    state.log.push(buildRoundEntry(state, result));
    if (state.log.length > 200) state.log = state.log.slice(-200);
    return result;
  }

  /**
   * 一回合的日志：结构化存起来，等发快照时再按"给谁看"决定要不要露点数数额。
   * 这样"点数不显示"才能做到彻底——连日志里的数额都不给。
   */
  function buildRoundEntry(state, result) {
    const r = result.round;
    const atk = [], mid = [], last = [];      // 分三段排：先"谁打谁"，再防御/花费，最后阵亡与结算
    result.reports.forEach(rep => {
      (rep.hits || []).forEach(h => {
        atk.push({
          t: 'hit', id: rep.id, from: rep.name, to: nameOf(state, h.to),
          item: ITEMS[h.item] ? ITEMS[h.item].name : h.item, dmg: h.dmg
        });
      });
      if (rep.reverse) {
        atk.push({
          t: 'reverse', id: rep.id, who: rep.name, ok: !!rep.reverse.success,
          nullified: !!rep.reverse.nullified,
          gross: rep.gross, range: rep.reverse.range,
          killed: (rep.reverseBack || []).map(x => nameOf(state, x))
        });
      }
      (rep.stolenFrom || []).forEach(s => atk.push({ t: 'steal', id: rep.id, from: rep.name, to: s.name, amt: s.amount }));
      if (rep.def > 0 && rep.gross > EPS && !(rep.damage > EPS)) {
        mid.push({ t: 'block', id: rep.id, who: rep.name, def: rep.def, gross: rep.gross, defAttack: rep.defAttack || 0 });
      }
      if (rep.cost > 0) mid.push({ t: 'cost', id: rep.id, who: rep.name, cost: rep.cost });
      if (rep.giftGained && Object.keys(rep.giftGained).length) {
        mid.push({
          t: 'gift', id: rep.id, who: rep.name,
          gifts: Object.keys(rep.giftGained).map(g => ITEMS[g].name + '×' + rep.giftGained[g]).join('、')
        });
      }
      if (rep.autoJi) mid.push({ t: 'auto', id: rep.id, who: rep.name });
      if (rep.dead) last.push({ t: 'death', id: rep.id, who: rep.name, cause: rep.deathCause });
      rep.events.filter(e => /决斗/.test(e)).forEach(e => last.push({ t: 'duel', id: rep.id, who: rep.name, text: e }));
    });
    const left = alivePlayers(state);
    last.push({ t: 'sum', alive: left.map(p => p.name) });
    if (left.length === 1) last.push({ t: 'win', who: left[0].name });
    else if (!left.length) last.push({ t: 'draw' });
    return { k: 'round', r: r, lines: atk.concat(mid, last) };
  }

  /** 把结构化日志渲染成文字；opts.showAll=false 时，别人的点数数额一笔都不露 */
  function formatLogEntry(e, opts) {
    opts = opts || {};
    const show = id => !!opts.showAll || (!!opts.viewerId && id === opts.viewerId);
    if (e.k === 'text') return e.s;
    const out = [];
    e.lines.forEach(l => {
      switch (l.t) {
        case 'hit':
          out.push(`⚔ ${l.from} 用「${l.item}」打 ${l.to}（${round2(l.dmg)} 点）`);
          break;
        case 'reverse':
          out.push(l.ok
            ? `🪃 ${l.who} 反盾成功（${round2(l.gross)} ≤ ${l.range}）→ 弹死 ${l.killed.join('、') || '（无人）'}`
            : (l.nullified
              ? `🤺 ${l.who} 的反盾被「反刀」完全破掉 → 无视血量当场暴毙（反盾整回合失效，谁的刀都弹不回来）`
              : `🪃 ${l.who} 反盾被破（${round2(l.gross)} > ${l.range}）→ 反盾者暴毙`));
          break;
        case 'block':
          out.push(`🛡 ${l.who} 防御 ${fmtNum(l.def)}${l.defAttack ? `（含攻击自带 ${fmtNum(l.defAttack)}）` : ''} 挡下 ${round2(l.gross)} 点`);
          break;
        case 'death': out.push(`☠ ${l.who} 阵亡 —— ${l.cause}`); break;
        case 'cost': if (show(l.id)) out.push(`💸 ${l.who} 消耗 ${round2(l.cost)} 点`); break;
        case 'steal':
          out.push(`🫳 ${l.from} 偷走 ${l.to} 的全部点数${show(l.id) && l.amt != null ? `（${round2(l.amt)} 点）` : ''}`);
          break;
        case 'gift': out.push(`🎁 ${l.who} 获得 ${l.gifts}`); break;
        case 'auto': out.push(`⏱ ${l.who} 超时没锁定 → 自动出「集」`); break;
        case 'duel': out.push(`🥊 ${l.who}：${l.text}`); break;
        case 'sum': out.push(`—— 存活 ${l.alive.length} 人${l.alive.length ? '：' + l.alive.join('、') : ''}`); break;
        case 'win': out.push(`🏆 ${l.who} 拔得头筹！`); break;
        case 'draw': out.push('🤝 全员阵亡，平局'); break;
        default: break;
      }
    });
    return `【第 ${e.r} 回合】\n` + (out.length ? out.join('\n') : '（这一回合大家都在观望）');
  }

  function fmtNum(v) { return v === Infinity ? '∞' : String(round2(v)); }

  /* --------------------------------------------------- 死亡 / 自守 / 决斗 */
  /**
   * 处理一次死亡。带自守保护的人不会真死，而是进入决斗。
   * opts.pierceSelfGuard: 彩虹斩 / 毒 这类无视自守的死因
   * opts.noSelfGuard: 偷被识破（自守救不了，规则未提及，按真死处理）
   */
  function killPlayer(state, p, cause, killerIds, opts) {
    opts = opts || {};
    if (!p || !p.alive) return;
    const data = p.roundData;
    const round = state.round;
    if (data) { data.dead = true; data.deathCause = cause; }
    const killers = Array.from(new Set((killerIds || []).filter(k => k && k !== p.id && getPlayer(state, k) && getPlayer(state, k).alive)));
    const guarded = !opts.pierceSelfGuard && !opts.noSelfGuard && !p.inDuel && p.selfGuardUntil >= round;

    if (guarded && killers.length > 0) {
      // 自守生效 → 改用决斗续命（注意：他没真死，别在战报/日志里写成阵亡）
      const n = killers.length;
      p.inDuel = true;
      p.hp = 0;
      p.selfGuardTriggered = true;
      if (data) { data.dead = false; data.deathCause = ''; }
      p.duel = { targets: killers.slice(), cleared: [], total: 4 * n + 1, left: 4 * n + 1, startRound: round };
      if (data) data.events.push(`自守触发 → 与 ${killers.map(k => getPlayer(state, k).name).join('、')} 进入决斗（${4 * n + 1} 回合内杀光他们）`);
      return;
    }
    // 真死
    p.alive = false;
    p.inDuel = false;
    p.duel = null;
    p.hp = 0;
    p.points = 0;
    p.bag = { jingxue: 0, jianqi: 0, tianlei: 0, feimei: 0 };
    p.picks = emptyPicks();
    p.submitted = false;
    if (data) data.events.push(`☠️ 阵亡：${cause}`);
  }

  /** 回合末推进决斗计时：杀光目标 = 复活，超时 = 真死 */
  function tickDuels(state) {
    state.players.filter(p => p.alive && p.inDuel && p.duel).forEach(p => {
      // 「杀光一遍」：目标真死，或目标自己触发了自守（也算一遍）
      const cleared = p.duel.targets.filter(tid => {
        const t = getPlayer(state, tid);
        return !t || !t.alive || t.selfGuardTriggered;
      });
      p.duel.cleared = cleared;
      if (cleared.length >= p.duel.targets.length) {
        p.inDuel = false;
        p.duel = null;
        p.hp = 0;
        if (p.roundData && p.roundData.events) p.roundData.events.push('决斗成功 → 复活（血量 0）');
        return;
      }
      if (state.round <= p.duel.startRound) return;   // 发起决斗的当回合不扣名额
      p.duel.left -= 1;
      if (p.duel.left <= 0) {
        killPlayer(state, p, '决斗超时未杀光对手', [], { noSelfGuard: true });
      }
    });
  }

  /* ------------------------------------------------------------ 展示辅助 */
  /** 把某人的出招翻译成人话，用于展示阶段 */
  function describePicks(state, picks) {
    const parts = [];
    const items = (picks && picks.items) || {};
    const alloc = (picks && picks.alloc) || {};
    Object.keys(items).forEach(id => {
      const it = ITEMS[id], c = countOf(items, id);
      if (!it || c <= 0) return;
      if (it.kind === 'attack' || it.kind === 'smite') {
        const map = alloc[id] || {};
        const list = Object.keys(map).filter(k => num(map[k]) > 0)
          .map(k => `${nameOf(state, k)}×${Math.floor(num(map[k]))}`);
        parts.push(`${it.name}×${c}${list.length ? ' → ' + list.join(' ') : ''}`);
      } else if (it.kind === 'steal') {
        parts.push(`${it.name} → ${(picks.steal || []).map(k => nameOf(state, k)).join(' ')}`);
      } else {
        parts.push(`${it.name}×${c}`);
      }
    });
    return parts.length ? parts.join('，') : '（空手）';
  }

  function nameOf(state, id) {
    const p = getPlayer(state, id);
    return p ? p.name : '???';
  }

  /* ------------------------------------------------------------- 电脑玩家 */
  const BOT_ATTACKS = ['yidao', 'shuangdao', 'shangdiao', 'sidao', 'wudao'];

  function pickWeighted(cands, rng) {
    const total = cands.reduce((s, c) => s + c.w, 0);
    let r = rng() * total;
    for (let i = 0; i < cands.length; i++) {
      r -= cands[i].w;
      if (r <= 0) return cands[i].o;
    }
    return cands[cands.length - 1].o;
  }

  /**
   * 电脑出招：一回合只挑一种道具。
   * 决策顺序大致是：白送的赠品伤害 > 攒点/出刀 > 免费防具 > 有闲钱才上盾。
   */
  function botAction(state, id, rng) {
    const p = getPlayer(state, id);
    rng = rng || Math.random;
    const picks = emptyPicks();
    if (!p || !p.alive) return picks;
    const foes = otherAlive(state, id);
    if (!foes.length) return picks;

    // 血少、点数多的优先挨刀
    const threats = foes.slice().sort((a, b) => (a.hp * 10 + a.points) - (b.hp * 10 + b.points));
    const aim = n => threats.slice(0, Math.max(1, Math.min(n, threats.length))).map(f => f.id);
    const cands = [];
    const add = (w, iid, count, targets) => cands.push({ w: w, o: { id: iid, count: count, targets: targets || [] } });

    // 1) 赠品：不花点数就能打人，优先用掉（都不可叠 → 一人一个，数量＝选中人数）
    if (num(p.bag.tianlei) > 0) add(26, 'tianlei', 1, aim(1));
    if (num(p.bag.jianqi) > 0) add(22, 'jianqi', 1, aim(1));
    if (num(p.bag.jingxue) > 0) add(16, 'jingxue', Math.min(num(p.bag.jingxue), 2), aim(Math.min(2, num(p.bag.jingxue))));
    if (num(p.bag.feimei) >= 3) add(20, 'diefei', 1, aim(1));
    else if (num(p.bag.feimei) > 0) add(14, 'feimei', 1, aim(1));

    // 2) 集：手头紧就攒钱
    add(p.points <= 1 ? 45 : 12, 'ji', 1, []);

    // 3) 出刀：先定打几个人，再看买得起什么
    const groupSize = 1 + (foes.length > 1 && rng() < 0.35 ? 1 : 0);
    const targets = aim(groupSize);
    BOT_ATTACKS.forEach(a => {
      if (ITEMS[a].cost * targets.length <= p.points) add(12 + ITEMS[a].cost * 3, a, targets.length, targets);
    });
    if (state.settings.packs.rainbow && p.points >= 8) add(10, 'caihong', 1, aim(1));
    if (p.points >= 1 && rng() < 0.25) add(8, 'cibao', 1, aim(1));      // 赌一把人家上磁盾
    if (state.settings.packs.self && p.points >= 2) add(8, 'du', 1, aim(1));
    if (state.settings.packs.hp && p.points >= 1) add(8, 'podun', 1, aim(1));

    // 4) 免费防具 / 花钱的盾
    add(18, rng() < 0.5 ? 'busi' : 'xiaofang', 1, []);
    if (p.points >= 1) add(10, 'dafang', 1, []);
    if (p.points >= 6 && rng() < 0.18) add(8, 'baidong', 1, []);
    else if (p.points >= 4) add(10, 'heidong', 1, []);
    if (p.points >= 2 && rng() < 0.2) add(8, 'cidun', 1, []);
    if (p.points >= 1) add(9, p.points >= 2 && rng() < 0.45 ? 'dafan' : 'xiaofan', 1, []);
    if (p.points >= 3 && rng() < 0.1) add(5, 'chaofan', 1, []);
    if (state.settings.packs.hp && p.points >= (p.hp > 1 ? 3 : 2)) add(10, 'hezhang', 1, []);
    if (state.settings.packs.self && p.points >= 1 && !p.inDuel && !isDuelTarget(state, p.id) && rng() < 0.12) {
      add(6, 'zishou', 1, []);          // 决斗期间（自己决斗或被决斗）不能开自守
    }
    if (p.points >= 1) add(6, 'fandao', 1, aim(1));   // 便宜的反盾针对刀，偶尔带上

    const o = pickWeighted(cands, rng);
    picks.items[o.id] = o.count;
    if (o.targets.length) {
      const per = Math.floor(o.count / o.targets.length) || 1;
      picks.alloc[o.id] = {};
      o.targets.forEach(t => { picks.alloc[o.id][t] = per; });
      // 数量对不上（不可叠道具是一次一个）时，按目标数补正
      if (Math.floor(o.count / o.targets.length) < 1) picks.items[o.id] = o.targets.length;
    }
    return normalize(state, id, picks);
  }

  /* ------------------------------------------------- 对局存档：导出 / 导入 */
  /**
   * 把整局导成一个 JSON。**故意是全量的**：含所有人的点数、背包、每回合出招与伤害算式。
   * 这是"赛后复盘"用的档案，和"对局中不给别人看点数"是两件事——所以只有主动导出才拿得到。
   */
  function exportMatch(state, opts) {
    opts = opts || {};
    const left = alivePlayers(state);
    return {
      format: MATCH_FORMAT,
      version: MATCH_VERSION,
      exportedAt: new Date().toISOString(),
      roomCode: opts.roomCode || '',
      settings: clone(state.settings),
      roundCount: state.history.length,
      winner: state.winner ? nameOf(state, state.winner) : null,
      alive: left.map(p => p.name),
      players: state.players.map(p => ({
        id: p.id, name: p.name, isHost: !!p.isHost, isBot: !!p.isBot,
        alive: p.alive, hp: p.hp, points: p.points, bag: Object.assign({}, p.bag)
      })),
      history: clone(state.history)
    };
  }

  /**
   * 读一份对局文件。坏文件一律给出"人话"的错误原因，不让复盘器拿着半截数据崩掉。
   * 缺字段的回合会被跳过而不是整份报废——毕竟文件可能是别人手改过的。
   */
  function importMatch(input) {
    let data = input;
    if (typeof input === 'string') {
      try { data = JSON.parse(input); }
      catch (e) { return { ok: false, errors: ['这不是一个合法的 JSON 文件'], match: null }; }
    }
    if (!data || typeof data !== 'object' || Array.isArray(data)) {
      return { ok: false, errors: ['文件内容不是一份对局记录'], match: null };
    }
    const errors = [];
    if (data.format !== MATCH_FORMAT) errors.push('这不是「拔刀」的对局文件（缺 format: ' + MATCH_FORMAT + '）');
    if (!Array.isArray(data.history)) errors.push('文件里没有 history（逐回合记录）');
    if (errors.length) return { ok: false, errors: errors, match: null };

    const rounds = [];
    data.history.forEach((h, i) => {
      if (!h || typeof h !== 'object') return;
      const reports = Array.isArray(h.reports) ? h.reports.filter(r => r && r.id) : [];
      const before = Array.isArray(h.before) ? h.before.filter(p => p && p.id) : [];
      const after = Array.isArray(h.after) ? h.after.filter(p => p && p.id) : [];
      if (!reports.length && !after.length) return;      // 空回合直接跳过
      rounds.push({ round: Math.floor(num(h.round)) || i + 1, before: before, after: after, reports: reports });
    });
    if (!rounds.length) return { ok: false, errors: ['这份文件里连一回合的记录都没有'], match: null };

    const declared = Math.floor(num(data.roundCount));
    if (declared && declared !== rounds.length) {
      errors.push(`文件自称 ${declared} 回合，实际读到 ${rounds.length} 回合（按实际读到的显示）`);
    }
    const players = (Array.isArray(data.players) ? data.players : []).filter(p => p && p.id).map(p => ({
      id: p.id, name: p.name || p.id, isHost: !!p.isHost, isBot: !!p.isBot,
      alive: p.alive !== false, hp: num(p.hp), points: num(p.points),
      bag: Object.assign({}, p.bag || {})
    }));
    GIFT_IDS.forEach(g => players.forEach(p => { p.bag[g] = num(p.bag[g]); }));
    return {
      ok: true,
      errors: errors,                                   // 非致命的问题也带出去，界面提示一句
      match: {
        format: MATCH_FORMAT, version: Math.floor(num(data.version)) || MATCH_VERSION,
        exportedAt: typeof data.exportedAt === 'string' ? data.exportedAt : '',
        roomCode: typeof data.roomCode === 'string' ? data.roomCode : '',
        settings: normalizeSettings(data.settings),
        winner: typeof data.winner === 'string' ? data.winner : null,
        alive: Array.isArray(data.alive) ? data.alive.map(String) : [],
        players: players,
        roundCount: rounds.length,
        history: rounds
      }
    };
  }

  /* --------------------------------------------------- 对外只读状态（发网） */
  /** 按"给谁看"把结算战报里的点数数额抹掉（自己的那份保留） */
  function sanitizeResult(res, showAll, viewer) {
    if (!res || showAll) return res;
    const out = Object.assign({}, res);
    out.reports = res.reports.map(r => {
      if (r.id === viewer) return r;
      const o = Object.assign({}, r);
      o.cost = null;
      o.stolenFrom = (r.stolenFrom || []).map(s => ({ id: s.id, name: s.name, amount: null }));
      o.stolenBy = (r.stolenBy || []).map(s => ({ id: s.id, name: s.name, amount: null }));
      return o;
    });
    return out;
  }

  /**
   * 隐藏别人还没公开的东西；展示阶段才全部公开。
   * opts.viewerId：这份快照是给谁看的（每个人拿到的快照不一样）。
   * opts.withHistory：要不要带"逐回合全量档案"（只有房主自己和对局结束后才给）。
   * 「点数公开」关掉时，是**全流程**都看不到别人的点数与背包（含结算展示与日志里的数额），
   * 这样才没法靠"点数消耗"反推出对手出了什么。
   * 例外：对局已经结束（phase === 'over'）就翻开底牌——牌都打完了，藏着没有意义，
   * 而且最终战报要逐回合把"谁+谁=总共挨 X − 防御 Y = 掉 Z"写清楚。
   */
  function publicState(state, opts) {
    opts = opts || {};
    const viewer = opts.viewerId || null;
    const reveal = state.phase === 'reveal' || state.phase === 'over';
    const gameOver = state.phase === 'over';
    const ecoOpen = !!state.settings.ecoOpen;
    const showAll = ecoOpen || gameOver || !viewer;
    const hideEco = !showAll && state.phase !== 'lobby' && !!viewer;
    const fmtOpts = { showAll: showAll, viewerId: viewer };
    const withHistory = !!opts.withHistory || gameOver;
    const s = {
      round: state.round, phase: state.phase, winner: state.winner,
      settings: state.settings, hostId: state.hostId, ecoOpen: ecoOpen,
      selectSec: state.settings.selectSec, revealSec: state.settings.revealSec,
      players: state.players.map(p => {
        const isMe = !!viewer && p.id === viewer;
        const o = {
          id: p.id, name: p.name, isHost: p.isHost, isBot: p.isBot, connected: p.connected,
          alive: p.alive, hp: p.hp, points: p.points, bag: p.bag, submitted: p.submitted,
          ready: p.ready, inDuel: p.inDuel, duel: p.duel, selfGuardUntil: p.selfGuardUntil
        };
        if (hideEco && !isMe) { o.points = null; o.bag = null; }
        if (reveal) o.picks = p.picks;
        return o;
      }),
      log: state.log.slice(-40).map(e => formatLogEntry(e, fmtOpts)),
      lastResult: reveal ? sanitizeResult(state.lastResult, showAll, viewer) : null,
      // 逐回合档案：直接把引用递出去（settle 里都是"换新数组"而不是就地改，所以不会被后续回合污染）
      history: withHistory ? state.history : null,
      ecoHidden: hideEco
    };
    return s;
  }

  return {
    EPS: EPS, ITEM_LIST: ITEM_LIST, ITEMS: ITEMS, PACK_KEYS: PACK_KEYS, PACK_NAMES: PACK_NAMES,
    GIFT_IDS: GIFT_IDS, MAX_HISTORY: MAX_HISTORY, MATCH_FORMAT: MATCH_FORMAT, MATCH_VERSION: MATCH_VERSION,
    newState: newState, addPlayer: addPlayer, getPlayer: getPlayer,
    alivePlayers: alivePlayers, otherAlive: otherAlive,
    validate: validate, normalize: normalize, unitCost: unitCost, totalCost: totalCost,
    usablePoints: usablePoints, emptyPicks: emptyPicks, packOn: packOn,
    isStackable: isStackable, isAimable: isAimable, STACKABLE: STACKABLE,
    settle: settle, tickDuels: tickDuels, killPlayer: killPlayer,
    describePicks: describePicks, publicState: publicState, botAction: botAction,
    fmtNum: fmtNum, round2: round2, countOf: countOf, isDuelTarget: isDuelTarget,
    normalizeSettings: normalizeSettings, snapPlayers: snapPlayers,
    exportMatch: exportMatch, importMatch: importMatch
  };
})();

if (typeof module !== 'undefined' && module.exports) module.exports = BADAO;
</script>
<script>/* ============================================================================
 * 拔刀 · 界面层（渲染 + 交互）
 * 交互模型（按最终规则）：
 *   · 一回合只挑一种道具 → 点卡片就等于选中它，再点一次取消；
 *   · 攻击类道具的「数量」＝选中的人数（不可叠：一人一回合只吃 1 个）；
 *   · 可叠道具（精血/剑气/天雷/肥美/开包的彩虹斩/偷）才有数量加减，且分给多人必须整除；
 *   · 时间到了没锁定 → 主机自动按「集」结算（界面上有提醒）。
 * 只读 app.pub（主机广播的公开状态），自己那份草稿存在本地 draft 里。
 * ==========================================================================*/
const VIEW = (function () {
  'use strict';
  const B = BADAO;

  const app = {
    mode: 'home',      // home | room | game | replay
    status: '',        // 顶部连接状态
    matchErr: '',      // 导入对局文件时的报错（单独放，别和联机状态混在一起）
    roomCode: '',
    me: null,
    isHost: false,
    pub: null,
    remainMs: 0,
    remainTotal: 0,
    err: '',
    busy: false,
    replay: null       // 复盘：{ match, idx, animate } —— 导入对局文件后才有
  };

  // chosen: 本回合挑中的那一种道具；count: 可叠道具的数量；sel: 每个道具选中的头像
  let draft = { chosen: null, count: 1, sel: {}, steal: [] };
  let draftFor = -1;
  let tab = 'attack';
  let sheet = null;          // null | 'rules' | 'log' | { kind:'dump', text, name }（导出兜底：把 JSON 摊出来）
  let lastSig = '';

  /* ---------------------------------------------------------------- 小工具 */
  const $ = s => document.querySelector(s);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const pct = (a, b) => (b > 0 ? Math.max(0, Math.min(100, a / b * 100)) : 0);

  /** 血量显示：0 血是常态；叠肥的 2-ε 会留下"一丝血"，单独标出来 */
  function fmtHp(v) {
    if (v > 0 && v < 1e-6) return 'ε';
    if (!isFinite(v)) return '∞';
    return String(B.round2(v));
  }
  function fmtNum(v) { return isFinite(v) ? String(B.round2(v)) : '∞'; }
  function secText(ms) { return (Math.max(0, ms) / 1000).toFixed(1); }

  const AVATAR_COLORS = ['#3b82f6', '#ef4444', '#10b981', '#f59e0b', '#8b5cf6', '#0891b2', '#ec4899', '#65a30d'];
  function avatarOf(p) {
    let h = 0;
    for (let i = 0; i < p.id.length; i++) h = (h * 31 + p.id.charCodeAt(i)) % 997;
    return AVATAR_COLORS[h % AVATAR_COLORS.length];
  }
  function initial(name) { return esc((name || '?').trim().slice(0, 1)); }

  const mePlayer = () => (app.pub ? app.pub.players.find(p => p.id === app.me) || null : null);
  const canAct = () => {
    const me = mePlayer();
    return !!(app.pub && app.pub.phase === 'select' && me && me.alive);
  };
  const foes = () => (app.pub ? app.pub.players.filter(p => p.alive && p.id !== app.me) : []);
  const packOn = id => (app.pub ? B.packOn(app.pub, id) : false);
  const packs = () => (app.pub ? app.pub.settings.packs : { hp: false, rainbow: false, self: false });
  const isStack = id => !!B.isStackable(app.pub, id);
  const isAim = id => !!B.isAimable(B.ITEMS[id]);

  /* -------------------------------------------------------------- 草稿管理 */
  function clearDraft() { draft = { chosen: null, count: 1, sel: {}, steal: [] }; }

  function syncDraftRound() {
    if (!app.pub) return;
    if (app.pub.round !== draftFor) {
      draftFor = app.pub.round;
      clearDraft();
    }
  }

  /** 清掉草稿里已经失效的目标（对象已死 / 已退出） */
  function pruneDraft() {
    if (!app.pub || !draft.chosen) return;
    const ids = foes().map(p => p.id);
    const id = draft.chosen;
    const sel = (draft.sel[id] || []).filter(t => ids.indexOf(t) >= 0);
    if (sel.length) draft.sel[id] = sel; else delete draft.sel[id];
    draft.steal = draft.steal.filter(t => ids.indexOf(t) >= 0);
    // 这里**不**再自动补一个目标：谁是目标必须由玩家自己点，选了 0 个人就交给校验去提示
  }

  const selOf = id => (draft.sel[id] || []).filter(t => foes().some(f => f.id === t));
  /** 最多能打几个人：受规则（彩虹斩没开包只能 1 个）和材料/赠品数量限制 */
  function maxTargets(id) {
    const me = mePlayer(), it = B.ITEMS[id];
    let cap = (id === 'caihong' && !packOn('rainbow')) ? 1 : foes().length;
    if (me && it) {
      if (it.giftOnly) cap = Math.min(cap, me.bag[id] || 0);                                  // 一人要 1 个
      if (it.consume) Object.keys(it.consume).forEach(k => {
        cap = Math.min(cap, Math.floor((me.bag[k] || 0) / it.consume[k]));                     // 叠肥一人要 3 个肥美
      });
      if (isStack(id)) cap = foes().length;                                                    // 可叠道具只受人数限制
    }
    return Math.max(0, cap);
  }
  /** 可叠道具最多能用几个（受背包 / 材料 / 点数限制） */
  function maxCount(id) {
    const me = mePlayer(), it = B.ITEMS[id];
    if (!me) return 1;
    let cap = 99;
    if (it.giftOnly) cap = Math.min(cap, me.bag[id] || 0);
    if (it.consume) Object.keys(it.consume).forEach(k => {
      cap = Math.min(cap, Math.floor((me.bag[k] || 0) / it.consume[k]));
    });
    if (id === 'caihong' && !packOn('rainbow')) cap = Math.min(cap, 1);
    const unit = B.unitCost(app.pub, me, id);
    if (unit > 0) cap = Math.min(cap, Math.floor(usablePoints() / unit));
    return Math.max(1, cap);
  }  function usablePoints() {
    const me = mePlayer();
    return me && me.points != null ? me.points : 0;
  }

  /** 草稿 → 提交给引擎的出招格式 */
  function draftAction() {
    const out = { items: {}, alloc: {}, steal: [] };
    const id = draft.chosen;
    if (!id) return out;
    const it = B.ITEMS[id];
    if (isAim(id)) {
      const targets = selOf(id);
      if (!targets.length) { out.items[id] = 1; return out; }   // 没选人 → 交给校验去报错
      const n = isStack(id) ? Math.max(targets.length, Math.min(draft.count, maxCount(id))) : targets.length;
      out.items[id] = n;
      const map = {};
      const base = Math.floor(n / targets.length), rem = n % targets.length;
      targets.forEach((t, i) => { map[t] = base + (i < rem ? 1 : 0); });
      out.alloc[id] = map;
    } else {
      out.items[id] = 1;
      if (it.kind === 'steal') out.steal = draft.steal.slice();
    }
    return out;
  }
  const myCost = () => {
    // 攻击类道具在"还没选目标"时，草稿里会塞一个占位 1（好让校验报出"还没选目标"）。
    // 但界面上"本回合花多少点"要按真实目标数算，否则一个人都没点就说花掉了 1 点。
    const id = draft.chosen;
    if (id && isAim(id) && !selOf(id).length) return 0;
    return B.totalCost(app.pub, mePlayer(), draftAction().items);
  };

  /** 本回合出招的人话描述 */
  function describeDraft() {
    const id = draft.chosen;
    if (!id) return '';
    const it = B.ITEMS[id];
    const act = draftAction();
    const parts = [];
    Object.keys(act.items).forEach(iid => {
      const n = act.items[iid];
      if (isAim(iid)) {
        const map = act.alloc[iid] || {};
        const list = Object.keys(map).map(k => {
          const p = app.pub.players.find(x => x.id === k);
          return `${p ? p.name : '?'}×${map[k]}`;
        });
        parts.push(`${B.ITEMS[iid].name}×${n}${list.length ? ' → ' + list.join(' ') : '（还没选目标）'}`);
      } else if (it.kind === 'steal') {
        parts.push(`偷 → ${draft.steal.map(k => { const p = app.pub.players.find(x => x.id === k); return p ? p.name : '?'; }).join(' ')}`);
      } else {
        parts.push(it.name);
      }
    });
    return parts.join('，');
  }

  /* =========================================================== 渲染入口 */
  function render() {
    if (app.pub && app.mode === 'game') syncDraftRound();
    pruneDraft();
    const el = $('#app');
    let html = '';
    if (app.mode === 'home') html = screenHome();
    else if (app.mode === 'replay') html = screenReplay();
    else if (!app.pub || app.pub.phase === 'lobby') html = screenRoom();
    else html = screenGame();
    el.innerHTML = html;
    renderSheet();
    renderTimer();
    drawArrows();
    drawFx(app._tl);
    lastSig = sig();
  }

  function sig() {
    if (app.mode === 'replay') return 'replay|' + (app.replay ? app.replay.idx : '') + '|' + (app.replay ? app.replay.animate : '');
    if (!app.pub) return app.mode + '|';
    return app.mode + '|' + app.pub.phase + '|' + app.pub.round + '|' + app.pub.winner + '|' +
      app.pub.players.map(p => [p.id, p.alive, p.hp, p.points, p.submitted, p.ready, p.connected,
        p.inDuel ? 'd' + (p.duel ? p.duel.left : '') : ''].join(',')).join(';') +
      '|' + JSON.stringify(draft) + '|' + tab + '|' + (typeof sheet === 'object' ? 'dump' : sheet) + '|' + app.err;
  }
  /** 没有实质变化就只刷新倒计时，别打断正在点的按钮 */
  function softRender() {
    if (!app.pub || app.mode !== 'game') return render();
    if (sig() !== lastSig) return render();
    renderTimer();
  }

  function renderTimer() {
    const num = $('#timerNum'), bar = $('#timerBar');

    const left = Math.max(0, app.remainMs);
    num.textContent = secText(left);
    const warn = left <= 1500 && left > 0;
    num.classList.toggle('warn', warn);
    if (bar) {
      bar.style.width = pct(left, app.remainTotal) + '%';
      bar.classList.toggle('warn', warn);
    }
  }
