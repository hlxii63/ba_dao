  function playerCard(p, i, reveal, anim) {
    const flags = [];
    if (p.isHost) flags.push('<span class="badge amber">房主</span>');
    if (p.isBot) flags.push('<span class="badge grey">电脑</span>');
    if (p.id === app.me) flags.push('<span class="badge blue">你</span>');
    if (!p.connected) flags.push('<span class="badge red">掉线</span>');
    if (!p.alive) flags.push('<span class="badge red">💀 出局</span>');
    else if (p.inDuel && p.duel) flags.push(`<span class="badge red">决斗中 ${p.duel.cleared.length}/${p.duel.targets.length} · 剩 ${p.duel.left}</span>`);
    else if (p.selfGuardUntil >= (app.pub.round || 0)) flags.push(`<span class="badge purple">自守保护至 R${p.selfGuardUntil}</span>`);
    if (!reveal && p.alive && p.submitted) flags.push('<span class="badge green">已锁定</span>');

    let act = '', dying = false;
    if (reveal && p.picks) {
      const rep = app.pub.lastResult ? app.pub.lastResult.reports.find(r => r.id === p.id) : null;
      const d0 = i * anim.step;
      const events = rep ? rep.events : [];
      const hits = (rep && rep.hits) || [];
      dying = events.some(e => /阵亡|暴毙/.test(e));
      const dmg = rep && rep.damage > 0 ? rep.damage : 0;

      // 出招区：优先写成"谁打谁"（上吊×1 → 小李 −3），偷单独写，其余退回普通描述
      const itemLabel = Object.keys(p.picks.items || {})
        .map(id => `${B.ITEMS[id] ? B.ITEMS[id].name : id}×${p.picks.items[id]}`).join('、');
      let head;
      if (hits.length) head = `${itemLabel} → ${hits.map(h => `${nameOf(h.to)} −${fmtNum(h.dmg)}`).join('、')}`;
      else if (p.picks.items && p.picks.items.tou) {
        head = `偷 → ${(p.picks.steal || []).map(nameOf).join('、') || '（没选人）'}`;
      } else head = B.describePicks(app.pub, p.picks);

      // 被打的人：把自己的"挨打明细"写在最上面，一眼看出是谁干的
      const incoming = incomingOf(p.id);
      act = `<div class="act ${anim.animate ? 'rv' : ''}" style="animation-delay:${d0}ms">
        <div class="who">${esc(head)}</div>
        ${incoming.map(inc => `<span class="ev hit2 ${anim.animate ? 'rv' : ''}" style="animation-delay:${d0 + 120}ms"
          >🩸 被 ${esc(inc.from)} 的「${esc(inc.itemName)}」打 −${fmtNum(inc.dmg)}</span>`).join('')}
        ${events.map((e, j) => {
          const cls = /阵亡|暴毙|☠️/.test(e) ? 'hit' : (/获得|防御|挡下|反盾成功/.test(e) ? 'good' : '');
          return `<span class="ev ${cls} ${anim.animate ? 'rv' : ''}" style="animation-delay:${d0 + 200 + j * 110}ms">· ${esc(e)}</span>`;
        }).join('')}
      </div>`;
      if (dmg) {
        act = `<span class="dmgfly ${anim.animate ? 'rv-dmg' : ''}" style="animation-delay:${d0 + 120}ms">−${fmtNum(dmg)}</span>` + act;
      }
      if (dying) {
        act += `<span class="skull ${anim.animate ? 'rv' : ''}" style="animation-delay:${d0 + 300}ms">💀</span>`;
      }
    }
    return `<div class="pcard ${p.id === app.me ? 'me' : ''} ${!p.alive ? 'fully-dead' : ''}" data-pid="${esc(p.id)}">
      <div class="inner ${dying && anim.animate ? 'dying' : ''}" style="animation-delay:${i * anim.step + 240}ms">
      <div class="pname">
        <span class="avatar" style="background:${avatarOf(p)}">${initial(p.name)}</span>
        <span class="ellipsis">${esc(p.name)}</span>
      </div>
      <div class="stats">
        <span>❤ <b>${p.alive ? fmtHp(p.hp) : '—'}</b></span>
        <span title="${p.points === null ? '要等结算才公开' : '点数'}">🪙 <b>${p.points === null ? '?' : fmtNum(p.points)}</b></span>
      </div>
      <div class="flags">${flags.join('')}</div>
      ${act}
      </div>
    </div>`;
  }

  /** 这一回合谁打了他（画连线 + 卡片上写明细都用它） */
  function incomingOf(id) {
    const res = app.pub && app.pub.lastResult;
    if (!res) return [];
    const out = [];
    res.reports.forEach(r => (r.hits || []).forEach(h => {
      if (h.to !== id) return;
      out.push({ from: r.name, itemName: B.ITEMS[h.item] ? B.ITEMS[h.item].name : h.item, dmg: h.dmg });
    }));
    return out;
  }

  const nameOf = id => {
    const p = app.pub.players.find(x => x.id === id);
    return p ? p.name : '???';
  };

  /** 在玩家格子上画「谁打谁」的连线：红=攻击、紫=磁暴、橙=反盾弹回、青=偷 */
  const ARROW_COLORS = { hit: '#ef4444', smite: '#8b5cf6', back: '#f59e0b', steal: '#0891b2' };
  function drawArrows() {
    const wrap = $('.players');
    if (!wrap) return;
    const old = wrap.querySelector('svg.arrows');
    if (old) old.remove();
    const pub = app.pub, res = pub && pub.lastResult;
    if (!pub || pub.phase !== 'reveal' || !res) return;
    const box = wrap.getBoundingClientRect();
    if (!box.width || !box.height) return;            // 没有布局信息（或 jsdom）就不画

    const NS = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(NS, 'svg');
    svg.setAttribute('class', 'arrows');
    svg.setAttribute('viewBox', `0 0 ${Math.round(box.width)} ${Math.round(box.height)}`);

    // 箭头尖：每种颜色一个 marker
    const defs = document.createElementNS(NS, 'defs');
    Object.keys(ARROW_COLORS).forEach(kind => {
      const m = document.createElementNS(NS, 'marker');
      m.setAttribute('id', 'ah-' + kind);
      m.setAttribute('viewBox', '0 0 10 10');
      m.setAttribute('refX', '8'); m.setAttribute('refY', '5');
      m.setAttribute('markerWidth', '5'); m.setAttribute('markerHeight', '5');
      m.setAttribute('orient', 'auto-start-reverse');
      const path = document.createElementNS(NS, 'path');
      path.setAttribute('d', 'M0,0 L10,5 L0,10 z');
      path.setAttribute('fill', ARROW_COLORS[kind]);
      m.appendChild(path);
      defs.appendChild(m);
    });
    svg.appendChild(defs);

    const geo = id => {
      const el = wrap.querySelector(`[data-pid="${id}"]`);
      if (!el) return null;
      const r = el.getBoundingClientRect();
      if (!r.width && !r.height) return null;
      return { x: r.left - box.left + r.width / 2, y: r.top - box.top + r.height / 2, w: r.width || 60, h: r.height || 40 };
    };
    // 把线段两端缩到卡片边缘，别糊住头像
    const trim = (a, b) => {
      const dx = b.x - a.x, dy = b.y - a.y;
      const len = Math.hypot(dx, dy) || 1;
      const ux = dx / len, uy = dy / len;
      const edge = (g, sign) => {
        const tx = ux !== 0 ? Math.abs((g.w / 2 + 6) / ux) : Infinity;
        const ty = uy !== 0 ? Math.abs((g.h / 2 + 6) / uy) : Infinity;
        const t = Math.min(tx, ty, len / 2);
        return { x: g.x + sign * ux * t, y: g.y + sign * uy * t };
      };
      return { from: edge(a, 1), to: edge(b, -1), len: len };
    };

    const arcs = [];
    res.reports.forEach((rep, i) => {
      (rep.hits || []).forEach(h => arcs.push({ from: rep.id, to: h.to, kind: h.item === 'cibao' ? 'smite' : 'hit' }));
      (rep.reverseBack || []).forEach(a => arcs.push({ from: rep.id, to: a, kind: 'back' }));
      (rep.stolenFrom || []).forEach(s => arcs.push({ from: rep.id, to: s.id, kind: 'steal' }));
    });

    const step = app.revealStep || 200;
    arcs.forEach(a => {
      const g1 = geo(a.from), g2 = geo(a.to);
      if (!g1 || !g2) return;
      const t = trim(g1, g2);
      const mx = (t.from.x + t.to.x) / 2, my = (t.from.y + t.to.y) / 2;
      const nx = -(t.to.y - t.from.y), ny = t.to.x - t.from.x;   // 垂直方向，让线稍微弯一点
      const nl = Math.hypot(nx, ny) || 1;
      const bend = Math.min(26, t.len * 0.16);
      const cx = mx + (nx / nl) * bend, cy = my + (ny / nl) * bend;
      const path = document.createElementNS(NS, 'path');
      path.setAttribute('d', `M ${t.from.x.toFixed(1)} ${t.from.y.toFixed(1)} Q ${cx.toFixed(1)} ${cy.toFixed(1)} ${t.to.x.toFixed(1)} ${t.to.y.toFixed(1)}`);
      path.setAttribute('fill', 'none');
      path.setAttribute('stroke', ARROW_COLORS[a.kind]);
      path.setAttribute('stroke-width', a.kind === 'steal' ? '2' : '2.6');
      path.setAttribute('opacity', a.kind === 'steal' ? '0.85' : '0.95');
      path.setAttribute('marker-end', `url(#ah-${a.kind})`);
      path.setAttribute('stroke-dasharray', t.len.toFixed(0));
      path.setAttribute('stroke-dashoffset', t.len.toFixed(0));
      const idx = res.reports.findIndex(r => r.id === a.from);
      path.style.animationDelay = (Math.max(0, idx) * step + 150) + 'ms';
      svg.appendChild(path);
    });
    wrap.appendChild(svg);
  }

  function revealList() {
    const res = app.pub.lastResult;
    if (!res) return '';
    return `<ul class="logbox" style="max-height:none">${res.reports.map(r => {
      const p = app.pub.players.find(x => x.id === r.id);
      const hits = r.hits || [];
      const label = Object.keys(r.items || {}).map(id => `${B.ITEMS[id] ? B.ITEMS[id].name : id}×${r.items[id]}`).join('、');
      const head = hits.length
        ? `${label} → ${hits.map(h => `${nameOf(h.to)} −${fmtNum(h.dmg)}`).join('、')}`
        : B.describePicks(app.pub, { items: r.items, alloc: r.alloc, steal: r.steal });
      const died = r.events.some(e => /阵亡|暴毙/.test(e));
      return `<li class="res ${died ? 'died' : ''}">
        <div><b>${esc(p ? p.name : r.name)}</b> ${esc(head)}</div>
        ${r.events.map(e => `<div class="tiny ${/阵亡|暴毙/.test(e) ? 'err' : 'muted'}">${esc(e)}</div>`).join('')}
      </li>`;
    }).join('')}</ul>`;
  }

  function screenOver() {
    const pub = app.pub;
    const w = pub.players.find(p => p.id === pub.winner);
    return `
    <div class="wrap">
      <div class="card" style="text-align:center;padding:32px 16px">
        <div style="font-size:44px">${w ? '🏆' : '🤝'}</div>
        <h2 style="font-size:24px;font-weight:800;margin-top:8px">${w ? esc(w.name) + ' 拔得头筹！' : '全员阵亡，平局'}</h2>
        <div class="small muted" style="margin-top:8px">共 ${(pub.lastResult ? pub.lastResult.round : pub.round)} 回合</div>
        <div style="margin-top:24px">
          ${app.isHost ? '<button class="btn primary lg block" data-act="rematch">再来一局（回房间重新确认）</button>' : ''}
          <button class="btn ghost block" style="margin-top:8px" data-act="rules">看规则</button>
          <button class="btn ghost block" style="margin-top:8px" data-act="leave">离开房间</button>
        </div>
      </div>
      <div class="card">
        <b>最终战报</b>
        <div class="divider"></div>
        ${revealList()}
      </div>
      <div style="height:24px"></div>
    </div>`;
  }

  /* ------------------------------------------------------------ 道具面板 */
  const TABS = [
    { id: 'attack', name: '攻击' }, { id: 'defense', name: '防御' }, { id: 'reverse', name: '反盾' },
    { id: 'special', name: '特殊' }, { id: 'gift', name: '赠品' }
  ];
  const TAB_OF = {
    yidao: 'attack', shuangdao: 'attack', shangdiao: 'attack', sidao: 'attack', wudao: 'attack',
    caihong: 'attack', cibao: 'attack', podun: 'attack',
    busi: 'defense', xiaofang: 'defense', dafang: 'defense', cidun: 'defense', heidong: 'defense',
    baidong: 'defense', hezhang: 'defense',
    xiaofan: 'reverse', dafan: 'reverse', chaofan: 'reverse',
    tou: 'special', zishou: 'special', du: 'special',
    jingxue: 'gift', jianqi: 'gift', tianlei: 'gift', feimei: 'gift', diefei: 'gift'
  };

  function itemLocked(it) {
    const me = mePlayer();
    if (!me) return true;
    if (it.pack && !packOn(it.id)) return true;
    if (it.giftOnly && !(me.bag[it.id] > 0)) return true;
    if (it.consume && !Object.keys(it.consume).every(k => (me.bag[k] || 0) >= it.consume[k])) return true;
    if (it.id === 'zishou' && (me.inDuel || B.isDuelTarget(app.pub, me.id))) return true;
    if (isAim(it.id) && foes().length === 0) return true;
    if (B.unitCost(app.pub, me, it.id) > usablePoints()) return true;
    return false;
  }

  function itemPanel() {
    const items = B.ITEM_LIST.filter(it => TAB_OF[it.id] === tab && (!it.pack || packs()[it.pack]));
    return `
      <div class="tiny muted">一回合只能挑一种道具：点卡片 = 选中（再点一次取消），攻击类再点头像选人。</div>
      <div class="tabs" style="margin-top:8px">
        ${TABS.map(t => {
          const on = draft.chosen && TAB_OF[draft.chosen] === t.id;
          return `<button class="tab ${tab === t.id ? 'on' : ''}" data-act="tab" data-tab="${t.id}">${t.name}${on ? '<span class="dot">✓</span>' : ''}</button>`;
        }).join('')}
      </div>
      <div class="items">
        ${items.map(it => itemCard(it)).join('')}
      </div>`;
  }

  function itemCard(it) {
    const me = mePlayer();
    const locked = itemLocked(it);
    const chosen = draft.chosen === it.id;
    const cost = B.unitCost(app.pub, me, it.id);
    const costText = cost === 0 ? '免费' : (it.costFn ? `动态 ${fmtNum(cost)} 点` : `${fmtNum(cost)} 点`);
    const extra = it.giftOnly ? `你有 ${me.bag[it.id] || 0} 个`
      : (it.consume ? Object.keys(it.consume).map(k => `要 ${it.consume[k]} 个${B.ITEMS[k].name}`).join('、') : '');

    let ctrl = '';
    if (isAim(it.id)) {
      const targets = selOf(it.id);
      const act = draftAction();
      const n = act.items[it.id] || 0;
      if (isStack(it.id)) {
        const m = Math.max(1, targets.length);
        const cap = maxCount(it.id);
        const per = Math.max(1, Math.round((chosen ? draft.count : m) / m));
        const maxPer = Math.max(1, Math.floor(cap / m));
        ctrl = `<div class="ctrl">
          <div class="stepper">
            <button data-act="dec" data-item="${it.id}" ${locked || !chosen || per <= 1 ? 'disabled' : ''}>−</button>
            <span class="n">${chosen ? per : 0}</span>
            <button data-act="inc" data-item="${it.id}" ${locked || !chosen || per >= maxPer ? 'disabled' : ''}>＋</button>
          </div>
          <span class="tiny muted">${chosen ? `每人 ${per} 个 · 共 ${per * m} 个` : '可叠（要均分）'}</span>
        </div>`;
      } else {
        ctrl = `<div class="ctrl">
          <span class="badge ${chosen ? 'blue' : 'grey'}">${chosen ? `${n} 个 · 花 ${fmtNum(cost * n)} 点` : '不可叠：一人只吃 1 个'}</span>
        </div>`;
      }
    } else {
      ctrl = `<div class="ctrl">
        <span class="badge ${chosen ? 'blue' : 'grey'}">${chosen ? '本回合就出它' : '不可叠 · 一个'}</span>
      </div>`;
    }

    return `<div class="item ${chosen ? 'on' : ''} ${locked ? 'locked' : ''}">
      <div class="head" data-act="choose" data-item="${it.id}" style="cursor:pointer">
        <span class="icon">${it.icon}</span>
        <span class="nm">${esc(it.name)}</span>
        <span class="cost ${cost === 0 ? 'free' : ''}">${costText}</span>
      </div>
      <div class="desc">${esc(it.desc)}${extra ? `（${extra}）` : ''}</div>
      <div class="ctrl">
        ${ctrl}
        <button class="btn sm ${chosen ? 'primary' : 'ghost'}" style="margin-left:auto" data-act="choose" data-item="${it.id}"
          ${locked ? 'disabled' : ''}>${chosen ? '已选 ✓' : '选用'}</button>
      </div>
      ${targetRowHtml(it)}
    </div>`;
  }

  /** 目标行：点头像多选；没选中这张卡时不渲染，界面更清爽（选中后卡片会长出这一行） */
  function targetRowHtml(it) {
    if (!isAim(it.id) && it.kind !== 'steal') return '';
    if (draft.chosen !== it.id) return '';
    const list = foes();
    const sel = it.kind === 'steal' ? draft.steal : selOf(it.id);
    const act = draftAction();
    const alloc = act.alloc[it.id] || {};
    const hint = it.kind === 'steal'
      ? `偷谁？可多选（点一下选、再点一下取消）${app.pub.ecoHidden ? ' · 对方点数要等结算才公开＝盲偷' : ' · 点数公开，能看准了偷'}${sel.length ? ` · 已选 ${sel.length} 人` : ''}`
      : (sel.length > 1 ? `已选 ${sel.length} 人（每人 ${fmtNum(draft.count / sel.length)} 个）` : '点头像选目标');
    return `<div class="targets">
      <div class="tiny muted">${hint}</div>
      <div class="tchips">
      ${list.map(p => `<button class="tchip ${sel.indexOf(p.id) >= 0 ? 'on' : ''}" data-act="pick"
          data-item="${esc(it.id)}" data-target="${esc(p.id)}" title="${esc(p.name)}"
        >${initial(p.name)}${alloc[p.id] > 1 ? `<i>${alloc[p.id]}</i>` : ''}</button>`).join('')}
      ${list.length > 1 ? `<button class="btn sm ghost" data-act="pick-all" data-item="${esc(it.id)}">全选</button>` : ''}
      </div>
    </div>`;
  }

  /* ---------------------------------------------------------------- 弹层 */
  function renderSheet() {
    const el = $('#overlay');
    if (!sheet) { el.innerHTML = ''; return; }
    const title = sheet === 'rules' ? '完整规则' : '战斗日志';
    const body = sheet === 'rules' ? rulesHtml() : logHtml();
    el.innerHTML = `<div class="mask" data-act="maskclose">
      <div class="sheet" data-stop="1">
        <div class="row space"><h3>${esc(title)}</h3>
          <button class="btn sm ghost" data-act="close">关闭</button></div>
        <div class="divider"></div>
        ${body}
      </div>
    </div>`;
  }

  function logHtml() {
    const log = (app.pub && app.pub.log) || [];
    if (!log.length) return '<div class="small muted">还没有战况。</div>';
    return `<ul class="logbox">${log.slice().reverse().map(l => `<li>${esc(l)}</li>`).join('')}</ul>`;
  }

  function rulesHtml() {
    return `<div class="doc">
      <h4>核心</h4>
      <p>每回合所有人同时出招，倒计时结束后统一结算：<b>受到的伤害 = 外面所有人打你的总攻击 − 你的防御</b>。</p>
      <p>血量初始为 <b>0</b>，下限为 0。<b>只要 血量 − 伤害 &lt; 0 就死</b> —— 0 血的人挨 1 点伤害就死，<code>合掌</code> 加的血就是多一层缓冲。</p>
      <p>攻击、防御、反盾都在回合末结算、下回合清零；血量、点数、赠品留到下一回合。</p>
      <p><b>时间到了还没锁定，就自动按「集」结算</b>（白拿 1 点，但别指望集能保命）。</p>

      <h4>一回合只能挑一种道具</h4>
      <p>每回合你只能从道具里挑 <b>一种</b>：要么「集」赚点，要么出刀，要么上防，要么反盾，要么特殊道具。
         所以「集完顺手砍一刀」「边防边反」这类组合不存在，5 秒决策就是赌这一手。</p>
      <p><b>不可叠</b>：除了下面列出的可叠道具，其余道具对<b>同一个人一回合只能用一次</b>。
         想同时打多个人？买 N 把同种刀砍 N 个人——一人一刀，不能一人三刀。</p>
      <p><b>可叠</b>：精血（原规则写明「可叠加」）、彩虹斩（房主开了叠加包后 n 倍）、偷（「不论使用数量」），
         以及同属赠品的剑气 / 天雷 / 肥美。可叠道具分给多个人时<b>必须完全均分</b>，不能一个人 3 个、另一个 2 个。</p>

      <h4>点数</h4>
      <p>初始 0 点，不会自动增长，只能靠「集」赚。因为一回合只能出一种道具，集点只能留到下回合花。</p>

      <h4>攻击</h4>
      <p>一刀 1 / 双刀 2 / 上吊 3 / 四刀 4 / 五刀 5 / 彩虹斩 8。点对手头像选目标，买 N 把同种刀就能选 N 个人，旁边有「全选」。</p>
      <p><b>彩虹斩</b>：命中即死，无视血量和自守；但会被防具挡下（算出来 ≤ 0 就无效）。没开叠加包时一回合只能 1 个。</p>
      <p><b>赠品</b>（回合末发放、自动进背包、可跨回合累积，要自己选用）：上吊送 1 精血（0.5 伤害）、四刀送 1 剑气（1 伤害）、
         五刀送 1 天雷（3 伤害，<b>在小防面前只有 2 伤害</b>）、不死送 1 肥美（0.5 伤害）。叠肥＝吃掉 3 个肥美造成 2-ε 伤害
         （所以 2 血的人能剩一丝血站住，也破不了小反的 2 点弹性）。</p>
      <p><b>磁暴</b>（2 点）：目标本回合若出磁盾，立刻暴毙；没出就无事发生。</p>

      <h4>防御</h4>
      <p>不死 1（免费）/ 小防 2（免费）/ 大防 3（1 点）/ 磁盾 5（2 点，会被磁暴劈）/ 黑洞 8（4 点）/ 白洞 ∞（6 点）。一回合只能上一个。</p>

      <h4>反盾</h4>
      <p>像一个弹簧：外面打你的总攻击 <b>≤ 弹性范围</b> → 反盾成功，<b>无视血量杀死所有攻击你的人</b>（他们的防御也救不了）；
         <b>&gt; 弹性范围</b> → 反盾被破，反盾者无视血量当场暴毙，攻击方活着。
         小反 2（1 点）/ 大反 4（2 点）/ 超反 6.5（3 点），一回合只能上一个。</p>

      <h4>偷（0 点）</h4>
      <p>用「偷」的回合防御固定为 0.5。指定若干对象：</p>
      <p>· 对象在「集」→ 偷走他<b>全部点数</b>（含刚集的）<br>
         · 对象出防 / 反盾 / 自守 / 合掌 → <b>你当场暴毙</b><br>
         · 对象在做别的事 → 无事发生</p>
      <p>偷得准不准，看房主的<b>点数公开</b>开关：关（默认）时出招阶段看不到别人的点数与背包，等于盲偷；
         开了就是明牌局，谁钱多一目了然。</p>

      <h4>拓展包（房主开）</h4>
      <p><b>血量拓展</b>：合掌 —— 血量 +1、本回合防御 1；血量大于 1 时花 3 点，否则 2 点。破盾 —— 伤害 0.5（1 点），
         如果含破盾的攻击打得对方扣血，就清空对方血量。<br>
         <b>自守拓展</b>：自守（1 点）—— 本回合防御 1，之后五回合内若死亡，改为和所有直接致死者发起决斗，回合上限 <b>4n+1</b>（n = 致死者人数）：
         决斗期内把这些人<b>都杀过一遍</b>（把对方自守打出来也算一遍）就复活，否则真正死亡。决斗期间双方都不能开自守。<br>
         · 毒（2 点）：伤害 1.5，如果含毒的伤害打在自守状态或正在自守的玩家上，该玩家立刻暴毙。</p>

      <h4>胜负与开局</h4>
      <p>没有回合上限，活到最后的人赢；如果全员同时阵亡就是平局。</p>
      <p>房间里<b>所有玩家（含房主）都要点「准备好了」</b>房主才能开始；再来一局要回房间重新确认一遍。</p>

      <h4>房主开关</h4>
      <p>· <b>选择 / 展示时间</b>：默认 5 秒 / 3 秒。<br>
         · <b>全员锁定后立刻结算</b>：默认开，都锁好了就不用干等。<br>
         · <b>点数公开</b>：默认关（出招阶段别人的点数与背包显示为 ?，防反推）；开了是明牌局。<br>
         · <b>血量拓展 / 彩虹斩叠加 / 自守拓展</b>：默认全关，按需开启。</p>

      <h4>本实现补充说明</h4>
      <p>· 「破盾」原规则没写点数消耗，本局按 <b>1 点</b> 实现；「偷」按 <b>0 点</b> 实现。<br>
         · 死亡后点数与赠品清空，人变观战者，<b>头像变黑白</b>。<br>
         · 所有攻击同时结算：被反盾弹死的人，他本回合打出去的伤害依然生效。<br>
         · 伤害公式只减「防御」，反盾单独判定。</p>
    </div>`;
  }

  /* =========================================================== 事件处理 */
  /** 一回合只挑一种道具：点卡片＝选中；再点一次＝取消；换一种会自动丢掉旧的 */
  function chooseItem(id) {
    if (!canAct()) return;
    if (draft.chosen === id) { clearDraft(); app.err = ''; render(); return; }
    const it = B.ITEMS[id];
    if (itemLocked(it)) { toast(`「${it.name}」现在不能用`); return; }
    draft = { chosen: id, count: 1, sel: {}, steal: [] };
    if (isAim(id) || it.kind === 'steal') {
      const f = foes();
      if (f.length) {
        if (it.kind === 'steal') draft.steal = [f[0].id];
        else draft.sel[id] = [f[0].id];
      }
    }
    if (isStack(id)) draft.count = Math.max(1, (draft.sel[id] || []).length);
    app.err = '';
    render();
  }

  /** 点头像多选目标（偷是"选中/取消"，攻击类是"加/减一个人"） */
  function toggleTarget(id, tid) {
    if (!canAct() || draft.chosen !== id) { toast('先点这张卡片「选用」再选人'); return; }
    const it = B.ITEMS[id];
    if (it.kind === 'steal') {
      // 之前这里只走"添加"分支，导致同一个人能被塞进去很多次、而且取消不掉
      const i = draft.steal.indexOf(tid);
      if (i >= 0) {
        if (draft.steal.length <= 1) { toast('至少留一个目标（想取消整个道具就再点一次卡片）'); return; }
        draft.steal.splice(i, 1);
      } else {
        draft.steal.push(tid);
      }
      app.err = '';
      render();
      return;
    }
    if (!isAim(id)) return;
    const list = draft.sel[id] || (draft.sel[id] = []);
    const i = list.indexOf(tid);
    if (i >= 0) {
      if (list.length <= 1) { toast('至少留一个目标'); return; }
      list.splice(i, 1);
    } else {
      if (list.length >= maxTargets(id)) {
        toast(id === 'caihong' && !packOn('rainbow')
          ? '彩虹斩没开叠加包时一回合只能斩 1 个人'
          : '没有更多可打的人了');
        return;
      }
      const unit = B.unitCost(app.pub, mePlayer(), id);
      if (!isStack(id) && myCost() + unit > usablePoints()) {
        app.err = `点数不够：再打一个人要多花 ${fmtNum(unit)} 点，你手上只有 ${fmtNum(usablePoints())} 点`;
        toast('点数不够，先点掉一个目标或去「集」');
        render();
        return;
      }
      list.push(tid);
      if (isStack(id)) draft.count = Math.max(draft.count, list.length);
    }
    if (isStack(id)) {
      const m = Math.max(1, list.length);
      draft.count = Math.max(m, Math.min(Math.floor(Math.max(draft.count, m) / m) * m, maxCount(id)));
    }
    app.err = '';
    render();
  }

  function pickAll(id) {
    if (draft.chosen !== id) { toast('先点这张卡片「选用」'); return; }
    const list = foes();
    if (!list.length) { toast('没有可打的人'); return; }
    if (B.ITEMS[id].kind === 'steal') { draft.steal = list.map(p => p.id); render(); return; }
    const stack = isStack(id);
    const cap = maxCount(id);                                  // 已含背包 / 材料 / 点数上限
    const unit = B.unitCost(app.pub, mePlayer(), id);
    const affordable = unit > 0 ? Math.floor(usablePoints() / unit) : 99;
    const maxSel = stack
      ? Math.min(list.length, cap)
      : Math.min(list.length, cap, affordable, maxTargets(id));
    if (maxSel <= 0) { toast('点数不够，先攒点'); return; }
    draft.sel[id] = list.slice(0, maxSel).map(p => p.id);
    if (stack) {
      const m = draft.sel[id].length;
      draft.count = Math.max(m, Math.floor(cap / m) * m);       // 保证能整除
    }
    if (maxSel < list.length) toast(`只能打 ${maxSel} 个人（点数或规则限制）`);
    app.err = '';
    render();
  }

  function nudgeCount(id, d) {
    if (draft.chosen !== id) { toast('先点这张卡片「选用」'); return; }
    const m = Math.max(1, (draft.sel[id] || []).length);
    const cap = maxCount(id);
    const per = Math.max(1, Math.round(draft.count / m));
    const maxPer = Math.max(1, Math.floor(cap / m));
    const next = Math.max(1, Math.min(per + d, maxPer));
    if (next === per) {
      toast(d > 0 ? '到上限了（点数或背包不够）' : '每人至少 1 个');
      return;
    }
    draft.count = next * m;                                     // 按"每人份"加减，天然均分
    app.err = '';
    render();
  }

  function bind() {
    document.addEventListener('click', e => {
      const btn = e.target.closest('[data-act]');
      if (!btn) return;
      const act = btn.getAttribute('data-act');
      const item = btn.getAttribute('data-item');
      const target = btn.getAttribute('data-target');
      if (act === 'maskclose' && e.target.closest('.sheet')) return;

      switch (act) {
        case 'create': ROOM.create(nick()); break;
        case 'join': {
          const code = (($('#codeInput') && $('#codeInput').value) || '').trim().toUpperCase();
          if (code.length < 4) { toast('房间号是 4 位'); return; }
          ROOM.join(code, nick());
          break;
        }
        case 'copy': copyText(app.roomCode); break;
        case 'rules': sheet = 'rules'; renderSheet(); break;
        case 'log': sheet = 'log'; renderSheet(); break;
        case 'close': case 'maskclose': sheet = null; renderSheet(); break;
        case 'leave': ROOM.leave(); break;
        case 'addbot': ROOM.addBot(); break;
        case 'kick': ROOM.kick(btn.getAttribute('data-id')); break;
        case 'start': ROOM.start(); break;
        case 'rematch': ROOM.rematch(); break;
        case 'ready': ROOM.setReady(!(mePlayer() && mePlayer().ready)); break;
        case 'tab': tab = btn.getAttribute('data-tab'); render(); break;
        case 'clear': {
          // 只清空草稿；如果你本来已经锁定过，才顺手把"空手"这个决定提交上去
          const was = mePlayer() && mePlayer().submitted;
          clearDraft();
          app.err = '';
          if (was) ROOM.submit({ items: {}, alloc: {}, steal: [] });
          render();
          break;
        }
        case 'submit': doSubmit(); break;
        case 'choose': chooseItem(item); break;
        case 'inc': case 'dec': nudgeCount(item, act === 'inc' ? +1 : -1); break;
        case 'pick': toggleTarget(item, target); break;
        case 'pick-all': pickAll(item); break;
        default: break;
      }
    });

    document.addEventListener('change', e => {
      const el = e.target.closest('[data-set]');
      if (!el) return;
      const key = el.getAttribute('data-set');
      const val = el.type === 'checkbox' ? el.checked : Number(el.value);
      ROOM.setSetting(key, val);
    });
    document.addEventListener('input', e => {
      if (e.target.id === 'nickInput') { try { localStorage.setItem('badao_nick', e.target.value); } catch (err) { /* 隐私模式忽略 */ } }
      if (e.target.id === 'codeInput') e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
    });

    setInterval(() => {
      if (app.remainMs > 0) { app.remainMs -= 100; renderTimer(); }
    }, 100);

    // 窗口尺寸变了，连线要跟着重算
    let resizeTimer = null;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(drawArrows, 150);
    });
  }

  function doSubmit() {
    if (!canAct()) { toast('现在不是出招阶段'); return; }
    const action = draftAction();
    const v = B.validate(app.pub, app.me, action);
    if (!v.ok) {
      app.err = v.errors.join('；');
      toast(v.errors[0]);
      render();
      return;
    }
    // 空手也能锁：有时候你就是什么都不想做（比如怕被偷）。但得提醒一下兜底规则
    if (!draft.chosen) toast('空手锁定：本回合什么也不做（不锁定的话，超时会自动帮你出「集」）');
    else toast('已锁定，时间到之前还能改');
    app.err = '';
    ROOM.submit(B.normalize(app.pub, app.me, action));
    render();
  }

  /* ---------------------------------------------------------------- 杂项 */
  let toastTimer = null;
  function toast(msg) {
    const old = $('.toast');
    if (old) old.remove();
    const el = document.createElement('div');
    el.className = 'toast';
    el.textContent = msg;
    document.body.appendChild(el);
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.remove(), 2200);
  }

  function copyText(t) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(t).then(() => toast('房间号已复制：' + t), () => toast('复制失败，手动记一下：' + t));
    } else {
      const ta = document.createElement('textarea');
      ta.value = t; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); toast('房间号已复制：' + t); } catch (e) { toast('复制失败，手动记一下：' + t); }
      ta.remove();
    }
  }

  function nick() {
    const inp = $('#nickInput');
    if (inp && inp.value.trim()) return inp.value.trim();
    let saved = '';
    try { saved = localStorage.getItem('badao_nick') || ''; } catch (e) { /* 忽略 */ }
    return saved || ('玩家' + Math.floor(Math.random() * 900 + 100));
  }

  function update(pub, remainMs, remainTotal) {
    app.pub = pub;
    if (remainMs != null) app.remainMs = remainMs;
    if (remainTotal != null) app.remainTotal = remainTotal;
    softRender();
  }

  return {
    app: app, bind: bind, render: render, update: update, toast: toast,
    resetDraft: clearDraft, rulesHtml: rulesHtml
  };
})();
</script>
<script>/* ============================================================================
 * 拔刀 · 联机层
 * 主机（房主）权威：房主持有完整局面，客户端只发"我出什么招"，主机广播公开状态。
 * 房间码 = PeerJS 的 ID（badao3-XXXX），所以不需要任何后台服务器。
 * 如果拿不到联机库 / 没有网络，会自动降级成"只能和电脑玩"的单机房间。
 * ==========================================================================*/
const ROOM = (function () {
  'use strict';
  const B = BADAO;
  const APP = VIEW.app;

  const CODE_CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';   // 去掉 I O 0 1，念起来不歧义
  const PEER_PREFIX = 'badao3-';
  const TICK_MS = 200;
  const BROADCAST_MS = 500;

  const myId = 'u' + Math.random().toString(36).slice(2, 10);
  let peer = null;
  let isHost = false;
  let code = '';
  let state = null;              // 仅主机有
  let conns = [];                // [{conn, id}] 仅主机有
  let deadline = 0;
  let remainTotal = 0;
  let ticker = null;
  let lastBroadcast = 0;
  let joinRetry = 0;
  let myConn = null;             // 仅客户端有

  /* --------------------------------------------------------------- 工具 */
  function randCode() {
    let s = '';
    for (let i = 0; i < 4; i++) s += CODE_CHARS[Math.floor(Math.random() * CODE_CHARS.length)];
    return s;
  }
  const libOK = () => typeof window.Peer === 'function';

  function status(t) { APP.status = t; VIEW.render(); }
  function toast(t) { VIEW.toast(t); }

  function remainMs() { return Math.max(0, deadline - Date.now()); }

  /* --------------------------------------------------------- 主机：广播 */
  function broadcast(force) {
    if (!isHost) return;
    const now = Date.now();
    if (!force && now - lastBroadcast < BROADCAST_MS) return;
    lastBroadcast = now;
    const left = remainMs();
    const base = { t: 'state', remainMs: left, remainTotal: remainTotal, code: code };
    // 每个人的快照不一样：出招阶段别人看不到你的点数/背包，免得被反推
    conns.forEach(c => {
      try { if (c.conn.open) c.conn.send(Object.assign({ pub: B.publicState(state, { viewerId: c.id }) }, base)); }
      catch (e) { /* 单个连接坏了不影响别人 */ }
    });
    APP.roomCode = code;
    VIEW.update(B.publicState(state, { viewerId: myId }), left, remainTotal);
  }

  /* ------------------------------------------------------- 主机：回合流转 */
  function setPhase(phase, sec) {
    state.phase = phase;
    remainTotal = Math.max(0, (sec || 0) * 1000);
    deadline = Date.now() + remainTotal;
    if (phase === 'select') prepareBots();
    broadcast(true);
  }

  function prepareBots() {
    state.players.forEach(p => {
      if (!p.isBot || !p.alive) return;
      p.picks = B.botAction(state, p.id);
      p.submitted = true;
    });
  }

  function allSubmitted() {
    const need = state.players.filter(p => p.alive && !p.isBot && p.connected);
    if (!need.length) return false;
    return need.every(p => p.submitted);
  }

  function settleRound() {
    // 没锁定的人由引擎兜底：自动按「集」结算（B.settle 内部处理）
    B.settle(state);
    if (state.phase === 'over') { deadline = 0; remainTotal = 0; broadcast(true); return; }
    setPhase('reveal', state.settings.revealSec);
  }

  function nextRound() {
    if (state.phase === 'over') { broadcast(true); return; }
    if (state.players.filter(p => p.alive).length <= 1) { state.phase = 'over'; broadcast(true); return; }
    setPhase('select', state.settings.selectSec);
  }

  function tick() {
    if (!isHost) return;
    const left = remainMs();
    if (state.phase === 'select') {
      if (left <= 0) settleRound();
      else if (state.settings.autoAdvance && allSubmitted() && left < remainTotal - 800) settleRound();
      else broadcast(false);
    } else if (state.phase === 'reveal') {
      if (left <= 0) nextRound();
      else broadcast(false);
    }
  }

  function ensureTicker() {
    if (ticker) return;
    ticker = setInterval(tick, TICK_MS);
  }

  /* ------------------------------------------------------ 主机：处理消息 */
  function onHostData(data, conn) {
    if (!data || !data.t) return;
    if (data.t === 'join') {
      const id = String(data.id || '').slice(0, 24) || 'u' + Math.random().toString(36).slice(2, 8);
      const link = conns.find(c => c.conn === conn);
      if (link) link.id = id;
      const exist = B.getPlayer(state, id);
      if (exist) {
        exist.connected = true;
        exist.name = exist.name || data.name;
      } else {
        if (state.players.length >= 12) { try { conn.send({ t: 'err', msg: '房间满了（最多 12 人）' }); } catch (e) { /* 忽略 */ } return; }
        const p = B.addPlayer(state, id, String(data.name || '玩家').slice(0, 8) || '玩家');
        p.connected = true;
        state.log.push(`${p.name} 加入了房间`);
      }
      try { conn.send({ t: 'welcome', code: code, id: id, you: id }); } catch (e) { /* 忽略 */ }
      broadcast(true);
      toast(B.getPlayer(state, id).name + ' 加入了');
      return;
    }
    const link = conns.find(c => c.conn === conn);
    const id = link ? link.id : null;
    if (!id) return;
    if (data.t === 'action') {
      const v = B.validate(state, id, data.action);
      if (!v.ok) { try { conn.send({ t: 'err', msg: v.errors.join('；') }); } catch (e) { /* 忽略 */ } return; }
      const p = B.getPlayer(state, id);
      p.picks = B.normalize(state, id, data.action);
      p.submitted = true;
      broadcast(true);
    }
    if (data.t === 'ready') {
      const p = B.getPlayer(state, id);
      if (p && state.phase === 'lobby') { p.ready = !!data.ready; broadcast(true); }
    }
  }

  /* --------------------------------------------------------------- 建房 */
  function create(name) {
    APP.busy = true;
    name = String(name || '房主').slice(0, 8);
    code = randCode();
    isHost = true;
    state = B.newState();
    state.hostId = myId;
    B.addPlayer(state, myId, name, { isHost: true });
    APP.me = myId;
    APP.isHost = true;
    APP.roomCode = code;
    APP.mode = 'room';
    APP.status = libOK() ? '正在开房…' : '联机服务没加载出来：这一局只能加电脑玩家一起玩（刷新页面可以再试）';
    VIEW.render();
    ensureTicker();     // 一定要先转起来：房主可能在联机服务连上之前就开局

    if (!libOK()) {                  // 降级：单机房间
      broadcast(true);
      return;
    }
    openHostPeer(0);
  }

  function openHostPeer(retry) {
    try { if (peer) peer.destroy(); } catch (e) { /* 忽略 */ }
    peer = new window.Peer(PEER_PREFIX + code, { debug: 1 });
    peer.on('open', () => {
      APP.status = '';
      broadcast(true);
      VIEW.render();
    });
    peer.on('connection', conn => {
      conns.push({ conn: conn, id: null });
      conn.on('data', d => onHostData(d, conn));
      conn.on('open', () => { broadcast(true); });
      conn.on('close', () => {
        const link = conns.find(c => c.conn === conn);
        if (link && link.id) {
          const p = B.getPlayer(state, link.id);
          if (p) { p.connected = false; p.submitted = true; state.log.push(`${p.name} 掉线了`); }
          broadcast(true);
        }
        conns = conns.filter(c => c.conn !== conn);
        VIEW.render();
      });
      conn.on('error', () => { /* 单个连接出错不影响房间 */ });
    });
    peer.on('error', err => {
      const type = err && err.type;
      if (type === 'unavailable-id' && retry < 3) {     // 房间号撞车，换一个
        code = randCode();
        APP.roomCode = code;
        openHostPeer(retry + 1);
        return;
      }
      APP.status = type === 'network' || type === 'server-error' || type === 'socket-error'
        ? '连不上联机服务（可能网络被限制）。你仍然可以加电脑玩家开局，或刷新重试。'
        : '联机出错：' + (err && err.message ? err.message : type || '未知');
      VIEW.render();
    });
    peer.on('disconnected', () => {
      try { peer.reconnect(); } catch (e) { /* 忽略 */ }
    });
  }

  /* --------------------------------------------------------------- 加入 */
  function join(roomCode, name) {
    if (!libOK()) { status('联机服务没加载出来，没法加入别人的房间。刷新页面再试，或自己开房和电脑玩。'); return; }
    code = String(roomCode || '').toUpperCase().trim();
    isHost = false;
    APP.me = myId;
    APP.isHost = false;
    APP.roomCode = code;
    APP.mode = 'room';
    APP.status = '正在连接房间 ' + code + '…';
    VIEW.render();
    openClientPeer(name, 0);
  }

  function openClientPeer(name, retry) {
    try { if (peer) peer.destroy(); } catch (e) { /* 忽略 */ }
    peer = new window.Peer(null, { debug: 1 });
    peer.on('open', () => {
      const conn = peer.connect(PEER_PREFIX + code, { reliable: true });
      myConn = conn;
      const timer = setTimeout(() => {
        if (!conn.open) { failJoin('连接超时：房间号对不对？房主还在房间里吗？'); }
      }, 12000);
      conn.on('open', () => {
        clearTimeout(timer);
        joinRetry = 0;
        APP.status = '';
        conn.send({ t: 'join', name: String(name || '玩家').slice(0, 8), id: myId });
        VIEW.render();
      });
      conn.on('data', d => {
        if (!d || !d.t) return;
        if (d.t === 'state') {
          APP.roomCode = d.code || code;
          VIEW.update(d.pub, d.remainMs, d.remainTotal);
        } else if (d.t === 'err') {
          toast(d.msg);
        }
      });
      conn.on('close', () => {
        clearTimeout(timer);
        if (joinRetry < 3) {
          joinRetry++;
          APP.status = '和房主断开了，正在重连…（' + joinRetry + '/3）';
          VIEW.render();
          setTimeout(() => openClientPeer(name, joinRetry), 1500);
        } else {
          failJoin('房主离开了房间');
        }
      });
      conn.on('error', () => { clearTimeout(timer); failJoin('连接出错，房间可能已经关了'); });
    });
    peer.on('error', err => {
      const type = err && err.type;
      if (type === 'peer-unavailable') failJoin('没找到房间 ' + code + '（房间号写错？或者房主已经退出了）');
      else failJoin('联机出错：' + (err && err.message ? err.message : type || '未知'));
    });
  }

  function failJoin(msg) {
    APP.status = msg;
    APP.mode = 'home';
    APP.pub = null;
    VIEW.resetDraft();
    VIEW.render();
    if (peer) { try { peer.destroy(); } catch (e) { /* 忽略 */ } peer = null; }
  }

  /* --------------------------------------------------------- 主机操作 */
  function start() {
    if (!isHost || !state) return;
    if (state.players.length < 2) { toast('至少要 2 个人（可以加电脑玩家）'); return; }
    if (state.phase !== 'lobby') return;              // 防连点：已经在局内就别重开
    const notReady = state.players.filter(p => p.connected && !p.ready);
    if (notReady.length) {
      toast(`还有 ${notReady.length} 人没准备：${notReady.map(p => p.name).join('、')}`);
      return;
    }
    ensureTicker();
    state.round = 1;
    state.winner = null;
    state.players.forEach(p => { p.picks = B.emptyPicks(); p.submitted = false; });
    APP.mode = 'game';
    setPhase('select', state.settings.selectSec);
  }

  /** 准备 / 取消准备（房主自己也算一个，必须所有玩家都点头） */
  function setReady(ready) {
    if (isHost) {
      if (!state) return;
      const p = B.getPlayer(state, myId);
      if (p) { p.ready = !!ready; broadcast(true); }
    } else if (myConn && myConn.open) {
      myConn.send({ t: 'ready', ready: !!ready });
    } else {
      toast('还没连上房主，稍等再试');
    }
  }

  function addBot() {
    if (!isHost || !state) return;
    if (state.players.length >= 12) { toast('房间满了'); return; }
    const n = state.players.filter(p => p.isBot).length + 1;
    const names = ['刀客', '阿飞', '老六', '铁憨憨', '小刀', '摸鱼王', '夜行者', '大聪明'];
    const p = B.addPlayer(state, 'bot' + Date.now() + n, names[(n - 1) % names.length] + (n > names.length ? n : ''), { isBot: true });
    p.ready = true;                      // 电脑永远算准备好了，不挡开局
    state.log.push(`${p.name}（电脑）加入了房间`);
    broadcast(true);
  }

  function kick(id) {
    if (!isHost || !state) return;
    const p = B.getPlayer(state, id);
    if (!p || p.isHost) return;
    state.players = state.players.filter(x => x.id !== id);
    const link = conns.find(c => c.id === id);
    if (link) {
      try { link.conn.send({ t: 'err', msg: '你被房主移出了房间' }); link.conn.close(); } catch (e) { /* 忽略 */ }
      conns = conns.filter(c => c !== link);
    }
    state.log.push(`${p.name} 被移出房间`);
    broadcast(true);
  }

  function setSetting(key, value) {
    if (!isHost || !state) return;
    if (key === 'pack.hp' || key === 'pack.rainbow' || key === 'pack.self') {
      state.settings.packs[key.split('.')[1]] = !!value;
    } else if (key === 'selectSec') {
      state.settings.selectSec = Math.min(600, Math.max(3, Number(value) || 5));
    } else if (key === 'revealSec') {
      state.settings.revealSec = Math.min(120, Math.max(2, Number(value) || 3));
    } else if (key === 'autoAdvance') {
      state.settings.autoAdvance = !!value;
    } else if (key === 'ecoOpen') {
      state.settings.ecoOpen = !!value;
    }
    broadcast(true);
  }

  function rematch() {
    if (!isHost || !state) return;
    state.players.forEach(p => {
      p.alive = true; p.hp = 0; p.points = 0;
      p.bag = { jingxue: 0, jianqi: 0, tianlei: 0, feimei: 0 };
      p.picks = B.emptyPicks(); p.submitted = false;
      p.selfGuardUntil = -1; p.selfGuardTriggered = false; p.inDuel = false; p.duel = null;
      p.ready = p.isBot;                 // 再来一局要重新确认一遍（电脑除外）
    });
    state.round = 1;
    state.winner = null;
    state.phase = 'lobby';
    state.log = [];
    state.lastResult = null;
    APP.mode = 'room';
    VIEW.resetDraft();
    broadcast(true);
  }

  /* ------------------------------------------------------------ 出招提交 */
  function submit(action) {
    if (!state && !isHost && !myConn) return;
    if (isHost) {
      if (!state || state.phase !== 'select') return;
      const p = B.getPlayer(state, myId);
      if (!p || !p.alive) return;
      p.picks = B.normalize(state, myId, action);
      p.submitted = true;
      broadcast(true);
    } else {
      if (myConn && myConn.open) myConn.send({ t: 'action', action: action });
      else toast('还没连上房主，稍等再试');
    }
  }

  function leave() {
    try { if (myConn) myConn.close(); } catch (e) { /* 忽略 */ }
    try { if (peer) peer.destroy(); } catch (e) { /* 忽略 */ }
    peer = null; myConn = null; conns = [];
    if (ticker) { clearInterval(ticker); ticker = null; }
    isHost = false; state = null; code = '';
    APP.mode = 'home'; APP.pub = null; APP.status = ''; APP.roomCode = '';
    APP.isHost = false; APP.me = null; APP.remainMs = 0;
    VIEW.resetDraft();
    VIEW.render();
  }

  return {
    create: create, join: join, start: start, addBot: addBot, kick: kick,
    setSetting: setSetting, rematch: rematch, submit: submit, leave: leave, setReady: setReady,
    isHost: () => isHost, code: () => code, myId: () => myId
  };
})();
</script>
<script>
  // 联机库姗姗来迟时，把"连不上"的提示撤掉
  window.__peerReady = function () {
    if (VIEW.app.status && /联机服务/.test(VIEW.app.status)) {
      VIEW.app.status = '';
      VIEW.render();
    }
  };
  VIEW.bind();
  VIEW.render();
</script>
</body>
</html>
